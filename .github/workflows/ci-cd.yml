name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Continuous Integration
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Run linter
      uses: golangci/golangci-lint-action@v4
      with:
        version: latest
        args: --timeout=5m

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run CodeQL analysis
      uses: github/codeql-action/init@v3
      with:
        languages: go

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

    - name: Build binary
      run: go build -o relay ./cmd/relay

    - name: Build Docker image
      run: docker build -t $IMAGE_NAME:${{ github.sha }} .

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true

    - name: Install Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        # Install gosec
        go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
        
        # Install safety for Python dependencies
        pip install safety==3.5.2
        
        # Install jq for JSON processing
        sudo apt-get update && sudo apt-get install -y jq

    - name: Run comprehensive Go security scan
      run: |
        # Run gosec with detailed output
        gosec -fmt json -out gosec-results.json ./...
        gosec -fmt text -out gosec-results.txt ./...
        gosec -fmt html -out gosec-results.html ./...
        
        # Check for critical issues
        if jq -e '.Issues[] | select(.severity == "HIGH" or .severity == "CRITICAL")' gosec-results.json > /dev/null 2>&1; then
          echo "❌ CRITICAL or HIGH security issues found!"
          jq -r '.Issues[] | select(.severity == "HIGH" or .severity == "CRITICAL") | "\(.severity): \(.rule_id) - \(.details) in \(.file):\(.line)"' gosec-results.json
          exit 1
        else
          echo "✅ No CRITICAL or HIGH security issues found"
        fi

    - name: Run Python dependency security scan
      run: |
        # Check ML requirements
        if [ -f "ml/requirements.txt" ]; then
          safety check -r ml/requirements.txt --json --output ml-security-results.json
          echo "ML dependencies security check completed"
        fi
        
        # Check SIEM requirements
        if [ -f "siem/requirements.txt" ]; then
          safety check -r siem/requirements.txt --json --output siem-security-results.json
          echo "SIEM dependencies security check completed"
        fi

    - name: Run custom security scripts
      run: |
        # Make scripts executable
        chmod +x scripts/security/*.sh
        
        # Run comprehensive security audit
        ./scripts/security/security_audit_report.sh --quick
        
        # Run Go security check
        ./scripts/security/check_go_security.sh --text
        
        # Run dependency security check
        ./scripts/security/check_dependencies_security.sh --json

    - name: Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        args: --only-verified --format json --output trufflehog-results.json

    - name: Run dependency vulnerability scan
      run: |
        # Install and run nancy for Go dependencies
        go install github.com/sonatype-nexus-community/nancy@latest
        go list -json -deps ./... | nancy sleuth --output json > nancy-results.json

    - name: Upload security artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          gosec-results.*
          *-security-results.json
          trufflehog-results.json
          nancy-results.json
          security_reports/

    - name: Upload SARIF results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'gosec-results.json'

    - name: Security summary
      run: |
        echo "🔒 SECURITY SCAN SUMMARY"
        echo "========================"
        
        # Go security summary
        if [ -f "gosec-results.json" ]; then
          TOTAL_ISSUES=$(jq '.Issues | length' gosec-results.json)
          HIGH_ISSUES=$(jq '.Issues[] | select(.severity == "HIGH") | .rule_id' gosec-results.json | wc -l)
          CRITICAL_ISSUES=$(jq '.Issues[] | select(.severity == "CRITICAL") | .rule_id' gosec-results.json | wc -l)
          
          echo "Go Security (gosec):"
          echo "  - Total issues: $TOTAL_ISSUES"
          echo "  - High severity: $HIGH_ISSUES"
          echo "  - Critical severity: $CRITICAL_ISSUES"
        fi
        
        # Python security summary
        if [ -f "ml-security-results.json" ]; then
          ML_VULNS=$(jq '.vulnerabilities | length' ml-security-results.json)
          echo "ML Dependencies: $ML_VULNS vulnerabilities"
        fi
        
        if [ -f "siem-security-results.json" ]; then
          SIEM_VULNS=$(jq '.vulnerabilities | length' siem-security-results.json)
          echo "SIEM Dependencies: $SIEM_VULNS vulnerabilities"
        fi
        
        echo "========================"

  # Performance testing
  performance:
    name: Performance Test
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Run benchmarks
      run: |
        go test -bench=. -benchmem ./internal/... > benchmark-results.txt
        cat benchmark-results.txt

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmark-results.txt

  # Build and push Docker image
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [test, security, performance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Deploy to staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig

    - name: Deploy to staging
      run: |
        kubectl set image deployment/relay relay=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -n staging
        kubectl rollout status deployment/relay -n staging

    - name: Run smoke tests
      run: |
        # Wait for deployment to be ready
        sleep 30
        # Run basic health checks
        curl -f http://staging-relay.example.com/health || exit 1

  # Deploy to production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig

    - name: Deploy to production
      run: |
        kubectl set image deployment/relay relay=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -n production
        kubectl rollout status deployment/relay -n production

    - name: Run production tests
      run: |
        # Wait for deployment to be ready
        sleep 60
        # Run comprehensive health checks
        curl -f http://prod-relay.example.com/health || exit 1
        curl -f http://prod-relay.example.com/metrics || exit 1

  # Notifications
  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()
    
    steps:
    - name: Notify Slack
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      if: always()

    - name: Create deployment status
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.repos.createDeploymentStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            deployment_id: context.payload.deployment.id,
            state: '${{ job.status }}',
            environment_url: 'https://prod-relay.example.com'
          })
      if: always() 