name: 🐳 Build Docker Images (Local Development)

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (relay, ai, cadence, quic, wireguard, all)'
        required: false
        default: 'all'
        type: choice
        options:
        - all
        - relay
        - ai
        - cadence
        - quic
        - wireguard
      version:
        description: 'Version tag'
        required: false
        default: 'latest'

env:
  REGISTRY_IP: ${{ secrets.REGISTRY_IP }}
  REGISTRY_PORT: 5000
  REGISTRY_URL: ${{ secrets.REGISTRY_IP }}:5000
  REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  REGISTRY_NAMESPACE: cloudbridge

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Получаем полную историю для git describe
    
    - name: 🔧 Setup environment
      run: |
        # Устанавливаем переменные окружения
        echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        echo "BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')" >> $GITHUB_ENV
        echo "GIT_COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV
        
        # Если это не тег, используем SHA
        if [[ "$GITHUB_REF" != refs/tags/* ]]; then
          echo "VERSION=${GITHUB_SHA::8}" >> $GITHUB_ENV
        fi
        
        echo "Building version: $VERSION"
    
    - name: 🐳 Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 🔐 Skip Registry Login (Local Only)
      run: |
        echo "ℹ️ Skipping registry login - local development only"
        echo "ℹ️ Docker images will be built locally but not pushed"
        echo "ℹ️ For production deployment, configure VK Cloud Registry secrets"
    
    - name: 🔍 Skip Registry Check (Local Only)
      run: |
        echo "ℹ️ Skipping registry connection check - local development only"
        echo "ℹ️ Registry connection will be checked during local deployment"
    
    - name: 🏗️ Build images locally
      run: |
        # Определяем сервисы для сборки
        if [[ "${{ github.event.inputs.service }}" == "all" ]] || [[ "${{ github.event.inputs.service }}" == "" ]]; then
          SERVICES=("relay" "ai" "cadence" "quic" "wireguard")
        else
          SERVICES=("${{ github.event.inputs.service }}")
        fi
        
        echo "Building services locally: ${SERVICES[*]}"
        
        for service in "${SERVICES[@]}"; do
          echo "🔨 Building $service service..."
          
          # Проверяем существование Dockerfile
          if [[ ! -f "Dockerfile.$service" ]]; then
            echo "⚠️ Dockerfile.$service not found, skipping"
            continue
          fi
          
          # Собираем образ локально
          docker build \
            --build-arg VERSION="$VERSION" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            --build-arg GIT_COMMIT="$GIT_COMMIT" \
            -f "Dockerfile.$service" \
            -t "cloudbridge/$service:$VERSION" \
            -t "cloudbridge/$service:latest" \
            .
          
          echo "✅ $service service built locally"
        done
    
    - name: 🔍 Verify local images
      run: |
        # Проверяем, что образы собраны локально
        for service in relay ai cadence quic wireguard; do
          echo "🔍 Verifying $service image..."
          
          # Проверяем наличие образа локально
          if docker images | grep -q "cloudbridge/$service"; then
            echo "✅ $service image built locally"
          else
            echo "⚠️ $service image not found locally (may have been skipped)"
          fi
        done
    
    - name: 📋 Generate build report
      run: |
        echo "## 🐳 Local Docker Build Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Type:** Local Development" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
        echo "**Build Time:** $BUILD_TIME" >> $GITHUB_STEP_SUMMARY
        echo "**Git Commit:** $GIT_COMMIT" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Built Images:" >> $GITHUB_STEP_SUMMARY
        for service in relay ai cadence quic wireguard; do
          echo "- \`cloudbridge/$service:$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`cloudbridge/$service:latest\`" >> $GITHUB_STEP_SUMMARY
        done
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔧 Local Usage:" >> $GITHUB_STEP_SUMMARY
        echo "```bash" >> $GITHUB_STEP_SUMMARY
        echo "# Run container locally" >> $GITHUB_STEP_SUMMARY
        echo "docker run -d cloudbridge/relay:$VERSION" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "# For production deployment, configure VK Cloud Registry" >> $GITHUB_STEP_SUMMARY
        echo "```" >> $GITHUB_STEP_SUMMARY

  # deploy-to-k8s job removed - local development only
  # For production deployment, configure VK Cloud Kubernetes cluster and secrets
