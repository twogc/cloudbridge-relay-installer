name: Weekly Security Audit

on:
  schedule:
    # Run every Monday at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  security-audit:
    name: Comprehensive Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'
        cache: false

    - name: Install Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        # Install gosec
        go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
        
        # Install safety for Python dependencies
        pip install safety==3.5.2
        
        # Install additional security tools
        sudo apt-get update && sudo apt-get install -y jq lynis
        
        # Install nancy for Go dependencies
        go install github.com/sonatype-nexus-community/nancy@latest

    - name: Run basic security audit
      run: |
        echo "🔒 Running basic security audit..."
        
        # Create security reports directory
        mkdir -p security_reports
        
        # Run gosec for Go security
        echo "Running gosec security scan..."
        gosec -fmt text -out security_reports/gosec_report.txt ./... || {
          echo "⚠️ gosec found issues, but continuing..."
        }
        
        # Run nancy for dependency vulnerabilities
        echo "Running nancy dependency scan..."
        go list -json -deps ./... | nancy sleuth --output json > security_reports/nancy_results.json || {
          echo "⚠️ nancy found issues, but continuing..."
        }
        
        echo "✅ Basic security audit completed"

    - name: Run additional security checks
      run: |
        echo "🔍 Running additional security checks..."
        
        # Check for outdated dependencies
        echo "Checking for outdated Go dependencies..."
        go list -u -m all > security_reports/go-dependencies-update.txt || true
        
        # Check for Python dependencies (if any)
        if [ -f "requirements.txt" ]; then
          echo "Checking Python dependencies..."
          safety check -r requirements.txt --json --output security_reports/python-security-results.json || true
        fi
        
        echo "✅ Additional security checks completed"

    - name: Create security report
      run: |
        echo "# Security Audit Report - $(date)" > security-audit-report.md
        echo "" >> security-audit-report.md
        echo "## Summary" >> security-audit-report.md
        echo "" >> security-audit-report.md
        
        # Add Go security summary
        if [ -f "security_reports/gosec_report.txt" ]; then
          echo "### Go Security Issues" >> security-audit-report.md
          echo '```' >> security-audit-report.md
          cat security_reports/gosec_report.txt >> security-audit-report.md
          echo '```' >> security-audit-report.md
          echo "" >> security-audit-report.md
        fi
        
        # Add dependency update recommendations
        if [ -f "security_reports/go-dependencies-update.txt" ]; then
          echo "### Go Dependencies Update Recommendations" >> security-audit-report.md
          echo '```' >> security-audit-report.md
          cat security_reports/go-dependencies-update.txt >> security-audit-report.md
          echo '```' >> security-audit-report.md
          echo "" >> security-audit-report.md
        fi
        
        echo "## Report Files" >> security-audit-report.md
        echo "- gosec_report.txt: Go security scan results" >> security-audit-report.md
        echo "- nancy_results.json: Dependency vulnerability scan" >> security-audit-report.md
        echo "- go-dependencies-update.txt: Outdated dependencies" >> security-audit-report.md

    - name: Upload security artifacts
      uses: actions/upload-artifact@v4
      with:
        name: weekly-security-audit-$(date +%Y%m%d)
        path: |
          security_reports/
          security-audit-report.md

    - name: Security audit summary
      run: |
        echo "## 🔒 Security Audit Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** Completed" >> $GITHUB_STEP_SUMMARY
        echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Reports Generated:" >> $GITHUB_STEP_SUMMARY
        echo "- Go security scan (gosec)" >> $GITHUB_STEP_SUMMARY
        echo "- Dependency vulnerabilities (nancy)" >> $GITHUB_STEP_SUMMARY
        echo "- Outdated dependencies check" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Check the uploaded artifacts for detailed reports." >> $GITHUB_STEP_SUMMARY 