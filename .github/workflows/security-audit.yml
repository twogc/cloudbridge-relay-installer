name: Weekly Security Audit

on:
  schedule:
    # Run every Monday at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  security-audit:
    name: Comprehensive Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        cache: true

    - name: Install Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        # Install gosec
        go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
        
        # Install safety for Python dependencies
        pip install safety==3.5.2
        
        # Install additional security tools
        sudo apt-get update && sudo apt-get install -y jq lynis
        
        # Install nancy for Go dependencies
        go install github.com/sonatype-nexus-community/nancy@latest

    - name: Run comprehensive security audit
      run: |
        # Make scripts executable
        chmod +x scripts/security/*.sh
        
        # Run full security audit
        ./scripts/security/security_audit_report.sh --verbose
        
        # Generate detailed reports
        ./scripts/security/check_go_security.sh --html
        ./scripts/security/check_dependencies_security.sh --verbose

    - name: Run additional security checks
      run: |
        # Run lynis system audit (if applicable)
        if command -v lynis &> /dev/null; then
          lynis audit system --quick > lynis-report.txt 2>&1 || true
        fi
        
        # Check for outdated dependencies
        go list -u -m all > go-dependencies-update.txt
        
        # Check for known vulnerabilities in dependencies
        go list -json -deps ./... | nancy sleuth --output json > nancy-full-results.json

    - name: Create security report
      run: |
        echo "# Security Audit Report - $(date)" > security-audit-report.md
        echo "" >> security-audit-report.md
        echo "## Summary" >> security-audit-report.md
        echo "" >> security-audit-report.md
        
        # Add Go security summary
        if [ -f "security_reports/gosec_report.txt" ]; then
          echo "### Go Security Issues" >> security-audit-report.md
          echo '```' >> security-audit-report.md
          cat security_reports/gosec_report.txt >> security-audit-report.md
          echo '```' >> security-audit-report.md
          echo "" >> security-audit-report.md
        fi
        
        # Add Python security summary
        if [ -f "security_reports/ml_requirements_security_report.json" ]; then
          echo "### ML Dependencies Security" >> security-audit-report.md
          echo '```json' >> security-audit-report.md
          cat security_reports/ml_requirements_security_report.json >> security-audit-report.md
          echo '```' >> security-audit-report.md
          echo "" >> security-audit-report.md
        fi
        
        if [ -f "security_reports/siem_requirements_security_report.json" ]; then
          echo "### SIEM Dependencies Security" >> security-audit-report.md
          echo '```json' >> security-audit-report.md
          cat security_reports/siem_requirements_security_report.json >> security-audit-report.md
          echo '```' >> security-audit-report.md
          echo "" >> security-audit-report.md
        fi
        
        # Add dependency update recommendations
        if [ -f "go-dependencies-update.txt" ]; then
          echo "### Go Dependencies Update Recommendations" >> security-audit-report.md
          echo '```' >> security-audit-report.md
          cat go-dependencies-update.txt >> security-audit-report.md
          echo '```' >> security-audit-report.md
          echo "" >> security-audit-report.md
        fi

    - name: Upload security artifacts
      uses: actions/upload-artifact@v4
      with:
        name: weekly-security-audit-$(date +%Y%m%d)
        path: |
          security_reports/
          security-audit-report.md
          lynis-report.txt
          go-dependencies-update.txt
          nancy-full-results.json

    - name: Create security issue if vulnerabilities found
      uses: actions/github-script@v7
      if: failure()
      with:
        script: |
          const fs = require('fs');
          
          let issueBody = `# 🚨 Security Audit Failed
          
          Weekly security audit has detected vulnerabilities that require attention.
          
          ## Audit Date
          ${new Date().toISOString()}
          
          ## Summary
          Please review the attached security reports and address the identified issues.
          
          ## Next Steps
          1. Review the security audit artifacts
          2. Prioritize and fix critical vulnerabilities
          3. Update dependencies as needed
          4. Re-run security checks after fixes
          
          ## Reports
          - Security audit report: [Download artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
          `;
          
          // Check for specific issues
          try {
            if (fs.existsSync('security_reports/gosec_report.txt')) {
              const gosecReport = fs.readFileSync('security_reports/gosec_report.txt', 'utf8');
              if (gosecReport.includes('HIGH') || gosecReport.includes('CRITICAL')) {
                issueBody += '\n## Go Security Issues\n```\n' + gosecReport + '\n```\n';
              }
            }
          } catch (error) {
            console.log('Could not read gosec report:', error.message);
          }
          
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '🚨 Security Audit Alert - ' + new Date().toISOString().split('T')[0],
            body: issueBody,
            labels: ['security', 'audit', 'high-priority']
          });

    - name: Notify team about security audit
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        channel: '#security'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        text: |
          🔒 Weekly Security Audit: ${{ job.status }}
          Repository: ${{ github.repository }}
          Run: ${{ github.serverUrl }}/${{ github.repository }}/actions/runs/${{ github.runId }} 