name: 🚀 Staging Deployment Pipeline

on:
  push:
    branches: [ develop, staging ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag to deploy'
        required: true
        default: 'staging'
        type: string
      skip-tests:
        description: 'Skip tests (for emergency deployments)'
        required: false
        default: false
        type: boolean
      force-deploy:
        description: 'Force deployment even if checks fail'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NAMESPACE: cloudbridge-staging
  ENVIRONMENT: staging

jobs:
  # ========================================
  # PRE-DEPLOYMENT CHECKS
  # ========================================
  pre-deployment:
    name: 🔍 Pre-deployment Checks
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-tests }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name:  Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: 🔐 Configure kubectl
        run: |
          # Configure kubectl for staging cluster
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl cluster-info

      - name: 🔍 Check cluster connectivity
        run: |
          export KUBECONFIG=kubeconfig
          kubectl get nodes
          kubectl get namespaces

      - name: 🔍 Check existing deployment
        run: |
          export KUBECONFIG=kubeconfig
          if kubectl get namespace ${{ env.NAMESPACE }} &>/dev/null; then
            echo "Namespace ${{ env.NAMESPACE }} exists"
            kubectl get deployments -n ${{ env.NAMESPACE }}
          else
            echo "Namespace ${{ env.NAMESPACE }} does not exist"
          fi

  # ========================================
  # BUILD & PUSH IMAGE
  # ========================================
  build:
    name: 🔨 Build & Push Image
    runs-on: ubuntu-latest
    needs: pre-deployment
    if: always() && (needs.pre-deployment.result == 'success' || needs.pre-deployment.result == 'skipped')
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.image-tag || 'staging' }}
            type=raw,value=${{ inputs.image-tag || 'staging' }}-${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.image-tag || 'staging' }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # DEPLOY TO STAGING
  # ========================================
  deploy:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name:  Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: 🔐 Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: 🚀 Deploy to staging
        run: |
          export KUBECONFIG=kubeconfig
          export IMAGE_TAG="${{ inputs.image-tag || 'staging' }}"
          export REGISTRY="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          export NAMESPACE="${{ env.NAMESPACE }}"
          
          # Make deployment script executable
          chmod +x ./scripts/deployment/deploy-staging.sh
          
          # Deploy to staging
          ./scripts/deployment/deploy-staging.sh \
            --image-tag "$IMAGE_TAG" \
            --registry "$REGISTRY" \
            --namespace "$NAMESPACE"

      - name: 🔍 Verify deployment
        run: |
          export KUBECONFIG=kubeconfig
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get services -n ${{ env.NAMESPACE }}
          kubectl get deployments -n ${{ env.NAMESPACE }}

  # ========================================
  # RUN COMPREHENSIVE TESTS
  # ========================================
  test:
    name: 🧪 Run Comprehensive Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ !inputs.skip-tests }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name:  Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: 🔐 Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: 🧪 Run comprehensive test suite
        run: |
          export KUBECONFIG=kubeconfig
          export NAMESPACE="${{ env.NAMESPACE }}"
          
          # Make test script executable
          chmod +x ./scripts/testing/comprehensive_test_suite.sh
          
          # Run comprehensive tests
          ./scripts/testing/comprehensive_test_suite.sh \
            --namespace "$NAMESPACE" \
            --duration 300 \
            --users 100

      - name: 📤 Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: staging-test-results
          path: test-results/
          retention-days: 30

  # ========================================
  # PERFORMANCE TESTING
  # ========================================
  performance-test:
    name: ⚡ Performance Testing
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ !inputs.skip-tests }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name:  Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: 🔐 Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: ⚡ Run load tests
        run: |
          export KUBECONFIG=kubeconfig
          export NAMESPACE="${{ env.NAMESPACE }}"
          
          # Make load test script executable
          chmod +x ./scripts/testing/load_test.sh
          
          # Run load tests
          ./scripts/testing/load_test.sh \
            --namespace "$NAMESPACE" \
            --duration 600 \
            --users 200

      - name: 📤 Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: staging-performance-results
          path: test-results/
          retention-days: 30

  # ========================================
  # SECURITY TESTING
  # ========================================
  security-test:
    name: 🔒 Security Testing
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ !inputs.skip-tests }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name:  Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: 🔐 Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: 🔒 Run security tests
        run: |
          export KUBECONFIG=kubeconfig
          export NAMESPACE="${{ env.NAMESPACE }}"
          
          # Run security scan
          chmod +x ./security/scanning/security-scan.sh
          ./security/scanning/security-scan.sh

      - name: 📤 Upload security results
        uses: actions/upload-artifact@v4
        with:
          name: staging-security-results
          path: security_reports/
          retention-days: 30

  # ========================================
  # MONITORING SETUP
  # ========================================
  monitoring:
    name: 📊 Setup Monitoring
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name:  Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: 🔐 Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: 📊 Deploy monitoring stack
        run: |
          export KUBECONFIG=kubeconfig
          export NAMESPACE="${{ env.NAMESPACE }}"
          
          # Deploy Prometheus and Grafana
          kubectl apply -f ./k8s/monitoring/prometheus-deployment.yaml
          kubectl apply -f ./k8s/monitoring/grafana-deployment.yaml
          
          # Wait for monitoring to be ready
          kubectl wait --for=condition=available --timeout=300s deployment/prometheus -n monitoring
          kubectl wait --for=condition=available --timeout=300s deployment/grafana -n monitoring

  # ========================================
  # NOTIFICATIONS
  # ========================================
  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [deploy, test, performance-test, security-test, monitoring]
    if: always()
    
    steps:
      - name: 📢 Success notification
        if: needs.deploy.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
        run: |
          echo "CloudBridge Relay staging deployment completed successfully!"
          echo "Environment: ${{ env.ENVIRONMENT }}"
          echo "Namespace: ${{ env.NAMESPACE }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.image-tag || 'staging' }}"

      - name: 📢 Failure notification
        if: needs.deploy.result == 'failure' || needs.test.result == 'failure'
        run: |
          echo "❌ CloudBridge Relay staging deployment failed!"
          echo "Deploy: ${{ needs.deploy.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Performance: ${{ needs.performance-test.result }}"
          echo "Security: ${{ needs.security-test.result }}"
          exit 1

      - name: 📢 Partial success notification
        if: needs.deploy.result == 'success' && needs.test.result == 'failure'
        run: |
          echo " CloudBridge Relay staging deployment succeeded but tests failed!"
          echo "Deploy: ${{ needs.deploy.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Please check test results and fix issues before promoting to production."

