linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - ineffassign
    - gosec
    - misspell
    - whitespace
    - goconst
    - gocyclo
    - dupl
    - gocritic
    - godot
    - goimports
    - revive
    - stylecheck
    - unused
  disable:
    - golint  # Deprecated

linters-settings:
  gocyclo:
    min-complexity: 25  # Увеличено для текущего этапа
  dupl:
    threshold: 150  # Увеличено для текущего этапа
  goconst:
    min-len: 3
    min-occurrences: 4
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
    disabled-checks:
      - hugeParam  # Отключено для текущего этапа
      - paramTypeCombine  # Отключено для текущего этапа
  govet:
    enable:
      - shadow
  gosimple:
    checks:
      - all
  staticcheck:
    checks:
      - all
  stylecheck:
    checks:
      - all
    initialisms:
      - ACL
      - API
      - ASCII
      - CPU
      - CSS
      - DNS
      - EOF
      - GUID
      - HTML
      - HTTP
      - HTTPS
      - ID
      - IP
      - JSON
      - JWT
      - QPS
      - RAM
      - RPC
      - SLA
      - SMTP
      - SQL
      - SSH
      - TCP
      - TLS
      - TTL
      - UDP
      - UI
      - UID
      - UUID
      - URI
      - URL
      - UTF8
      - VM
      - XML
      - XMPP
      - XSRF
      - XSS
  revive:
    severity: warning
    rules:
      - name: unused-parameter
        severity: warning
        disabled: true  # Отключено временно
      - name: exported
        severity: warning
        disabled: true  # Отключено временно

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - gocyclo
        - gosec
        - goconst
        - gocritic
        - stylecheck
        - unused
    - path: internal/integration/
      linters:
        - unused
        - dupl
    - path: cmd/relay/
      linters:
        - gocyclo  # Отключено для main.go
    - text: "shadow: declaration of"
      linters:
        - govet
  exclude-dirs:
    - vendor
    - build
    - .git
    - dist
    - logs
    - temp

run:
  timeout: 10m
  modules-download-mode: readonly
  allow-parallel-runners: true