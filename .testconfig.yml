# CloudBridge Relay - Test Configuration
# Конфигурация для тестирования и покрытия кода

# Настройки покрытия
coverage:
  # Минимальное покрытие для прохождения CI
  minimum: 80
  # Целевое покрытие
  target: 85
  # Покрытие для критических компонентов
  critical: 90
  
  # Исключения из покрытия
  exclude:
    - "**/main.go"           # Главные функции
    - "**/test/**"           # Тестовые файлы
    - "**/mock/**"           # Mock объекты
    - "**/vendor/**"         # Внешние зависимости
    - "**/reference-repos/**" # Референсные репозитории
    - "**/cmd/**/main.go"    # Главные функции команд

# Настройки тестов
testing:
  # Таймаут для тестов
  timeout: "10m"
  
  # Параллельные тесты
  parallel: 4
  
  # Покрытие в режиме race detection
  race: true
  
  # Детальный вывод
  verbose: true
  
  # Покрытие в атомарном режиме
  atomic: true

# Критические компоненты для тестирования
critical_components:
  - "internal/token"         # Аутентификация
  - "internal/auth"          # Авторизация
  - "internal/p2p"           # P2P функциональность
  - "internal/api"           # API endpoints
  - "internal/quic"          # QUIC протокол
  - "internal/keycloak"      # Keycloak интеграция
  - "config"                 # Конфигурация

# Компоненты среднего приоритета
medium_priority:
  - "internal/ai"            # AI/ML функциональность
  - "internal/cadence"       # Cadence workflows
  - "internal/wireguard"     # WireGuard интеграция
  - "internal/tenant"        # Multi-tenancy

# Компоненты низкого приоритета
low_priority:
  - "internal/logger"        # Логирование
  - "internal/errors"        # Обработка ошибок
  - "internal/metrics"       # Метрики
  - "internal/health"        # Health checks

# Настройки отчетности
reporting:
  # Форматы отчетов
  formats:
    - "html"                 # HTML отчет
    - "json"                 # JSON отчет
    - "xml"                  # XML отчет (для CI)
    - "text"                 # Текстовый отчет
  
  # Выходные файлы
  output:
    html: "coverage.html"
    json: "coverage.json"
    xml: "coverage.xml"
    text: "coverage.txt"
  
  # Показывать функции без покрытия
  show_uncovered: true
  
  # Показывать покрытие по функциям
  show_functions: true

# Настройки CI/CD
ci:
  # Покрытие для CI
  coverage_threshold: 80
  
  # Уведомления при снижении покрытия
  notify_on_decrease: true
  
  # Интеграция с Codecov
  codecov:
    enabled: true
    token: "${CODECOV_TOKEN}"
  
  # Интеграция с GitHub
  github:
    enabled: true
    comment_on_pr: true
    status_check: true

# Настройки производительности
performance:
  # Бенчмарки
  benchmarks: true
  
  # Профилирование
  profiling: true
  
  # Тесты памяти
  memory_tests: true
  
  # Нагрузочные тесты
  load_tests: true

# Настройки интеграционных тестов
integration:
  # Запуск интеграционных тестов
  enabled: true
  
  # Таймаут для интеграционных тестов
  timeout: "30m"
  
  # Тестовые данные
  test_data:
    enabled: true
    path: "testdata/"
  
  # Моки внешних сервисов
  mocks:
    enabled: true
    path: "internal/testutils/mocks/"

# Настройки безопасности
security:
  # Тесты безопасности
  enabled: true
  
  # Сканирование секретов в тестах
  secret_scanning: true
  
  # Тесты на уязвимости
  vulnerability_tests: true
