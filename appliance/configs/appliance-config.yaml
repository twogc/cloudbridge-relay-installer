# CloudBridge Appliance Configuration
# Optimized for appliance deployment

# Application settings
app:
  name: "CloudBridge Appliance"
  version: "1.0.0"
  mode: "appliance"
  log_level: "info"
  debug: false

# Server configuration
server:
  host: "0.0.0.0"
  port: 8444
  grpc_port: 8444
  http_port: 8080
  tls:
    enabled: true
    cert_file: "/etc/cloudbridge/ssl/server.crt"
    key_file: "/etc/cloudbridge/ssl/server.key"
    ca_file: "/etc/cloudbridge/ssl/ca.crt"

# Relay configuration
relay:
  enabled: true
  mode: "appliance"
  throughput_limit: "2Gbps"
  max_connections: 1000
  connection_timeout: "30s"
  keepalive_interval: "10s"
  
  # QUIC configuration
  quic:
    enabled: true
    port: 5553
    max_idle_timeout: "30s"
    max_incoming_streams: 100
    max_incoming_uni_streams: 100
    
  # WireGuard configuration
  wireguard:
    enabled: true
    interface: "wg0"
    port: 19302
    private_key_file: "/etc/cloudbridge/wireguard/private.key"
    public_key_file: "/etc/cloudbridge/wireguard/public.key"
    
  # STUN/TURN configuration
  stun:
    enabled: true
    port: 3478
    external_ip: "auto"
    
  turn:
    enabled: true
    port: 3478
    username: "cloudbridge"
    password: "changeme"
    realm: "cloudbridge.local"

# P2P configuration
p2p:
  enabled: true
  ice_servers:
    - urls: ["stun:stun.cloudbridge.local:3478"]
    - urls: ["turn:turn.cloudbridge.local:3478"]
      username: "cloudbridge"
      credential: "changeme"
  
  # Mesh networking
  mesh:
    enabled: true
    discovery_interval: "30s"
    heartbeat_interval: "10s"
    max_peers: 50

# Authentication configuration
auth:
  provider: "jwt"
  jwt:
    secret: "your-secret-key"
    expires_in: "24h"
    issuer: "cloudbridge-appliance"
    
  # LDAP/AD integration
  ldap:
    enabled: false
    server: "ldap://ldap.company.local:389"
    base_dn: "dc=company,dc=local"
    bind_dn: "cn=admin,dc=company,dc=local"
    bind_password: "password"
    user_filter: "(uid=%s)"
    group_filter: "(member=%s)"

# Database configuration
database:
  type: "sqlite"
  path: "/var/lib/cloudbridge/appliance.db"
  
  # PostgreSQL (for enterprise)
  postgres:
    enabled: false
    host: "localhost"
    port: 5432
    database: "cloudbridge"
    username: "cloudbridge"
    password: "password"
    ssl_mode: "disable"

# Redis configuration
redis:
  enabled: true
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  max_retries: 3
  pool_size: 10

# Monitoring configuration
monitoring:
  enabled: true
  prometheus:
    enabled: true
    port: 9090
    path: "/metrics"
    
  # Health checks
  health:
    enabled: true
    port: 8080
    path: "/health"
    interval: "30s"
    timeout: "10s"
    
  # Logging
  logging:
    level: "info"
    format: "json"
    output: "stdout"
    file: "/var/log/cloudbridge/appliance.log"
    max_size: "100MB"
    max_backups: 3
    max_age: 28

# Security configuration
security:
  # WAF (Web Application Firewall)
  waf:
    enabled: false
    mode: "monitor"  # monitor, block, log
    rules: []
    rate_limit: 1000
    
  # DDoS protection
  ddos:
    enabled: false
    threshold: 10000
    action: "log"  # log, block, rate_limit
    whitelist: []
    blacklist: []
    
  # Zero Trust
  zero_trust:
    enabled: false
    device_trust: false
    user_trust: false
    network_trust: false
    
  # Audit
  audit:
    enabled: true
    log_level: "info"
    retention_days: 30
    destinations: ["local"]

# Network configuration
network:
  interfaces:
    - name: "eth0"
      type: "ethernet"
      speed: "10G"
      ip_addresses: ["192.168.1.100/24"]
      vlans: []
      status: "up"
      
  # Routing
  routing:
    static_routes: []
    bgp:
      enabled: false
      as_number: 65001
      neighbors: []
      
  # Firewall
  firewall:
    enabled: true
    default_policy: "deny"
    rules: []
    logging: true

# Appliance-specific settings
appliance:
  # Hardware information
  hardware:
    cpu: "4 cores"
    memory: "16GB"
    storage: "500GB SSD"
    network: "2x10G"
    form_factor: "1U"
    
  # License information
  license:
    type: "basic"  # basic, secure, enterprise
    expires_at: "2025-01-01T00:00:00Z"
    max_users: 20
    max_servers: 5
    max_groups: 5
    features: ["relay", "tunnels"]
    throughput: "2Gbps"
    
  # Management
  management:
    auto_update: false
    backup_enabled: true
    backup_interval: "24h"
    backup_retention: 7
    
  # Support
  support:
    level: "basic"  # basic, standard, premium
    sla: "8x5"
    response_time: "4h"
    resolution_time: "24h"

# Feature flags
features:
  relay: true
  tunnels: true
  p2p: true
  mesh: true
  waf: false
  ddos: false
  zero_trust: false
  audit: true
  monitoring: true
  backup: true
  auto_update: false

# Performance tuning
performance:
  # Connection limits
  max_connections: 1000
  max_concurrent_connections: 500
  
  # Buffer sizes
  read_buffer_size: 65536
  write_buffer_size: 65536
  
  # Timeouts
  connection_timeout: "30s"
  read_timeout: "30s"
  write_timeout: "30s"
  
  # Keepalive
  keepalive_enabled: true
  keepalive_interval: "10s"
  keepalive_timeout: "30s"
  
  # Compression
  compression_enabled: true
  compression_level: 6
  
  # Caching
  cache_enabled: true
  cache_size: "100MB"
  cache_ttl: "1h"
