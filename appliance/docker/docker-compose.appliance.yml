version: '3.8'

services:
  cloudbridge-appliance:
    build:
      context: .
      dockerfile: Dockerfile.appliance
    container_name: cloudbridge-appliance
    restart: unless-stopped
    privileged: true  # Required for WireGuard and network management
    ports:
      - "8444:8444"   # gRPC/TLS
      - "8080:8080"   # Health/Admin API
      - "19302:19302" # STUN
      - "3478:3478"   # TURN
      - "5553:5553"   # QUIC
    volumes:
      - ./configs:/etc/cloudbridge:ro
      - ./logs:/var/log/cloudbridge
      - ./data:/var/lib/cloudbridge
      - /etc/wireguard:/etc/cloudbridge/wireguard:ro
    environment:
      - CLOUDBRIDGE_MODE=appliance
      - CLOUDBRIDGE_LOG_LEVEL=info
      - CLOUDBRIDGE_THROUGHPUT_LIMIT=2Gbps
    networks:
      - cloudbridge-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis for caching (for larger appliances)
  redis:
    image: redis:7-alpine
    container_name: cloudbridge-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb
    volumes:
      - redis-data:/data
    networks:
      - cloudbridge-net

  # Optional: PostgreSQL for persistence (for enterprise appliances)
  postgres:
    image: postgres:15-alpine
    container_name: cloudbridge-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=cloudbridge
      - POSTGRES_USER=cloudbridge
      - POSTGRES_PASSWORD=changeme
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cloudbridge-net

volumes:
  redis-data:
  postgres-data:

networks:
  cloudbridge-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
