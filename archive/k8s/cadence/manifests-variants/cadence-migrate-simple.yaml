apiVersion: batch/v1
kind: Job
metadata:
  name: cadence-db-migrate
  namespace: cloudbridge
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrate
        image: ubercadence/server:v0.22.4
        command: ["/bin/bash","-lc"]
        env:
        - name: PGHOST
          value: "postgres.cloudbridge-system.svc"
        - name: PGPORT
          value: "5432"
        - name: PGUSER
          valueFrom: 
            secretKeyRef: 
              name: cadence-db
              key: username
        - name: PGPASSWORD
          valueFrom: 
            secretKeyRef: 
              name: cadence-db
              key: password
        args:
        - |
          set -e
          echo "== Setting up schema for cadence database =="
          /usr/local/bin/cadence-sql-tool \
            --plugin postgres --ep $PGHOST \
            --port $PGPORT \
            --user $PGUSER --password $PGPASSWORD \
            --database cadence setup-schema -v 0.0
          /usr/local/bin/cadence-sql-tool \
            --plugin postgres --ep $PGHOST \
            --port $PGPORT \
            --user $PGUSER --password $PGPASSWORD \
            --database cadence update-schema -v latest
          echo "== Setting up schema for cadence_visibility database =="
          /usr/local/bin/cadence-sql-tool \
            --plugin postgres --ep $PGHOST \
            --port $PGPORT \
            --user $PGUSER --password $PGPASSWORD \
            --database cadence_visibility setup-schema -v 0.0
          /usr/local/bin/cadence-sql-tool \
            --plugin postgres --ep $PGHOST \
            --port $PGPORT \
            --user $PGUSER --password $PGPASSWORD \
            --database cadence_visibility update-schema -v latest
          echo "== Migration completed successfully =="


