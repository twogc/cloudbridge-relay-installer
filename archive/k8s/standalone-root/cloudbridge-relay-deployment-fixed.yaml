apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbridge-relay
  namespace: cloudbridge
  labels:
    app: cloudbridge-relay
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudbridge-relay
  template:
    metadata:
      labels:
        app: cloudbridge-relay
        app.kubernetes.io/name: cloudbridge-relay
        app.kubernetes.io/component: relay
    spec:
      containers:
      - name: cloudbridge-relay
        image: cloudbridge-relay:mvp-20251011-214615
        imagePullPolicy: Never
        command: ["./cloudbridge-relay"]
        args: ["--config", "/app/configs/config.json"]
        ports:
        - containerPort: 5550
          name: main-server
          protocol: TCP
        - containerPort: 5551
          name: metrics
          protocol: TCP
        - containerPort: 5552
          name: p2p-api
          protocol: TCP
        - containerPort: 5553
          name: http-api
          protocol: TCP
        - containerPort: 5554
          name: https-api
          protocol: TCP
        - containerPort: 5555
          name: quic-transport
          protocol: UDP
        - containerPort: 9090
          name: quic-legacy
          protocol: UDP
        - containerPort: 9092
          name: enhanced-quic
          protocol: UDP
        - containerPort: 19302
          name: stun-server
          protocol: UDP
        env:
        - name: RELAY_JWT_SECRET
          value: "default-jwt-secret"
        - name: CADENCE_ENABLED
          value: "true"
        - name: CADENCE_HOST_PORT
          value: "cadence:7933"
        - name: CADENCE_DOMAIN
          value: "cloudbridge-p2p"
        - name: CADENCE_TASK_LIST
          value: "p2p-quic-tasks"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 9091
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 9091
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          privileged: true
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /app/configs
          readOnly: true
        - name: tls-certs
          mountPath: /app/certs
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: cloudbridge-config-json
      - name: tls-certs
        secret:
          secretName: cloudbridge-tls
