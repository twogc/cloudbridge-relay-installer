apiVersion: v1
kind: Service
metadata:
  name: cadence-nodeport
  namespace: cloudbridge
  labels:
    app.kubernetes.io/component: workflow
    app.kubernetes.io/name: cadence
    app.kubernetes.io/part-of: cloudbridge-relay
spec:
  type: NodePort
  ports:
  - name: grpc
    port: 7933
    targetPort: 7933
    nodePort: 30033
    protocol: TCP
  - name: web
    port: 7934
    targetPort: 7934
    nodePort: 30034
    protocol: TCP
  - name: metrics
    port: 7935
    targetPort: 7935
    nodePort: 30035
    protocol: TCP
  selector:
    app.kubernetes.io/component: workflow
    app.kubernetes.io/name: cadence
