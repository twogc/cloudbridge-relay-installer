apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadence
  namespace: cloudbridge
  labels:
    app.kubernetes.io/component: workflow
    app.kubernetes.io/name: cadence
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cadence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cadence
    spec:
      containers:
      - name: cadence
        image: ubercadence/server:v0.22.4
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-lc"]
        args:
          - |
            echo "Starting Cadence (environment variables mode)"
            exec /usr/local/bin/cadence-server start --services=frontend,history,matching,worker
        ports:
        - containerPort: 7933
          name: grpc
          protocol: TCP
        - containerPort: 7934
          name: web
          protocol: TCP
        env:
        - name: CADENCE_USE_ENV_VARS
          value: "true"
        - name: DB
          value: "postgres"
        - name: DB_HOST
          value: "10.105.221.45"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "cadence"
        - name: DB_USER
          value: "ipam_user"
        - name: DB_PASSWORD
          value: "secure_password_123"
        - name: VISIBILITY_STORE
          value: "postgres"
        - name: VISIBILITY_DB_HOST
          value: "10.105.221.45"
        - name: VISIBILITY_DB_PORT
          value: "5432"
        - name: VISIBILITY_DB_NAME
          value: "cadence_visibility"
        - name: VISIBILITY_DB_USER
          value: "ipam_user"
        - name: VISIBILITY_DB_PASSWORD
          value: "secure_password_123"
        - name: CLUSTER_METADATA_ENABLE_GLOBAL_DOMAIN
          value: "false"
        - name: CLUSTER_METADATA_FAILOVER_VERSION_INCREMENT
          value: "10"
        - name: CLUSTER_METADATA_MASTER_CLUSTER_NAME
          value: "active"
        - name: CLUSTER_METADATA_CURRENT_CLUSTER_NAME
          value: "active"
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 7934
            scheme: HTTP
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 7934
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        volumeMounts:
        - mountPath: /var/lib/cadence
          name: cadence-data
        - mountPath: /etc/cadence/config
          name: cadence-config
      nodeSelector:
        kubernetes.io/os: linux
      volumes:
      - name: cadence-data
        persistentVolumeClaim:
          claimName: cadence-pvc
      - name: cadence-config
        configMap:
          name: cadence-config
