apiVersion: batch/v1
kind: Job
metadata:
  name: cadence-visibility-update-curr-version
  namespace: cloudbridge
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: update-curr-version
        image: postgres:18
        env:
        - name: PGHOST
          value: "postgres.cloudbridge-system.svc"
        - name: PGPORT
          value: "5432"
        - name: PGUSER
          value: "ipam_user"
        - name: PGPASSWORD
          value: "secure_password_123"
        command: ["/bin/bash","-lc"]
        args:
        - |
          set -euo pipefail
          echo "== Updating visibility schema curr_version to 0.4 =="
          psql "postgresql://$PGUSER:$PGPASSWORD@$PGHOST:$PGPORT/cadence_visibility" -c "UPDATE schema_version SET curr_version = '0.4' WHERE curr_version = '0.0';"
          echo "== Checking updated version =="
          psql "postgresql://$PGUSER:$PGPASSWORD@$PGHOST:$PGPORT/cadence_visibility" -c "SELECT * FROM schema_version;"
          echo "== done =="


