# AI Analytics Configuration
analytics:
  # Настройки планировщика
  schedule: "15m" # Интервал генерации отчетов (например: "15m", "1h", "30s")
  max_reports: 100 # Максимальное количество хранимых отчетов

  # Источники данных
  data_sources:
    # AI Service endpoint
    ai_service:
      enabled: true
      url: "http://localhost:8083"
      timeout: "30s"

    # Prometheus metrics
    prometheus:
      enabled: true
      url: "http://localhost:9090"
      timeout: "30s"

    # Relay metrics
    relay:
      enabled: true
      url: "http://localhost:8080"
      timeout: "30s"

  # LLM интеграция (Cloudflare AI)
  llm:
    provider: "cloudflare"
    model: "@cf/meta/llama-2-7b-chat-int8"
    api_token: "${CLOUDFLARE_AI_TOKEN}" # Переменная окружения
    account_id: "${CLOUDFLARE_ACCOUNT_ID}" # Переменная окружения
    max_tokens: 2048
    temperature: 0.7

  # Система уведомлений
  notifications:
    # Slack интеграция
    slack:
      enabled: false
      webhook_url: "${SLACK_WEBHOOK_URL}"
      channel: "#ai-alerts"

    # Email уведомления
    email:
      enabled: false
      smtp_host: "smtp.gmail.com"
      smtp_port: 587
      from: "ai-analytics@cloudbridge.io"
      to: ["admin@cloudbridge.io"]
      username: "${EMAIL_USERNAME}"
      password: "${EMAIL_PASSWORD}"

    # Webhook уведомления
    webhook:
      enabled: false
      url: "${WEBHOOK_URL}"
      headers:
        Authorization: "Bearer ${WEBHOOK_TOKEN}"

  # Настройки отчетов
  reports:
    # Формат отчетов
    format: "markdown" # markdown, json, html
    include_charts: true
    include_recommendations: true

    # Пороги для алертов
    thresholds:
      anomaly_score: 0.8 # Порог аномального скора для алертов
      error_rate: 0.05   # 5% error rate для алертов
      latency_p95: 1000  # 1000ms p95 latency для алертов

# Логирование
logging:
  level: "info" # debug, info, warn, error
  format: "json" # json, text
  output: "stdout" # stdout, file
  file_path: "logs/ai-analytics.log"

# HTTP сервер настройки
server:
  host: "0.0.0.0"
  port: 8084
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "120s"
