server:
  listen: ":3456"
  tls:
    enabled: false
  max_connections: 10000
  connection_timeout: 60s

security:
  token_validation:
    min_length: 8
    max_length: 32
    allowed_chars: "[a-zA-Z0-9-_]"
  rate_limit:
    enabled: true
    requests_per_second: 10
    burst: 20

metrics:
  enabled: true
  listen: ":9090"
  path: "/metrics"

logging:
  level: "info"
  format: "json"
  output: "/var/log/cloudbridge-relay/relay.log" 