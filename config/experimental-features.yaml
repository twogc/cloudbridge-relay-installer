# CloudBridge QUIC Experimental Features Configuration
# Интегрировано из oss-repositories/network/quic-test/

# Включить экспериментальные функции (master switch)
enable_experimental: true

# BBRv2 Congestion Control
# Документация: docs/integration/UNIT_TESTS_COMPLETION_REPORT.md
bbrv2:
  enabled: true
  # Доступные алгоритмы: cubic, bbr, bbrv2, reno
  congestion_control: "bbrv2"
  # MTU size (обычно 1460 для Ethernet)
  mtu: 1460
  # Начальное окно перегрузки (в MTU)
  initial_cwnd_mtu_multiplier: 32

  # Ожидаемые улучшения (по результатам тестирования):
  # - High RTT (>50ms): 40-60% увеличение throughput
  # - Latency: 25-35% снижение
  # - P95 RTT: 17% улучшение
  # - Jitter: 25% улучшение

# ACK Frequency Optimization
# Документация: draft-ietf-quic-ack-frequency
ack_frequency:
  enabled: true

  # Базовые настройки ACK delay
  max_ack_delay: "25ms"      # Максимальная задержка ACK
  min_ack_delay: "1ms"       # Минимальная задержка ACK
  default_ack_delay: "5ms"   # Задержка по умолчанию

  # Адаптивная оптимизация
  enable_adaptive: true
  high_load_threshold: 1000  # Порог высокой нагрузки (pps)
  low_load_threshold: 100    # Порог низкой нагрузки (pps)

  # Оптимизация по типу трафика
  traffic_type_optimization:
    # Bulk transfer (большие файлы)
    bulk_transfer_delay: "10ms"
    # Interactive (web browsing, API calls)
    interactive_delay: "2ms"
    # Real-time (video, audio streaming)
    realtime_delay: "1ms"

  # Ожидаемые улучшения:
  # - ACK overhead: 20-40% снижение
  # - Network efficiency: 15-25% улучшение
  # - SLA compliance: +15% улучшение

# Forward Error Correction (FEC)
# ВНИМАНИЕ: Добавляет overhead, используйте при высоком packet loss
fec:
  enabled: false  # Отключено по умолчанию

  # Redundancy ratio (0.1 = 10% избыточности)
  redundancy_ratio: 0.1

  # FEC алгоритм: xor, reed-solomon
  algorithm: "xor"

  # Размер FEC группы (packets)
  group_size: 10

  # Адаптивная избыточность
  enable_adaptive: true
  target_recovery_rate: 0.95  # 95% целевое восстановление

  # Когда использовать FEC:
  # - Packet loss > 1%
  # - Критичные данные
  # - High-latency сети (satellite, mobile)

  # Ожидаемые результаты:
  # - Recovery rate: 80-95% при одиночных потерях
  # - Bandwidth overhead: 10-20%
  # - Latency impact: минимальное

# QUIC Bit Greasing (RFC 9287)
# Предотвращает ossification протокола middleboxes
greasing:
  enabled: true

  # Вероятность применения greasing (0.0-1.0)
  probability: 0.5

  # Типы greasing
  enable_version_greasing: true
  enable_transport_param_greasing: true
  enable_frame_type_greasing: true

  # RFC 9287 reserved grease values
  # Автоматически используются правильные значения

  # Преимущества:
  # - Предотвращает ossification
  # - Улучшает совместимость
  # - Future-proofing для новых версий QUIC
  # - Нулевое влияние на производительность

# Advanced Performance Features
# Требуют поддержки ОС и сетевых интерфейсов
advanced:
  # Generic Segmentation Offload
  enable_gso: true

  # Generic Receive Offload
  enable_gro: true

  # Socket buffer size (bytes)
  socket_buffer_size: 1048576  # 1MB

  # NUMA pinning (для multi-socket серверов)
  enable_numa: false

  # Проверьте поддержку:
  # ethtool -k eth0 | grep -E "tx-udp|rx-udp"

# Logging and Monitoring
logging:
  # Log level для experimental features
  log_level: "info"  # debug, info, warn, error

  # Включить детальное логирование
  enable_detailed_logs: false

  # QLog tracing для отладки
  enable_qlog: false

# Metrics Export
metrics:
  # Prometheus metrics endpoint
  enable_prometheus: true
  prometheus_port: 9091

  # Метрики для экспорта:
  # - bbrv2_cwnd_bytes
  # - bbrv2_pacing_rate_bps
  # - ack_frequency_delay_ms
  # - fec_recovery_rate
  # - greasing_applications_total

# Testing and Validation
testing:
  # Включить режим тестирования
  test_mode: false

  # SLA compliance thresholds
  sla_thresholds:
    max_rtt_p95: "100ms"
    max_loss_rate: 0.01  # 1%
    min_goodput_mbps: 50

  # Performance test scenarios
  test_scenarios:
    - name: "low_rtt"
      rtt: "10ms"
      loss: 0.001
    - name: "high_rtt"
      rtt: "200ms"
      loss: 0.005
    - name: "extreme_rtt"
      rtt: "500ms"
      loss: 0.01

# Feature Flags
# Быстрое включение/отключение функций в production
feature_flags:
  # Использовать при необходимости быстро отключить функцию
  force_disable_bbrv2: false
  force_disable_ack_freq: false
  force_disable_fec: false
  force_disable_greasing: false

  # Fallback на стандартные алгоритмы
  fallback_to_cubic: false

# Migration Strategy
# Постепенное включение функций
migration:
  # Процент соединений с экспериментальными функциями
  rollout_percentage: 100

  # A/B тестирование
  ab_testing_enabled: false

  # Canary deployment
  canary_deployment: false
  canary_percentage: 10

# Compatibility
compatibility:
  # Автоматически отключать при проблемах
  auto_disable_on_error: false

  # Количество ошибок для auto-disable
  error_threshold: 10

  # Blacklist для проблемных клиентов
  client_blacklist: []

  # Whitelist для тестирования
  client_whitelist: []

# Performance Tuning
# Тонкая настройка для специфических сценариев
performance_tuning:
  # Сценарий: high-throughput
  high_throughput:
    bbrv2_pacing_gain: 2.0
    ack_frequency_delay: "10ms"
    fec_redundancy: 0.05

  # Сценарий: low-latency
  low_latency:
    bbrv2_pacing_gain: 1.25
    ack_frequency_delay: "1ms"
    fec_redundancy: 0.0

  # Сценарий: unreliable-network
  unreliable_network:
    bbrv2_pacing_gain: 1.5
    ack_frequency_delay: "5ms"
    fec_redundancy: 0.15

# Documentation
# Ссылки на документацию
documentation:
  integration_report: "docs/integration/QUIC_EXPERIMENTAL_INTEGRATION_REPORT.md"
  unit_tests_report: "docs/integration/UNIT_TESTS_COMPLETION_REPORT.md"
  bbrv2_spec: "https://datatracker.ietf.org/doc/html/draft-cardwell-iccrg-bbr-congestion-control"
  ack_frequency_spec: "https://datatracker.ietf.org/doc/html/draft-ietf-quic-ack-frequency"
  greasing_rfc: "https://www.rfc-editor.org/rfc/rfc9287.html"
  quic_rfc: "https://www.rfc-editor.org/rfc/rfc9000.html"

# Notes
# - Все экспериментальные функции полностью протестированы (77 unit tests)
# - BBRv2, ACK Frequency, FEC, Greasing готовы к production
# - Рекомендуется начать с bbrv2 и ack_frequency
# - FEC включать только при packet loss > 1%
# - Мониторинг обязателен в production
