apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadence
  namespace: cloudbridge
spec:
  template:
    spec:
      # 1) Удаляем initContainer, т.к. он больше не нужен
      $setElementOrder/containers:
      - name: cadence
      containers:
      - name: cadence
        # 2) Чётко указываем пути для dockerize
        env:
        - name: CONFIG_TEMPLATE_PATH
          value: /etc/cadence/config/config_template.yaml
        - name: CONFIG_FILE_PATH
          value: /etc/cadence/config/docker.yaml
        # (уберите пустые переопределения)
        - name: DOCKERIZE_TEMPLATE
          $patch: delete
        - name: DOCKERIZE_DELAY
          $patch: delete
        volumeMounts:
          # RW каталог
          - name: cadence-config-rw
            mountPath: /etc/cadence/config
          # 3) Один файл из ConfigMap в ту же папку через subPath (read-only)
          - name: cadence-config-template
            mountPath: /etc/cadence/config/config_template.yaml
            subPath: config_template.yaml
            readOnly: true
      initContainers:
        $patch: delete


