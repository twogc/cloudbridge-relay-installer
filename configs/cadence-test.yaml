# Test configuration for Cadence with short timeouts
# This configuration is optimized for fast test execution

domain: "cloudbridge-relay-test"
service_name: "cloudbridge-cadence-test"

# Client configuration
client:
  host_port: "localhost:7933"
  domain: "cloudbridge-relay-test"
  data_converter: "json"
  connection_timeout: "5s"
  
# Worker configuration  
worker:
  task_list_name: "cloudbridge-test-task-list"
  identity: "cloudbridge-test-worker"
  max_concurrent_activities: 10
  max_concurrent_local_activities: 10
  max_concurrent_workflows: 10
  worker_stop_timeout: "5s"
  
# Workflow timeouts (short for testing)
workflow_timeouts:
  execution_start_to_close: "30s"     # Maximum workflow execution time
  task_start_to_close: "5s"          # Maximum decision task time
  child_policy: "abandon"             # Policy for child workflows
  
# Activity timeouts (short for testing)
activity_timeouts:
  start_to_close: "10s"               # Maximum activity execution time
  schedule_to_start: "2s"             # Maximum time in queue
  schedule_to_close: "15s"            # Total activity timeout
  heartbeat: "2s"                     # Heartbeat interval
  
# Retry policies (aggressive for testing)
retry_policies:
  initial_interval: "100ms"           # Initial retry delay
  backoff_coefficient: 1.5            # Backoff multiplier
  maximum_interval: "1s"              # Maximum retry delay
  maximum_attempts: 2                 # Maximum retry attempts
  non_retryable_errors: []            # Errors that should not be retried
  
# Test-specific settings
test_settings:
  health_check_interval: "2s"         # Health check frequency
  scaling_check_interval: "1s"        # Scaling check frequency
  workflow_timeout: "30s"             # Default workflow timeout
  activity_timeout: "10s"             # Default activity timeout
  signal_timeout: "1s"                # Signal processing timeout
  environment: "test"                 # Environment indicator
  
# Metrics configuration (disabled for testing)
metrics:
  enabled: false
  port: 9090
  path: "/metrics"
  
# Logging configuration (minimal for testing)
logging:
  level: "debug"
  format: "console"
  development: true
  disable_caller: false
  disable_stacktrace: false
  
# Tracing configuration (disabled for testing)
tracing:
  enabled: false
  jaeger_endpoint: ""
  service_name: "cadence-test"
  
# Database configuration (in-memory for testing)
database:
  driver: "sqlite"
  host: ":memory:"
  port: 0
  name: "cadence_test"
  user: ""
  password: ""
  max_connections: 1
  max_idle_connections: 1
  connection_max_lifetime: "1m"
  
# Circuit breaker configuration (disabled for testing)
circuit_breaker:
  enabled: false
  failure_threshold: 5
  success_threshold: 2
  timeout: "1s"
  
# Rate limiting configuration (disabled for testing)  
rate_limiting:
  enabled: false
  requests_per_second: 1000
  burst_size: 100
