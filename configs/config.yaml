# CloudBridge Relay Configuration
server:
  address: "0.0.0.0"
  port: 8080
  timeout: "30s"
  max_tunnels: 1000

wireguard:
  enabled: true
  interface:
    name: "wg-mesh0"
    listen_port: 51820
    address: "10.100.1.1/24"
  discovery:
    registry_url: "https://auth.2gc.ru/wg/peers"
    heartbeat_interval: "25s"
    max_peers: 50
  mesh:
    enabled: true
    auto_discovery: true
    max_connections: 100
    routing_strategy: "hybrid"

metrics:
  enabled: true
  port: 9090
  path: "/metrics"

logging:
  level: "info"
  format: "json"
  output: "stdout"

security:
  rate_limiting:
    enabled: true
    requests_per_minute: 1000
  authentication:
    enabled: false
    jwt_secret: "your-secret-key"
  cors:
    enabled: true
    allowed_origins: ["*"]
