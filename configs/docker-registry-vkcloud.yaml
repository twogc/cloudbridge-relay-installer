# Конфигурация Docker Registry для VK Cloud
# Используется для установки через Helm Chart

# Настройки образа
image:
  repository: registry
  tag: "2.8.2"
  pullPolicy: IfNotPresent

# Настройки сервиса
service:
  name: registry
  type: LoadBalancer
  loadBalancerIP: "212.233.89.183"
  port: 5000
  nodePort: 5000
  annotations:
    service.beta.kubernetes.io/vk-cs-load-balancer-ip: "212.233.89.183"

# Настройки persistence
persistence:
  enabled: true
  storageClass: "csi-high-io"
  size: 10Gi
  accessMode: ReadWriteOnce

# Настройки storage (используем локальное хранилище для тестирования)
storage: filesystem

# Настройки аутентификации
auth:
  htpasswd:
    enabled: true
    username: cloudbridge
    password: password

# Настройки TLS
tls:
  enabled: false

# Настройки ресурсов
resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

# Настройки безопасности
securityContext:
  runAsUser: 1000
  fsGroup: 1000

# Настройки readiness/liveness probes
readinessProbe:
  httpGet:
    path: /
    port: 5000
  initialDelaySeconds: 30
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /
    port: 5000
  initialDelaySeconds: 60
  periodSeconds: 30

# Настройки ingress (опционально)
ingress:
  enabled: false

# Настройки nodeSelector
nodeSelector: {}

# Настройки tolerations
tolerations: []

# Настройки affinity
affinity: {}
