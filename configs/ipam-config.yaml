# CloudBridge IPAM Service Configuration

# Server Configuration
server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "120s"

# Database Configuration
database:
  host: "postgres.cloudbridge.svc.cluster.local"
  port: 5432
  name: "cadence"
  user: "cadence"
  password: "cadence123"
  ssl_mode: "disable"
  max_connections: 100
  max_idle_connections: 10
  connection_timeout: "30s"
  query_timeout: "10s"

# IPAM Configuration
ipam:
  # IP address space configuration
  address_space: "10.0.0.0/8"
  default_subnet_size: 24
  max_subnets_per_tenant: 100
  
  # Subnet allocation settings
  allocation_strategy: "sequential"  # sequential, random, hierarchical
  enable_subnet_reuse: false
  subnet_lease_duration: "24h"
  
  # IPv6 support (future)
  ipv6_enabled: false
  ipv6_address_space: "2001:db8::/32"

# Logging Configuration
logging:
  level: "info"
  format: "json"
  output: "stdout"
  file: "/var/log/ipam/ipam.log"
  max_size: 100  # MB
  max_backups: 3
  max_age: 28    # days

# Metrics Configuration
metrics:
  enabled: true
  port: 9090
  path: "/metrics"
  prometheus_enabled: true
  
  # Custom metrics
  tenant_metrics: true
  subnet_metrics: true
  allocation_metrics: true
  utilization_metrics: true

# Health Check Configuration
health:
  enabled: true
  port: 8081
  path: "/health"
  interval: "30s"
  timeout: "5s"
  
  # Health check endpoints
  database_check: true
  memory_check: true
  disk_check: true

# Rate Limiting Configuration
rate_limiting:
  enabled: true
  requests_per_minute: 1000
  burst_size: 100
  
  # Per-tenant rate limiting
  per_tenant_limit: 100
  per_tenant_burst: 20

# Security Configuration
security:
  # CORS settings
  cors:
    enabled: true
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["Content-Type", "Authorization"]
    max_age: 86400
  
  # Authentication (if needed)
  auth:
    enabled: false
    jwt_secret: ""
    token_expiry: "1h"
  
  # API key authentication
  api_keys:
    enabled: false
    keys: []

# Monitoring and Alerting
monitoring:
  # Prometheus metrics
  prometheus:
    enabled: true
    port: 9090
    
  # Health checks
  health_checks:
    enabled: true
    interval: "30s"
    
  # Alerting thresholds
  alerts:
    high_utilization_threshold: 80.0  # %
    low_subnet_availability: 100      # count
    tenant_limit_warning: 90          # %

# Performance Configuration
performance:
  # Connection pooling
  connection_pool:
    max_connections: 100
    max_idle_connections: 10
    connection_lifetime: "1h"
    
  # Caching
  cache:
    enabled: true
    ttl: "5m"
    max_size: 1000
    
  # Background tasks
  background_tasks:
    cleanup_interval: "1h"
    stats_update_interval: "5m"

# Development Configuration
development:
  debug: false
  profiling: false
  mock_database: false
  
# Production Configuration
production:
  graceful_shutdown_timeout: "30s"
  max_request_size: "10MB"
  enable_compression: true
  enable_gzip: true

