# CloudBridge Security Configuration - Development Environment

security:
  environment: "development"
  
  # HTTPS settings (отключено для разработки)
  https:
    force_https: false
    hsts_max_age: 0
    hsts_include_subdomain: false
    hsts_preload: false
    auto_redirect: false
    http_port: 8080
    https_port: 8443
    
  # TLS configuration
  tls:
    cert_file: "./certs/dev-cert.pem"
    key_file: "./certs/dev-key.pem"
    min_version: 1.2  # TLS 1.2
    max_version: 1.3  # TLS 1.3
    
  # CORS settings (разрешительные для разработки)
  cors:
    allowed_origins:
      - "http://localhost:3000"
      - "http://localhost:8080"
      - "http://127.0.0.1:3000"
      - "http://127.0.0.1:8080"
      - "https://localhost:3000"
      - "https://localhost:8443"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
      - "HEAD"
      - "PATCH"
    allowed_headers:
      - "Origin"
      - "Content-Type"
      - "Accept"
      - "Authorization"
      - "X-Requested-With"
      - "X-CSRF-Token"
      - "X-API-Key"
    allow_credentials: true
    max_age: 86400  # 24 hours
    
  # Security headers (базовые для разработки)
  headers:
    content_type_options: "nosniff"
    frame_options: "SAMEORIGIN"  # Менее строгий для разработки
    xss_protection: "1; mode=block"
    content_security_policy: "default-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' ws: wss:"
    referrer_policy: "strict-origin-when-cross-origin"
    remove_server_header: false  # Оставляем для отладки
    remove_powered_by: false
    
  # Rate limiting (мягкие лимиты для разработки)
  rate_limiting:
    global_requests_per_minute: 10000
    global_burst_size: 1000
    ai_requests_per_minute: 1000
    ai_burst_size: 200
    pipeline_requests_per_minute: 2000
    pipeline_burst_size: 500
    monitoring_requests_per_minute: 500
    monitoring_burst_size: 100
    tenant_requests_per_minute: 5000
    tenant_burst_size: 500
    user_requests_per_minute: 1000
    user_burst_size: 200
    
  # Audit settings
  audit:
    log_suspicious_requests: true
    log_large_requests: true
    large_request_threshold: 50MB  # 50MB для разработки
    log_missing_user_agent: false  # Не логируем в dev
    
# Logging configuration
logging:
  level: "debug"
  security_events: true
  access_logs: true
