  # JWT Configuration
  jwt:
    custom_claims:
      tenant_id: "uuid"
      client_id: "string"
      roles: "array"
      audit_session_id: "string"
    
    token_lifetimes:
      access_token: "15m"
      refresh_token: "8h"
      id_token: "1h"
  
  # mTLS Configuration
  mtls:
    enabled: true
    ca_cert_path: "/home/ubuntu/cloudbridge-relay-installer/certs/relay-mtls/cloudbridge-relay-ca-cert.pem"
    client_cert_path: "/home/ubuntu/cloudbridge-relay-installer/certs/relay-mtls/relay-client-cert.pem"
    client_key_path: "/home/ubuntu/cloudbridge-relay-installer/certs/relay-mtls/relay-client-key.pem"
