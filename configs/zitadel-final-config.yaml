zitadel:
  enabled: true
  domain: "edge.2gc.ru"
  issuer_url: "https://edge.2gc.ru"
  
  # OIDC Applications
  applications:
    api:
      client_id: "339537393138794797"
      client_secret: "Wahm7Iti1VAoXsFAV1MBeMfPv1yope2IJ47utB30Pk4FgZyJFZK0ayfX4zNstkUh"
      grant_types: ["client_credentials", "authorization_code"]
      scopes: ["openid", "profile", "email", "relay.api"]
    
    spa:
      client_id: "339537407433048367"
      grant_types: ["authorization_code", "device_code"]
      scopes: ["openid", "profile", "email", "relay.api", "relay.k8s", "offline_access"]
