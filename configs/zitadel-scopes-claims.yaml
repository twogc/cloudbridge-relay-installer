# ZITADEL Custom Scopes and Claims Configuration
# Конфигурация для настройки custom scopes и claims в ZITADEL

apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-scopes-claims-config
  namespace: zitadel
data:
  # Custom Scopes Definition
  custom-scopes.json: |
    {
      "scopes": [
        {
          "key": "relay.api",
          "display_name": "CloudBridge Relay API Access",
          "description": "Доступ к gRPC/HTTP API CloudBridge Relay",
          "group": "api",
          "assertion_attributes": [
            "tenant_id",
            "client_id", 
            "roles"
          ]
        },
        {
          "key": "relay.k8s",
          "display_name": "Kubernetes Proxy Access",
          "description": "Доступ к kubectl proxy через CloudBridge Relay",
          "group": "k8s",
          "assertion_attributes": [
            "tenant_id",
            "roles",
            "audit_session_id"
          ]
        }
      ]
    }

  # Custom Claims Configuration
  custom-claims.json: |
    {
      "claims": {
        "tenant_id": {
          "type": "string",
          "source": "user_metadata",
          "key": "tenant_id",
          "description": "UUID идентификатор тенанта",
          "required": true,
          "default": "default-tenant"
        },
        "client_id": {
          "type": "string", 
          "source": "user_metadata",
          "key": "client_id",
          "description": "ID клиента (device/user agent)",
          "required": false
        },
        "roles": {
          "type": "array",
          "source": "project_roles",
          "description": "Массив ролей пользователя",
          "required": true,
          "default": ["reader"]
        },
        "audit_session_id": {
          "type": "string",
          "source": "session",
          "key": "session_id",
          "description": "Trace ID для аудита (сквозное отслеживание)",
          "required": true
        }
      }
    }

  # JWT Access Token Template
  access-token-template.json: |
    {
      "aud": ["cloudbridge-relay"],
      "iss": "{{ .Issuer }}",
      "sub": "{{ .UserID }}",
      "tenant_id": "{{ .User.Metadata.tenant_id | default \"default-tenant\" }}",
      "client_id": "{{ .User.Metadata.client_id | default .ClientID }}",
      "roles": "{{ .ProjectRoles | default [\"reader\"] }}",
      "scopes": "{{ .Scopes }}",
      "exp": "{{ .ExpirationTime }}",
      "iat": "{{ .IssuedAtTime }}",
      "auth_time": "{{ .AuthTime }}",
      "session_id": "{{ .SessionID }}",
      "audit_session_id": "{{ .SessionID }}",
      "nbf": "{{ .NotBefore }}",
      "jti": "{{ .JWTID }}"
    }

  # ID Token Template  
  id-token-template.json: |
    {
      "aud": "{{ .ClientID }}",
      "iss": "{{ .Issuer }}",
      "sub": "{{ .UserID }}",
      "tenant_id": "{{ .User.Metadata.tenant_id | default \"default-tenant\" }}",
      "email": "{{ .User.Email }}",
      "email_verified": "{{ .User.EmailVerified }}",
      "name": "{{ .User.DisplayName }}",
      "preferred_username": "{{ .User.PreferredUsername }}",
      "roles": "{{ .ProjectRoles | default [\"reader\"] }}",
      "exp": "{{ .ExpirationTime }}",
      "iat": "{{ .IssuedAtTime }}",
      "auth_time": "{{ .AuthTime }}",
      "session_id": "{{ .SessionID }}",
      "audit_session_id": "{{ .SessionID }}"
    }

  # Token Lifetimes Configuration
  token-lifetimes.json: |
    {
      "access_token_lifetime": "15m",
      "refresh_token_lifetime": "8h", 
      "id_token_lifetime": "1h",
      "service_token_lifetime": "5m",
      "refresh_token_idle_expiration": "24h",
      "refresh_token_expiration": "720h"
    }

  # Role Definitions
  project-roles.json: |
    {
      "roles": [
        {
          "key": "cluster-admin",
          "display_name": "Cluster Administrator",
          "description": "Полный доступ к кластеру Kubernetes",
          "group": "admin"
        },
        {
          "key": "tenant-reader",
          "display_name": "Tenant Reader",
          "description": "Доступ на чтение к ресурсам тенанта",
          "group": "reader"
        },
        {
          "key": "tenant-admin",
          "display_name": "Tenant Administrator", 
          "description": "Полный доступ к ресурсам тенанта",
          "group": "admin"
        },
        {
          "key": "api-consumer",
          "display_name": "API Consumer",
          "description": "Доступ к CloudBridge Relay API",
          "group": "api"
        },
        {
          "key": "k8s-viewer",
          "display_name": "Kubernetes Viewer",
          "description": "Доступ на чтение к Kubernetes через kubectl",
          "group": "k8s"
        },
        {
          "key": "k8s-editor",
          "display_name": "Kubernetes Editor",
          "description": "Доступ на чтение/запись к Kubernetes через kubectl",
          "group": "k8s"
        }
      ]
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-jwt-keys
  namespace: zitadel
  labels:
    app: zitadel
    component: config
type: Opaque
data:
  # JWT signing key (будет сгенерирован автоматически)
  # Используется для подписи JWT токенов
  jwt-signing-key.pem: ""
  
  # JWT encryption key (опционально)
  # Используется для шифрования чувствительных данных в JWT
  jwt-encryption-key.pem: ""
