global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
  - match:
      severity: critical
    receiver: 'email'
    repeat_interval: 30m
  - match:
      severity: warning
    receiver: 'email'
    repeat_interval: 1h

receivers:
- name: 'web.hook'
  webhook_configs:
  - url: 'http://127.0.0.1:5001/'

- name: 'email'
  email_configs:
  - to: "info@2gc.ru"
    from: "info@2gc.ru"
    smarthost: "smtp.rusender.ru:465"
    auth_username: "info@2gc.ru"
    auth_password: "fbf9ec7ab5b2c36479d60c4c5c8c1d871ccdde74"
    send_resolved: true
    require_tls: false
    tls_config:
      insecure_skip_verify: false
      server_name: "smtp.rusender.ru"

- name: 'siem-critical'
  email_configs:
  - to: "security@2gc.ru"
    from: "siem@2gc.ru"
    smarthost: "smtp.rusender.ru:465"
    auth_username: "siem@2gc.ru"
    auth_password: "test-siem-password"
    send_resolved: true
    require_tls: false
    tls_config:
      insecure_skip_verify: false
      server_name: "smtp.rusender.ru"
  # telegram_configs:
  # - bot_token: "test-bot-token"
  #   chat_id: "test-chat-id"
  #   parse_mode: "HTML"
  #   send_resolved: true

- name: 'siem-warning'
  email_configs:
  - to: "admin@2gc.ru"
    from: "siem@2gc.ru"
    smarthost: "smtp.rusender.ru:465"
    auth_username: "siem@2gc.ru"
    auth_password: "test-siem-password"
    send_resolved: true
    require_tls: false
    tls_config:
      insecure_skip_verify: false
      server_name: "smtp.rusender.ru"

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']
