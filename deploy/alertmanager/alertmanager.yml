global:
  resolve_timeout: 5m
  slack_api_url: 'https://hooks.slack.com/services/YOUR_SLACK_WEBHOOK'

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
  - match:
      severity: critical
    receiver: 'slack.critical'
    repeat_interval: 30m
  - match:
      severity: warning
    receiver: 'slack.warning'
    repeat_interval: 1h

receivers:
- name: 'web.hook'
  webhook_configs:
  - url: 'http://127.0.0.1:5001/'

- name: 'slack.critical'
  slack_configs:
  - channel: '#alerts-critical'
    title: '{{ template "slack.title" . }}'
    text: '{{ template "slack.text" . }}'
    send_resolved: true
    actions:
    - type: button
      text: 'View in Grafana'
      url: '{{ template "slack.grafana.url" . }}'

- name: 'slack.warning'
  slack_configs:
  - channel: '#alerts-warning'
    title: '{{ template "slack.title" . }}'
    text: '{{ template "slack.text" . }}'
    send_resolved: true
    actions:
    - type: button
      text: 'View in Grafana'
      url: '{{ template "slack.grafana.url" . }}'

- name: 'email'
  email_configs:
  - to: 'admin@yourcompany.com'
    from: 'alertmanager@yourcompany.com'
    smarthost: 'smtp.yourcompany.com:587'
    auth_username: 'alertmanager@yourcompany.com'
    auth_password: 'your-password'
    send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance'] 