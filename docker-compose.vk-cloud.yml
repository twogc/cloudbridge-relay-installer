version: '3.8'

services:
  cloudbridge-relay:
    # Используем VK Cloud Container Registry
    image: registry.vkcs.ru/cloudbridge-relay:latest
    container_name: cloudbridge-relay
    restart: unless-stopped
    
    # Безопасный режим с необходимыми capabilities для WireGuard
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    
    # Сетевые порты
    ports:
      - "8080:8080"      # Main TCP API
      - "8081:8081"      # Relay Metrics (метрики)
      - "3456:3456"      # Relay Custom
      - "9090:9090/udp"  # QUIC Protocol
      - "51820:51820/udp"  # WireGuard P2P Mesh
    
    # Тома для конфигурации и данных
    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
      - /etc/wireguard:/etc/wireguard:ro
      - /var/run/wireguard:/var/run/wireguard
      - wireguard-data:/var/lib/wireguard
    
    # Переменные окружения
    environment:
      - CONFIG_PATH=/app/configs/config.json
      - LOG_LEVEL=info
      - WIREGUARD_ENABLED=true
      - TZ=UTC
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Лимиты ресурсов
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Логирование
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Сеть
    networks:
      - cloudbridge-network
    
    # Зависимости
    depends_on:
      - prometheus
      - grafana

  # Prometheus для метрик
  prometheus:
    image: prom/prometheus:latest
    container_name: cloudbridge-prometheus
    restart: unless-stopped
    
    ports:
      - "9091:9090"
    
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    
    networks:
      - cloudbridge-network

  # Grafana для визуализации
  grafana:
    image: grafana/grafana:latest
    container_name: cloudbridge-grafana
    restart: unless-stopped
    
    ports:
      - "3000:3000"
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    
    networks:
      - cloudbridge-network

# Тома для постоянных данных
volumes:
  wireguard-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# Сеть
networks:
  cloudbridge-network:
    driver: bridge
