version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudbridge-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-cloudbridge}
      - POSTGRES_USER=${POSTGRES_USER:-cloudbridge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cloudbridge123}
      - TZ=Europe/Moscow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cloudbridge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-cloudbridge} -d $${POSTGRES_DB:-cloudbridge}"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: cloudbridge-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      - TZ=Europe/Moscow
    volumes:
      - redis_data:/data
    networks:
      - cloudbridge-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.1
    container_name: cloudbridge-keycloak
    restart: unless-stopped
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=${POSTGRES_USER:-cloudbridge}
      - KC_DB_PASSWORD=${POSTGRES_PASSWORD:-cloudbridge123}
      - KC_HTTPS_CERTIFICATE_FILE=/etc/x509/https/fullchain.pem
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/etc/x509/https/privkey.pem
      - TZ=Europe/Moscow
    volumes:
      - ./keycloak_providers:/opt/keycloak/providers
      - /etc/relay/certs:/etc/x509/https:ro
    command: start-dev --https-certificate-file=/etc/x509/https/fullchain.pem --https-certificate-key-file=/etc/x509/https/privkey.pem
    ports:
      - "443:8443"
    depends_on:
      - postgres
    networks:
      - cloudbridge-network

  cloudbridge-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudbridge-relay
    restart: unless-stopped
    environment:
      - RELAY_CONFIG_PATH=/app/config/config.json
      - RELAY_LOG_LEVEL=${RELAY_LOG_LEVEL:-debug}
      - RELAY_METRICS_PORT=${RELAY_METRICS_PORT:-8081}
      - RELAY_SERVER_PORT=${RELAY_SERVER_PORT:-8080}
      - TZ=Europe/Moscow
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
      - "3456:3456"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - cloudbridge-network
    depends_on:
      - redis
      - postgres
      - keycloak
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3456/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: cloudbridge-prometheus
    restart: unless-stopped
    environment:
      - TZ=Europe/Moscow
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - cloudbridge-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:10.0.0
    container_name: cloudbridge-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - TZ=Europe/Moscow
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - cloudbridge-network
    depends_on:
      - prometheus

networks:
  cloudbridge-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local