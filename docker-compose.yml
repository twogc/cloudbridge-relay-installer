version: '3.8'

services:
  cloudbridge-relay:
    image: twogc/cloudbridge-relay:latest
    container_name: cloudbridge-relay
    restart: unless-stopped
    
    # Безопасный режим с необходимыми capabilities для WireGuard
    security_opt:
      - no-new-privileges:true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    
    # Сетевые порты - не нужны в host mode
    # ports:
    #   - "9090:9090"      # Main TCP API (QUIC)
    #   - "9090:9090/udp"  # QUIC Protocol
    #   - "51820:51820/udp"  # WireGuard P2P Mesh
    #   - "8084:8084"      # Metrics (Prometheus)
    
    # Тома для конфигурации и данных
    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
      - /etc/wireguard:/etc/wireguard:ro
      - /var/run/wireguard:/var/run/wireguard
      - wireguard-data:/var/lib/wireguard
    
    # Переменные окружения
    environment:
      - CONFIG_PATH=/app/configs/config.json
      - LOG_LEVEL=info
      - WIREGUARD_ENABLED=true
      - TZ=UTC
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Лимиты ресурсов
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Логирование
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Сеть - используем host для WireGuard UDP
    network_mode: host
    
    # Зависимости
    depends_on:
      - prometheus
      - grafana

  # Prometheus для метрик
  prometheus:
    image: prom/prometheus:latest
    container_name: cloudbridge-prometheus
    restart: unless-stopped
    
    ports:
      - "9091:9090"
    
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    
    networks:
      - cloudbridge-network

  # Grafana для визуализации
  grafana:
    image: grafana/grafana:latest
    container_name: cloudbridge-grafana
    restart: unless-stopped
    
    ports:
      - "3000:3000"
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    
    networks:
      - cloudbridge-network



  # WireGuard UI (опционально) - отключен из-за проблем с правами доступа
  # wireguard-ui:
  #   image: ngoduykhanh/wireguard-ui:latest
  #   container_name: cloudbridge-wireguard-ui
  #   restart: unless-stopped
  #   
  #   ports:
  #     - "5000:5000"
  #   
  #   volumes:
  #     - ./configs/wireguard:/etc/wireguard:ro
  #     - wireguard-ui-data:/app/db
  #   
  #   environment:
  #     - WG_I_AUTHENTICATION_ENABLED=true
  #     - WG_I_AUTHENTICATION_USERNAME=admin
  #     - WG_I_AUTHENTICATION_PASSWORD=admin
  #     - WG_I_SERVER_INTERFACE_ADDRESSES=10.100.1.1/24
  #     - WG_I_SERVER_PORT=51820
  #     - WG_I_DNS=1.1.1.1, 8.8.8.8
  #   
  #   networks:
  #     - cloudbridge-network

  # Nginx для reverse proxy (опционально) - отключен из-за конфликта с Keycloak
  # nginx:
  #   image: nginx:alpine
  #   container_name: cloudbridge-nginx
  #   restart: unless-stopped
  #   
  #   ports:
  #     - "8088:80"
  #     - "8443:443"
  #   
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   
  #   networks:
  #     - cloudbridge-network
  #   
  #   depends_on:
  #     - cloudbridge-relay

# Тома для постоянных данных
volumes:
  wireguard-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  wireguard-ui-data:
    driver: local


# Сеть
networks:
  cloudbridge-network:
    driver: bridge