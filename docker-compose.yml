# CloudBridge Relay v2.0 - Docker Compose
# Enterprise-grade высокопроизводительный relay сервер

version: '3.8'

services:
  # Основной сервис CloudBridge Relay
  cloudbridge-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudbridge-relay
    ports:
      - "8080:8080"  # Основной порт сервиса
      - "8081:8081"  # Порт метрик и health check
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - RELAY_CONFIG_PATH=/app/config/config.json
      - RELAY_LOG_LEVEL=debug
      - RELAY_METRICS_PORT=8081
      - RELAY_SERVER_PORT=8080
      - TZ=UTC
    networks:
      - cloudbridge-network
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.relay.rule=Host(`relay.localhost`)"
      - "traefik.http.services.relay.loadbalancer.server.port=8080"

  # Redis для кэширования и сессий
  redis:
    image: redis:7-alpine
    container_name: cloudbridge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cloudbridge-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: redis-server --appendonly yes --requirepass redis123

  # PostgreSQL для хранения данных
  postgres:
    image: postgres:15-alpine
    container_name: cloudbridge-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=cloudbridge
      - POSTGRES_USER=cloudbridge
      - POSTGRES_PASSWORD=cloudbridge123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - cloudbridge-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudbridge -d cloudbridge"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus для мониторинга
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: cloudbridge-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - cloudbridge-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'

  # Grafana для визуализации метрик
  grafana:
    image: grafana/grafana:10.0.0
    container_name: cloudbridge-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - cloudbridge-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # AlertManager для алертов
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: cloudbridge-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - cloudbridge-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

  # Traefik для reverse proxy
  traefik:
    image: traefik:v2.10
    container_name: cloudbridge-traefik
    ports:
      - "80:80"
      - "443:443"
      - "8082:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - cloudbridge-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=admin:$$2y$$10$$H6usMkkq.rYwONghjKXCyOejlMzFbGVD6lKPMBFpJYHjgeXdDpCuG"

  # Jaeger для distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:1.47
    container_name: cloudbridge-jaeger
    ports:
      - "16686:16686"  # UI
      - "14268:14268"  # HTTP collector
      - "14250:14250"  # gRPC collector
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - cloudbridge-network
    restart: unless-stopped

  # Elasticsearch для логов
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: cloudbridge-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - cloudbridge-network
    restart: unless-stopped

  # Kibana для визуализации логов
  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    container_name: cloudbridge-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - cloudbridge-network
    restart: unless-stopped
    depends_on:
      - elasticsearch

  # Filebeat для сбора логов
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.8.0
    container_name: cloudbridge-filebeat
    volumes:
      - ./monitoring/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/var/log/cloudbridge:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - cloudbridge-network
    restart: unless-stopped
    depends_on:
      - elasticsearch

# Сети
networks:
  cloudbridge-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Тома для постоянного хранения данных
volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  elasticsearch_data:
    driver: local