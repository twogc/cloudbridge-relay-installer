# Тома для постоянных данных
volumes:
  wireguard-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  wireguard-ui-data:
    driver: local
  keycloak_postgres_data:
    driver: local


# Сеть
networks:
  cloudbridge-network:
    driver: bridge