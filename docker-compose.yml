version: '3.8'

services:
  cloudbridge-relay:
    image: twogc/cloudbridge-relay:latest
    container_name: cloudbridge-relay
    restart: unless-stopped
    
    # Привилегированный режим для WireGuard
    privileged: true
    
    # Сетевые порты
    ports:
      - "80:80"          # HTTP Health Checks
      - "8080:8080"      # Main TCP API
      - "8081:8081"      # Relay Metrics (метрики)
      - "8082:8082"      # Relay API (API)
      - "9090:9090/udp"  # QUIC Protocol
      - "51820:51820/udp"  # WireGuard P2P Mesh
    
    # Тома для конфигурации и данных
    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
      - /etc/wireguard:/etc/wireguard:ro
      - /var/run/wireguard:/var/run/wireguard
      - wireguard-data:/var/lib/wireguard
    
    # Переменные окружения
    environment:
      - CONFIG_PATH=/app/configs/config.json
      - LOG_LEVEL=info
      - WIREGUARD_ENABLED=true
      - TZ=UTC
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Лимиты ресурсов
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Логирование
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Сеть
    networks:
      - cloudbridge-network
    
    # Зависимости
    depends_on:
      - prometheus
      - grafana

  # Prometheus для метрик
  prometheus:
    image: prom/prometheus:latest
    container_name: cloudbridge-prometheus
    restart: unless-stopped
    
    ports:
      - "9091:9090"
    
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    
    networks:
      - cloudbridge-network

  # Grafana для визуализации
  grafana:
    image: grafana/grafana:latest
    container_name: cloudbridge-grafana
    restart: unless-stopped
    
    ports:
      - "3000:3000"
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    
    networks:
      - cloudbridge-network

  # PostgreSQL для Keycloak
  postgres:
    image: postgres:16
    container_name: cloudbridge-postgres
    restart: unless-stopped
    networks:
      - cloudbridge-network
    env_file:
      - .env
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Keycloak Identity Provider
  keycloak:
    build:
      context: ./keycloak-vue
      dockerfile: Dockerfile
    container_name: cloudbridge-keycloak
    restart: unless-stopped
    networks:
      - cloudbridge-network
    env_file:
      - .env
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: edge.2gc.ru
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTPS_CERTIFICATE_FILE: /etc/x509/https/fullchain.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /etc/x509/https/privkey.pem
      KC_HTTPS_PORT: 8443
      KC_HTTP_PORT: 8080
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./themes/2gc:/opt/keycloak/themes/2gc
      - ./keycloak-vue/disable-theme-cache.cli:/opt/jboss/startup-scripts/disable-theme-cache.cli
      - ./certs:/etc/x509/https:ro
      - ./keycloak_providers:/opt/keycloak/providers:ro
    command: start
    user: "1000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "netstat -tlnp | grep :8443 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # WireGuard UI (опционально) - отключен из-за проблем с правами доступа
