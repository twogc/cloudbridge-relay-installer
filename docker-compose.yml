version: '3.8'

services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudbridge-relay
    ports:
      - "8080:8080"  # Main server port
      - "8081:8081"  # Metrics port
    volumes:
      - ./config/config.json:/app/config/config.json
      - ./logs:/var/log/relay
    environment:
      - LOG_LEVEL=DEBUG
    command: ["./relay", "--config", "/app/config/config.json", "--log-level", "DEBUG"]
    networks:
      - relay-network
      - lk_dasjboard_default
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus:/etc/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - relay-network

networks:
  relay-network:
    driver: bridge
  lk_dasjboard_default:
    external: true

volumes:
  prometheus_data: 