version: '3.8'

services:
  relay:
    image: cloudbridge-relay:latest
    container_name: cloudbridge-relay-test
    ports:
      - "8080:8080"   # HTTP API
      - "8443:8443"   # HTTPS API
      - "9091:9090"   # QUIC
    environment:
      - LOG_LEVEL=info
      - JWT_SECRET=test-secret-key-for-development
      - AI_ENABLED=true
      - WIREGUARD_ENABLED=true
      - QUANTUM_ENABLED=true
    volumes:
      - ../../configs:/app/configs:ro
      - ./logs:/app/logs
    networks:
      - relay-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  relay-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  logs:
    driver: local