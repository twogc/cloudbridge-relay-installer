# Per-tenant Allow Policies (adapted from kubernetes-network-policy-recipes)
# Разрешает intra-tenant коммуникацию
---
apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: tenant-216420165-allow-intra
spec:
  order: 50
  selector: tenant.cloudbridge.io/id == "tenant-216420165"
  types:
    - Ingress
    - Egress
  ingress:
    - action: Allow
      source:
        selector: tenant.cloudbridge.io/id == "tenant-216420165"
  egress:
    - action: Allow
      destination:
        selector: tenant.cloudbridge.io/id == "tenant-216420165"
