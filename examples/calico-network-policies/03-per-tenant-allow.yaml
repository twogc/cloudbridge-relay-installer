# Per-Tenant Allow Policies
# ⚡ ЖЕЛЕЗОБЕТОННАЯ защита: разрешения только внутри tenant'а
# ⚠️ КРИТИЧНО: Отдельная политика для каждого tenant'а (Calico НЕ поддерживает переменные)

---
# Tenant 216420165 - Allow intra-tenant communication
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy  
metadata:
  name: tenant-216420165-allow-intra
spec:
  tier: security      # ⚡ ИСПРАВЛЕНО: используем dedicated tier
  order: 200          # ⚡ Более низкий приоритет чем deny-all (100)
  selector: tenant.cloudbridge.io/id == "tenant-216420165"
  types: [Ingress, Egress]
  ingress:
  - action: Allow
    source:
      selector: tenant.cloudbridge.io/id == "tenant-216420165"
  egress:
  - action: Allow
    destination:
      selector: tenant.cloudbridge.io/id == "tenant-216420165"

