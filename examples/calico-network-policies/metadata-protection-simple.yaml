# Simple metadata protection policy  
---
apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: block-imds-simple
spec:
  order: 10
  selector: has(tenant.cloudbridge.io/id)
  types: [Egress]
  egress:
  # Block AWS/GCP/Azure IMDS
  - action: Deny
    destination:
      nets: ["169.254.169.254/32"]
    protocol: TCP
  - action: Deny
    destination:
      nets: ["169.254.169.254/32"]
    protocol: UDP
