# QUIC P2P (9090) - UDP проксирование
server {
    listen 9090 udp;
    server_name edge.2gc.ru;
    
    location / {
        proxy_pass udp://192.168.49.2:31284;
        proxy_timeout 1s;
        proxy_responses 1;
    }
}

