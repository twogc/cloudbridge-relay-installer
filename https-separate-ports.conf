# CloudBridge Relay HTTPS Configuration
# Используем отдельные порты для HTTPS

# HTTP to HTTPS redirect (8080 -> 8083)
server {
    listen 8080;
    server_name edge.2gc.ru;
    return 301 https://$server_name:8083$request_uri;
}

# HTTPS P2P API (8083) - основной порт
server {
    listen 8083 ssl;
    server_name edge.2gc.ru;
    
    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/edge.2gc.ru.crt;
    ssl_certificate_key /etc/nginx/ssl/edge.2gc.ru.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    location / {
        proxy_pass http://192.168.49.2:30502;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

