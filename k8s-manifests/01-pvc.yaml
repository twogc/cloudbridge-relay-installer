apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudbridge-logs-pvc
  namespace: cloudbridge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: csi-ceph-hdd-me1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cadence-pvc
  namespace: cloudbridge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: csi-ceph-hdd-me1
---
apiVersion: v1
kind: PersistentVolumeClaim
