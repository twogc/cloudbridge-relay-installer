apiVersion: v1
kind: Secret
metadata:
  name: cloudbridge-secrets
  namespace: cloudbridge
type: Opaque
data:
  cassandra-username: Y2Fzc2FuZHJhLXVzZXJuYW1l # base64 encoded
  cassandra-password: Y2Fzc2FuZHJhLXBhc3N3b3Jk # base64 encoded
  api-key: YXBpLWtleQ== # base64 encoded
  jwt-secret: aml3dC1zZWNyZXQ= # base64 encoded
---
apiVersion: v1
kind: Secret
metadata:
  name: wireguard-keys
  namespace: cloudbridge
type: Opaque
data:
  private-key: <base64_encoded_private_key>
  public-key: <base64_encoded_public_key>
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudbridge-tls
  namespace: cloudbridge
type: kubernetes.io/tls
data:
  tls.crt: <base64_encoded_cert>
  tls.key: <base64_encoded_key>
---
apiVersion: v1
kind: Secret
metadata:
  name: k8s-registry-creds
  namespace: cloudbridge
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <base64_encoded_docker_config>
