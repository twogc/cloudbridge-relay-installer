apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbridge-relay
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: relay
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudbridge-relay
      app.kubernetes.io/component: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudbridge-relay
        app.kubernetes.io/component: relay
        app.kubernetes.io/part-of: cloudbridge-relay
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5551"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
      - name: k8s-registry-creds
      containers:
      - name: cloudbridge-relay
        image: docker-registry:5000/cloudbridge-relay:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9090
          protocol: TCP
        - name: quic
          containerPort: 9090
          protocol: UDP
        - name: wireguard
          containerPort: 51820
          protocol: UDP
        - name: grpc
          containerPort: 8444
          protocol: TCP
        - name: health
          containerPort: 9091
        - name: metrics
          containerPort: 5551
          protocol: TCP
          protocol: TCP
        env:
        - name: CONFIG_PATH
          value: "/app/configs/config.json"
        - name: LOG_LEVEL
          value: "info"
        - name: GIN_MODE
          value: "release"
        - name: TZ
          value: "UTC"
        - name: CASSANDRA_HOSTS
          value: "cassandra-service"
        - name: CASSANDRA_PORT
          value: "9042"
        - name: CASSANDRA_USERNAME
          valueFrom:
            secretKeyRef:
              name: cloudbridge-secrets
              key: cassandra-username
        - name: CASSANDRA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloudbridge-secrets
              key: cassandra-password
        - name: CADENCE_HOST
          value: "cadence-service"
        - name: CADENCE_PORT
          value: "7933"
        - name: WIREGUARD_ENABLED
          value: "true"
        - name: WIREGUARD_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: wireguard-keys
              key: private-key
        - name: WIREGUARD_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: wireguard-keys
              key: public-key
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: cloudbridge-secrets
              key: api-key
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: cloudbridge-secrets
              key: jwt-secret
        - name: PROMETHEUS_URL
          value: "http://prometheus-server.monitoring.svc.cluster.local:9090"
        - name: RELAY_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: cloudbridge-secrets
              key: jwt-secret
        - name: GRPC_ENABLED
          value: "true"
        - name: GRPC_PORT
          value: "8444"
        - name: GRPC_TLS_ENABLED
          value: "true"
        - name: GRPC_CERT_FILE
          value: "/app/certs/tls.crt"
        - name: GRPC_KEY_FILE
          value: "/app/certs/tls.key"
        volumeMounts:
        - name: config
          mountPath: /app/configs
          readOnly: true
        - name: logs
          mountPath: /app/logs
        - name: wireguard-config
          mountPath: /etc/wireguard
          readOnly: true
        - name: tls-certs
          mountPath: /app/certs
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: cloudbridge-config
      - name: logs
        persistentVolumeClaim:
          claimName: cloudbridge-logs-pvc
      - name: wireguard-config
        secret:
          secretName: wireguard-keys
      - name: tls-certs
        secret:
          secretName: cloudbridge-tls
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: ai-service
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
      app.kubernetes.io/component: ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/component: ai-service
        app.kubernetes.io/part-of: cloudbridge-relay
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
      - name: k8s-registry-creds
      containers:
      - name: ai-service
        image: docker-registry:5000/ai-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8083
          protocol: TCP
        env:
        - name: LOG_LEVEL
          value: "info"
        - name: GIN_MODE
          value: "release"
        - name: TZ
          value: "UTC"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: cloudbridge-secrets
              key: api-key
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: cloudbridge-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadence
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cadence
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: cadence
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cadence
      app.kubernetes.io/component: cadence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cadence
        app.kubernetes.io/component: cadence
        app.kubernetes.io/part-of: cloudbridge-relay
        app.kubernetes.io/version: "1.0.0"
    spec:
      imagePullSecrets:
      - name: k8s-registry-creds
      containers:
      - name: cadence
        image: ubercadence/server:v0.22.4
        imagePullPolicy: IfNotPresent
        ports:
        - name: grpc
          containerPort: 7933
          protocol: TCP
        - name: grpc-membership
          containerPort: 7934
          protocol: TCP
        - name: grpc-frontend
          containerPort: 7935
          protocol: TCP
        - name: grpc-history
          containerPort: 7939
          protocol: TCP
        env:
        - name: TZ
          value: "UTC"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          tcpSocket:
            port: 7933
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 7933
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: cadence-data
          mountPath: /app/data
      volumes:
      - name: cadence-data
        persistentVolumeClaim:
          claimName: cadence-pvc
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
