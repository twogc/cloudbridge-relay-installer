apiVersion: v1
kind: Service
metadata:
  name: cloudbridge-relay-service
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
spec:
  selector:
    app.kubernetes.io/name: cloudbridge-relay
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    protocol: TCP
  - name: quic
    port: 9090
    targetPort: 9090
    protocol: UDP
  - name: wireguard
    port: 51820
    targetPort: 51820
    protocol: UDP
  - name: grpc
    port: 8444
    targetPort: 8444
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: ai-service
spec:
  selector:
    app.kubernetes.io/name: ai-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: cadence-service
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cadence
spec:
  selector:
    app.kubernetes.io/name: cadence
  ports:
  - name: grpc
    port: 7933
    targetPort: 7933
    protocol: TCP
  - name: grpc-membership
    port: 7934
    targetPort: 7934
    protocol: TCP
  - name: grpc-frontend
    port: 7935
    targetPort: 7935
    protocol: TCP
  - name: grpc-history
    port: 7939
    targetPort: 7939
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra-service
  namespace: cloudbridge
  labels:
    app: cassandra
spec:
  selector:
    app: cassandra
  ports:
  - port: 9042
    targetPort: 9042
    protocol: TCP
  type: ClusterIP
