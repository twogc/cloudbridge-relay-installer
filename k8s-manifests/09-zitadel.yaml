apiVersion: v1
kind: Namespace
metadata:
  name: zitadel
  labels:
    name: zitadel
    app: zitadel
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zitadel-pvc
  namespace: zitadel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: csi-ceph-hdd-me1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-config
  namespace: zitadel
data:
  config.yaml: |
    database:
      postgres:
        host: postgres-service.cloudbridge.svc.cluster.local
        port: 5432
        database: zitadel
        user: zitadel
        password: zitadel_password
        ssl:
          mode: disable
    externalPort: 8080
    externalSecure: false
    externalDomain: zitadel.cloudbridge.local
    defaultInstance:
      name: CloudBridge
      org:
        name: CloudBridge Organization
        domain: cloudbridge.local
    security:
      allowOrigins:
        - "http://localhost:3000"
        - "https://zitadel.cloudbridge.local"
    log:
      level: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel
  namespace: zitadel
  labels:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/component: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zitadel
      app.kubernetes.io/name: zitadel
      app.kubernetes.io/component: identity
  template:
    metadata:
      labels:
        app: zitadel
        app.kubernetes.io/name: zitadel
        app.kubernetes.io/component: identity
    spec:
      containers:
      - name: zitadel
        image: ghcr.io/zitadel/zitadel:latest
        command: ["/bin/sh"]
        args: ["-c", "zitadel start-from-init --config /zitadel/config.yaml"]
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: grpc
          containerPort: 8081
          protocol: TCP
        env:
        - name: ZITADEL_DATABASE_POSTGRES_HOST
          value: "postgres-service.cloudbridge.svc.cluster.local"
        - name: ZITADEL_DATABASE_POSTGRES_PORT
          value: "5432"
        - name: ZITADEL_DATABASE_POSTGRES_DATABASE
          value: "zitadel"
        - name: ZITADEL_DATABASE_POSTGRES_USER
          value: "zitadel"
        - name: ZITADEL_DATABASE_POSTGRES_PASSWORD
          value: "zitadel_password"
        - name: ZITADEL_DATABASE_POSTGRES_SSL_MODE
          value: "disable"
        - name: ZITADEL_EXTERNALPORT
          value: "8080"
        - name: ZITADEL_EXTERNALSECURE
          value: "false"
        - name: ZITADEL_EXTERNALDOMAIN
          value: "zitadel.cloudbridge.local"
        - name: ZITADEL_DEFAULTINSTANCE_NAME
          value: "CloudBridge"
        - name: ZITADEL_DEFAULTINSTANCE_ORG_NAME
          value: "CloudBridge Organization"
        - name: ZITADEL_DEFAULTINSTANCE_ORG_DOMAIN
          value: "cloudbridge.local"
        - name: ZITADEL_SECURITY_ALLOWORIGINS
          value: "http://localhost:3000,https://zitadel.cloudbridge.local"
        - name: ZITADEL_LOG_LEVEL
          value: "info"
        volumeMounts:
        - name: zitadel-data
          mountPath: /zitadel
        - name: zitadel-config
          mountPath: /zitadel/config.yaml
          subPath: config.yaml
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: zitadel-data
        persistentVolumeClaim:
          claimName: zitadel-pvc
      - name: zitadel-config
        configMap:
          name: zitadel-config
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel-service
  namespace: zitadel
  labels:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/component: identity
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: grpc
    port: 8081
    targetPort: 8081
    protocol: TCP
  selector:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/component: identity
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel-nodeport
  namespace: zitadel
  labels:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/component: identity
spec:
  type: NodePort
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
  - name: grpc
    port: 8081
    targetPort: 8081
    nodePort: 30081
    protocol: TCP
  selector:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/component: identity
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zitadel-ingress
  namespace: zitadel
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: zitadel.cloudbridge.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zitadel-service
            port:
              number: 8080
