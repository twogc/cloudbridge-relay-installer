apiVersion: v1
kind: Namespace
metadata:
  name: zitadel
  labels:
    name: zitadel
    app: zitadel
---
# PostgreSQL для Zitadel
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: zitadel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: csi-ceph-hdd-me1
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: zitadel
type: Opaque
data:
  postgres-password: cG9zdGdyZXNfcGFzc3dvcmQ= # base64: postgres_password
  zitadel-password: eml0YWRlbF9wYXNzd29yZA== # base64: zitadel_password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: zitadel
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - name: postgres
          containerPort: 5432
          protocol: TCP
        env:
        - name: POSTGRES_DB
          value: "zitadel"
        - name: POSTGRES_USER
          value: "zitadel"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: zitadel-password
        - name: POSTGRES_INITDB_ARGS
          value: "--auth-host=scram-sha-256"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
          subPath: postgres-data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: zitadel
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
---
# Zitadel Master Key Secret
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-masterkey
  namespace: zitadel
type: Opaque
data:
  masterkey: bWFzdGVya2V5X2Zvcl96aXRhZGVsX2Nsb3VkYnJpZGdl # base64: masterkey_for_zitadel_cloudbridge
---
# Zitadel Admin Secret
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-admin
  namespace: zitadel
type: Opaque
data:
  email: YWRtaW5AY2xvdWRicmlkZ2UubG9jYWw= # base64: admin@cloudbridge.local
  password: YWRtaW5fcGFzc3dvcmQ= # base64: admin_password
---
# Zitadel ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-config
  namespace: zitadel
data:
  config.yaml: |
    ExternalDomain: zitadel.cloudbridge.local
    ExternalSecure: false
    ExternalPort: 8080
    
    Database:
      postgres:
        host: postgres-service.zitadel.svc.cluster.local
        port: 5432
        database: zitadel
        user:
          username: zitadel
          password: zitadel_password
        admin:
          username: postgres
          password: postgres_password
        ssl:
          mode: disable
    
    Log:
      level: info
      format: json
    
    DefaultInstance:
      name: CloudBridge
      org:
        name: CloudBridge Organization
        domain: cloudbridge.local
        loginClient:
          machine:
            username: zitadel-admin
            name: CloudBridge Admin Client
          pat:
            expirationDate: 2029-12-31T23:59:59Z
    
    SystemDefaults:
      accessTokenLifetime: 900s
      idTokenLifetime: 3600s
      refreshTokenLifetime: 28800s
---
# Zitadel PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zitadel-pvc
  namespace: zitadel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: csi-ceph-hdd-me1
---
# Zitadel Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel
  namespace: zitadel
  labels:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/component: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zitadel
      app.kubernetes.io/name: zitadel
      app.kubernetes.io/component: identity
  template:
    metadata:
      labels:
        app: zitadel
        app.kubernetes.io/name: zitadel
        app.kubernetes.io/component: identity
    spec:
      initContainers:
      - name: zitadel-init
        image: ghcr.io/zitadel/zitadel:latest
        command: ["zitadel"]
        args: ["init", "--config", "/zitadel/config.yaml", "--masterkey", "/zitadel/masterkey"]
        env:
        - name: ZITADEL_DATABASE_POSTGRES_HOST
          value: "postgres-service.zitadel.svc.cluster.local"
        - name: ZITADEL_DATABASE_POSTGRES_PORT
          value: "5432"
        - name: ZITADEL_DATABASE_POSTGRES_DATABASE
          value: "zitadel"
        - name: ZITADEL_DATABASE_POSTGRES_USER
          value: "zitadel"
        - name: ZITADEL_DATABASE_POSTGRES_PASSWORD
          value: "zitadel_password"
        - name: ZITADEL_DATABASE_POSTGRES_SSL_MODE
          value: "disable"
        volumeMounts:
        - name: zitadel-data
          mountPath: /zitadel
        - name: zitadel-config
          mountPath: /zitadel/config.yaml
          subPath: config.yaml
        - name: zitadel-masterkey
          mountPath: /zitadel/masterkey
          subPath: masterkey
      containers:
      - name: zitadel
        image: ghcr.io/zitadel/zitadel:latest
        command: ["zitadel"]
        args: ["start-from-setup", "--config", "/zitadel/config.yaml", "--masterkey", "/zitadel/masterkey"]
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: grpc
          containerPort: 8081
          protocol: TCP
        env:
        - name: ZITADEL_DATABASE_POSTGRES_HOST
          value: "postgres-service.zitadel.svc.cluster.local"
        - name: ZITADEL_DATABASE_POSTGRES_PORT
          value: "5432"
        - name: ZITADEL_DATABASE_POSTGRES_DATABASE
          value: "zitadel"
        - name: ZITADEL_DATABASE_POSTGRES_USER
          value: "zitadel"
        - name: ZITADEL_DATABASE_POSTGRES_PASSWORD
          value: "zitadel_password"
        - name: ZITADEL_DATABASE_POSTGRES_SSL_MODE
          value: "disable"
        - name: ZITADEL_EXTERNALPORT
          value: "8080"
        - name: ZITADEL_EXTERNALSECURE
          value: "false"
        - name: ZITADEL_EXTERNALDOMAIN
          value: "zitadel.cloudbridge.local"
        - name: ZITADEL_DEFAULTINSTANCE_NAME
          value: "CloudBridge"
        - name: ZITADEL_DEFAULTINSTANCE_ORG_NAME
          value: "CloudBridge Organization"
        - name: ZITADEL_DEFAULTINSTANCE_ORG_DOMAIN
          value: "cloudbridge.local"
        - name: ZITADEL_SECURITY_ALLOWORIGINS
          value: "http://localhost:3000,https://zitadel.cloudbridge.local"
        - name: ZITADEL_LOG_LEVEL
          value: "info"
        volumeMounts:
        - name: zitadel-data
          mountPath: /zitadel
        - name: zitadel-config
          mountPath: /zitadel/config.yaml
          subPath: config.yaml
        - name: zitadel-masterkey
          mountPath: /zitadel/masterkey
          subPath: masterkey
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1"
      volumes:
      - name: zitadel-data
        persistentVolumeClaim:
          claimName: zitadel-pvc
      - name: zitadel-config
        configMap:
          name: zitadel-config
      - name: zitadel-masterkey
        secret:
          secretName: zitadel-masterkey
---
# Zitadel Service
apiVersion: v1
kind: Service
metadata:
  name: zitadel-service
  namespace: zitadel
  labels:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/component: identity
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: grpc
    port: 8081
    targetPort: 8081
    protocol: TCP
  selector:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/component: identity
---
# Zitadel NodePort Service
apiVersion: v1
kind: Service
metadata:
  name: zitadel-nodeport
  namespace: zitadel
  labels:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/component: identity
spec:
  type: NodePort
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080
    protocol: TCP
  - name: grpc
    port: 8081
    targetPort: 8081
    nodePort: 30081
    protocol: TCP
  selector:
    app: zitadel
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/component: identity
---
# Zitadel Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zitadel-ingress
  namespace: zitadel
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/client-max-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
  - host: zitadel.cloudbridge.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zitadel-service
            port:
              number: 8080
