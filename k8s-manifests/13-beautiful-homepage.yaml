apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: default-backend
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        
        location / {
            return 200 '<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudBridge Relay Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 40px 20px;
        }
        .header { 
            text-align: center; 
            color: white; 
            margin-bottom: 60px;
        }
        .header h1 { 
            font-size: 3rem; 
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .header p { 
            font-size: 1.2rem; 
            opacity: 0.9;
        }
        .services { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 30px; 
            margin-bottom: 40px;
        }
        .service { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .service:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .service-icon { 
            font-size: 2.5rem; 
            margin-bottom: 15px;
        }
        .service h3 { 
            color: #2c5aa0; 
            margin-bottom: 10px;
            font-size: 1.3rem;
        }
        .service p { 
            color: #666; 
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .service a { 
            color: #2c5aa0; 
            text-decoration: none; 
            font-weight: 600;
            padding: 8px 16px;
            border: 2px solid #2c5aa0;
            border-radius: 25px;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .service a:hover { 
            background: #2c5aa0; 
            color: white;
        }
        .status { 
            background: rgba(255,255,255,0.1); 
            padding: 20px; 
            border-radius: 10px; 
            text-align: center;
            color: white;
            margin-top: 40px;
        }
        .status-indicator { 
            display: inline-block; 
            width: 12px; 
            height: 12px; 
            background: #4CAF50; 
            border-radius: 50%; 
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .footer { 
            text-align: center; 
            color: white; 
            margin-top: 40px; 
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 CloudBridge Relay Platform</h1>
            <p>Secure, Scalable, and Intelligent Network Infrastructure</p>
        </div>
        
        <div class="services">
            <div class="service">
                <div class="service-icon">🔐</div>
                <h3>Zitadel Identity Provider</h3>
                <p>Modern authentication and authorization system with OIDC/OAuth2 support.</p>
                <a href="http://zitadel.cloudbridge.local" target="_blank">Access Zitadel</a>
            </div>
            
            <div class="service">
                <div class="service-icon">📦</div>
                <h3>Docker Registry</h3>
                <p>Private container registry for secure image storage and distribution.</p>
                <a href="http://edge.2gc.ru:30000" target="_blank">Access Registry</a>
            </div>
            
            <div class="service">
                <div class="service-icon">📊</div>
                <h3>Prometheus Monitoring</h3>
                <p>Advanced metrics collection and monitoring for system observability.</p>
                <a href="http://prometheus.cloudbridge.local" target="_blank">View Metrics</a>
            </div>
            
            <div class="service">
                <div class="service-icon">📈</div>
                <h3>Grafana Dashboards</h3>
                <p>Beautiful dashboards and visualization for monitoring data.</p>
                <a href="http://grafana.cloudbridge.local" target="_blank">View Dashboards</a>
            </div>
            
            <div class="service">
                <div class="service-icon">⚡</div>
                <h3>CloudBridge Relay</h3>
                <p>High-performance network relay with AI-powered optimization.</p>
                <a href="http://relay.cloudbridge.local" target="_blank">Access Relay</a>
            </div>
            
            <div class="service">
                <div class="service-icon">🤖</div>
                <h3>AI Services</h3>
                <p>Machine learning services for intelligent network management.</p>
                <a href="http://ai.cloudbridge.local" target="_blank">Access AI</a>
            </div>
        </div>
        
        <div class="status">
            <span class="status-indicator"></span>
            <strong>System Status: Online</strong>
            <p>All services are running on VK Cloud Kubernetes</p>
        </div>
        
        <div class="footer">
            <p>Powered by VK Cloud Kubernetes • CloudBridge Relay Platform</p>
        </div>
    </div>
</body>
</html>';
            add_header Content-Type text/html;
        }
    }
