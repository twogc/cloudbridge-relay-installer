apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-analytics
  namespace: cloudbridge
  labels:
    app: ai-analytics
    component: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-analytics
  template:
    metadata:
      labels:
        app: ai-analytics
        component: ai
    spec:
      containers:
      - name: ai-analytics
        image: cloudbridge/ai-analytics:v1.0.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8084
          name: http
        env:
        - name: AI_ANALYTICS_PORT
          value: "8084"
        - name: AI_ANALYTICS_CONFIG_PATH
          value: "/root/config/ai-analytics.yaml"
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: ai-analytics-secrets
              key: slack-webhook-url
        - name: EMAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: ai-analytics-secrets
              key: email-username
              optional: true
        - name: EMAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ai-analytics-secrets
              key: email-password
              optional: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /root/config
          readOnly: true
        - name: analytics-data
          mountPath: /var/lib/cloudbridge/analytics
      volumes:
      - name: config
        configMap:
          name: ai-analytics-config
      - name: analytics-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-analytics-service
  namespace: cloudbridge
  labels:
    app: ai-analytics
spec:
  selector:
    app: ai-analytics
  ports:
  - port: 8084
    targetPort: 8084
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-analytics-config
  namespace: cloudbridge
data:
  ai-analytics.yaml: |
    enabled: true
    schedule: "*/15 * * * *"
    max_reports: 100
    retention_days: 30
    
    cloudflare_ai:
      account_id: "073ae0130b7cee5e55a1ac1a335431a8"
      api_token: "KhvSCYQeJXJ6OxN-AHRrh6ZBW-XBJnMmg9dN9qEL"
      model: "@cf/meta/llama-2-7b-chat-fp16"
      max_tokens: 1500
    
    data_sources:
      prometheus:
        enabled: true
        url: "http://ai-service:8083/metrics"
      zabbix:
        enabled: false
        url: "http://zabbix-service:10051"
      ai_service:
        enabled: true
        url: "http://ai-service:8083"
    
    notifications:
      slack:
        enabled: true
        webhook_url: "${SLACK_WEBHOOK_URL}"
        channel: "cloudbridge-alerts"
      email:
        enabled: false
        smtp_host: "smtp.gmail.com"
        smtp_port: 587
        username: "${EMAIL_USERNAME}"
        password: "${EMAIL_PASSWORD}"
        recipients: ["admin@cloudbridge.local"]
      webhooks:
        - url: "https://external-system.com/webhook"
          enabled: false
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-analytics-secrets
  namespace: cloudbridge
type: Opaque
stringData:
  slack-webhook-url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
  email-username: "your-email@gmail.com"
  email-password: "your-app-password"
