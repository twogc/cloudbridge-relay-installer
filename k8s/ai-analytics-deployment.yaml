apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-analytics
  namespace: cloudbridge
  labels:
    app: ai-analytics
    component: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-analytics
  template:
    metadata:
      labels:
        app: ai-analytics
        component: ai
    spec:
      containers:
      - name: ai-analytics
        image: cloudbridge/ai-analytics:v1.0.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8084
          name: http
        env:
        - name: AI_ANALYTICS_PORT
          value: "8084"
        - name: AI_ANALYTICS_CONFIG_PATH
          value: "/app/config/ai-analytics.yaml"
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: ai-analytics-secrets
              key: slack-webhook-url
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-telegram-secret
              key: TELEGRAM_BOT_TOKEN
        - name: TELEGRAM_CHAT_ID
          valueFrom:
            secretKeyRef:
              name: ai-telegram-secret
              key: TELEGRAM_CHAT_ID
        - name: TELEGRAM_PARSE_MODE
          value: "HTML"
        - name: TELEGRAM_DISABLE_WEB_PAGE_PREVIEW
          value: "true"
        - name: EMAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: ai-analytics-secrets
              key: email-username
              optional: true
        - name: EMAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ai-analytics-secrets
              key: email-password
              optional: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8084
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: analytics-data
          mountPath: /var/lib/cloudbridge/analytics
      volumes:
      - name: config
        configMap:
          name: ai-analytics-config
      - name: analytics-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-analytics-service
  namespace: cloudbridge
  labels:
    app: ai-analytics
spec:
  selector:
    app: ai-analytics
  ports:
  - port: 8084
    targetPort: 8084
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-analytics-config
  namespace: cloudbridge
data:
  ai-analytics.yaml: |
    enabled: true
    schedule: "0 */3 * * *"
    max_reports: 100
    retention_days: 30
    
    # Увеличенные таймауты для стабильной работы
    timeouts:
      collection_timeout: "30s"
      analysis_timeout: "60s"
      notification_timeout: "20s"
      health_check_timeout: "10s"
    
    cloudflare_ai:
      account_id: "073ae0130b7cee5e55a1ac1a335431a8"
      api_token: "KhvSCYQeJXJ6OxN-AHRrh6ZBW-XBJnMmg9dN9qEL"
      model: "@cf/meta/llama-2-7b-chat-fp16"
      max_tokens: 1500
      timeout: "45s"
    
    data_sources:
      prometheus:
        enabled: true
        url: "http://ai-service:8083/metrics"
        timeout: "20s"
        retry_count: 3
      zabbix:
        enabled: false
        url: "http://zabbix-service:10051"
        timeout: "15s"
      ai_service:
        enabled: true
        url: "http://ai-service:8083"
        timeout: "25s"
        retry_count: 2
    
    notifications:
      slack:
        enabled: true
        webhook_url: "${SLACK_WEBHOOK_URL}"
        channel: "cloudbridge-alerts"
      telegram:
        enabled: true
        bot_token: "${TELEGRAM_BOT_TOKEN}"
        chat_id: "${TELEGRAM_CHAT_ID}"
        parse_mode: "HTML"
        disable_web_page_preview: true
      email:
        enabled: false
        smtp_host: "smtp.gmail.com"
        smtp_port: 587
        username: "${EMAIL_USERNAME}"
        password: "${EMAIL_PASSWORD}"
        recipients:
          - "admin@cloudbridge.local"
      webhooks:
        - url: "https://external-system.com/webhook"
          enabled: false
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-analytics-secrets
  namespace: cloudbridge
type: Opaque
stringData:
  slack-webhook-url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
  email-username: "your-email@gmail.com"
  email-password: "your-app-password"
