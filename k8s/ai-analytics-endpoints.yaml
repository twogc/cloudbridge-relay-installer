apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-analytics-endpoints
  namespace: cloudbridge
  labels:
    app.kubernetes.io/component: ai
    app.kubernetes.io/name: ai-analytics-endpoints
    app.kubernetes.io/part-of: cloudbridge-relay
data:
  endpoints.yaml: |
    # AI Analytics API Endpoints Configuration
    
    # Health and Status
    /health:
      method: GET
      description: "Health check endpoint"
      response: '{"service":"ai-analytics","status":"healthy"}'
    
    # Analytics Data
    /api/v1/analytics/metrics:
      method: GET
      description: "Get analytics metrics"
      response: '{"metrics":{"total_requests":1000,"success_rate":0.95,"avg_response_time":150,"error_rate":0.05},"time_range":"24h","last_updated":"2025-09-20T13:30:42Z"}'
    
    /api/v1/analytics/reports:
      method: GET
      description: "Get analytics reports"
      response: '{"reports":[{"id":"daily-report","name":"Daily Analytics Report","date":"2025-09-20","summary":{"total_events":1000,"anomalies":5,"optimizations":50}}]}'
    
    /api/v1/analytics/dashboard:
      method: GET
      description: "Get dashboard data"
      response: '{"dashboard":{"widgets":[{"type":"chart","title":"Network Performance","data":{"labels":["00:00","06:00","12:00","18:00"],"datasets":[{"label":"Latency","data":[50,45,55,48]}]}}]}}'
    
    # AI Analysis
    /api/v1/ai/analyze:
      method: POST
      description: "Analyze network conditions using AI"
      request_body: '{"tenant_id":"string","source_peer":"string","target_peer":"string","data_size":1024,"priority":"medium","network_conditions":{"latency":50,"bandwidth":1000,"packet_loss":0.01}}'
      response: '{"analysis_id":"uuid","status":"completed","recommendations":["route_optimization","load_balancing"],"confidence":0.85,"processing_time_ms":150}'
    
    # Real-time Analytics
    /api/v1/analytics/real-time:
      method: GET
      description: "Get real-time analytics data"
      response: '{"real_time":{"active_connections":100,"current_latency":45,"bandwidth_usage":0.8,"anomalies_detected":2,"last_updated":"2025-09-20T13:30:42Z"}}'
    
    # Historical Data
    /api/v1/analytics/historical:
      method: GET
      description: "Get historical analytics data"
      response: '{"historical":{"time_range":"7d","data_points":[{"timestamp":"2025-09-20T13:30:42Z","latency":45,"bandwidth":1000,"connections":100}]}}'
    
    # Performance Metrics
    /api/v1/analytics/performance:
      method: GET
      description: "Get performance metrics"
      response: '{"performance":{"cpu_usage":0.6,"memory_usage":0.8,"disk_usage":0.4,"network_throughput":1000,"response_time":150}}'
