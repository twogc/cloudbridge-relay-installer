apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-service-endpoints
  namespace: cloudbridge
  labels:
    app.kubernetes.io/component: ai
    app.kubernetes.io/name: ai-service-endpoints
    app.kubernetes.io/part-of: cloudbridge-relay
data:
  endpoints.yaml: |
    # AI Service API Endpoints Configuration
    
    # Health and Status
    /health:
      method: GET
      description: "Health check endpoint"
      response: '{"service":"ai","status":"healthy"}'
    
    /metrics:
      method: GET
      description: "Prometheus metrics endpoint"
      response: "Prometheus metrics format"
    
    # AI Models Management
    /api/v1/ai/models:
      method: GET
      description: "Get available AI models"
      response: '{"models":[{"id":"anomaly-detector","name":"Network Anomaly Detector","status":"active","type":"isolation_forest","accuracy":0.95}]}'
    
    /api/v1/ai/models/{model_id}:
      method: GET
      description: "Get specific AI model details"
      response: '{"id":"anomaly-detector","name":"Network Anomaly Detector","status":"active","type":"isolation_forest","accuracy":0.95,"last_trained":"2025-09-20T13:30:42Z"}'
    
    # AI Analysis and Predictions
    /api/v1/ai/analyze:
      method: POST
      description: "Analyze network conditions using AI"
      request_body: '{"tenant_id":"string","source_peer":"string","target_peer":"string","data_size":1024,"priority":"medium","network_conditions":{"latency":50,"bandwidth":1000,"packet_loss":0.01}}'
      response: '{"analysis_id":"uuid","status":"completed","recommendations":["route_optimization","load_balancing"],"confidence":0.85,"processing_time_ms":150}'
    
    /api/v1/ai/predict:
      method: POST
      description: "Make AI predictions for network optimization"
      request_body: '{"tenant_id":"string","prediction_type":"routing","input_data":{"network_metrics":{"latency":50,"bandwidth":1000,"packet_loss":0.01},"historical_data":{}}}'
      response: '{"prediction_id":"uuid","prediction_type":"routing","result":{"optimal_route":"direct","predicted_latency":45,"confidence":0.9},"processing_time_ms":200}'
    
    # AI Optimization
    /api/v1/ai/optimize-routing:
      method: POST
      description: "AI-optimized routing recommendations"
      request_body: '{"tenant_id":"string","source_peer_id":"string","target_peer_id":"string","data_size":1024,"priority":"medium","network_conditions":{"latency":50,"bandwidth":1000,"packet_loss":0.01}}'
      response: '{"optimization_id":"uuid","status":"completed","optimal_route":{"path":["peer1","peer2","peer3"],"latency":45,"bandwidth":1200,"reliability":0.95},"ai_recommendations":["use_direct_connection","enable_compression"],"confidence":0.9,"processing_time_ms":180}'
    
    # Anomaly Detection
    /api/v1/ai/anomaly-detection:
      method: POST
      description: "Detect network anomalies using AI"
      request_body: '{"tenant_id":"string","network_metrics":{"latency":50,"bandwidth":1000,"packet_loss":0.01,"cpu_usage":0.8,"memory_usage":0.6},"time_window":"5m"}'
      response: '{"detection_id":"uuid","status":"completed","anomalies_detected":2,"anomaly_details":[{"type":"latency_spike","severity":"medium","confidence":0.85,"timestamp":"2025-09-20T13:30:42Z"}],"recommendations":["check_network_connectivity","monitor_peer_status"]}'
    
    # AI Status and Monitoring
    /api/v1/ai/status:
      method: GET
      description: "Get AI service status and metrics"
      response: '{"components":{"anomaly_detector":true,"data_pipeline":true,"load_predictor":true,"monitoring":true,"route_optimizer":true},"metrics":{"anomalies_detected":50,"predictions_made":200,"requests_processed":1000},"started":"2025-09-20T13:30:45Z","status":"running"}'
    
    # AI Analytics Integration
    /api/v1/ai/analytics:
      method: GET
      description: "Get AI analytics data"
      response: '{"analytics":{"total_predictions":1000,"accuracy_rate":0.85,"anomalies_detected":50,"optimization_success_rate":0.9},"time_range":"24h","last_updated":"2025-09-20T13:30:42Z"}'
    
    # Cadence Integration
    /api/v1/ai/cadence/workflows:
      method: GET
      description: "Get AI-related Cadence workflows"
      response: '{"workflows":[{"id":"ai-optimized-routing","name":"AI Optimized Routing Workflow","status":"active","last_execution":"2025-09-20T13:30:42Z"}]}'
    
    /api/v1/ai/cadence/workflows/{workflow_id}/execute:
      method: POST
      description: "Execute AI Cadence workflow"
      request_body: '{"tenant_id":"string","input":{"source_peer":"peer1","target_peer":"peer2","optimization_type":"routing"}}'
      response: '{"workflow_id":"uuid","execution_id":"uuid","status":"started","estimated_completion":"2025-09-20T13:35:42Z"}'
