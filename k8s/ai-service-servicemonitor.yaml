apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-service
  namespace: cloudbridge-monitoring
  labels:
    app: ai-service
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
    - cloudbridge


