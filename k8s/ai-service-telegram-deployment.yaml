apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: cloudbridge
  labels:
    app.kubernetes.io/component: ai
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: cloudbridge-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: ai
      app.kubernetes.io/name: ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ai
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/part-of: cloudbridge-relay
    spec:
      initContainers:
      - name: timezone-setup
        image: alpine:3.18
        command: ['sh', '-c']
        args:
        - |
          apk add --no-cache tzdata
          cp /usr/share/zoneinfo/Europe/Moscow /etc/localtime
          echo "Europe/Moscow" > /tmp/timezone
          cp /tmp/timezone /etc/timezone
        volumeMounts:
        - name: timezone-volume
          mountPath: /etc/localtime
        - name: timezone-volume
          mountPath: /etc/timezone
      containers:
      - name: ai-service
        image: ai-service:ai-telegram-20250925-175138
        imagePullPolicy: Never
        ports:
        - containerPort: 8083
          name: http
        - containerPort: 8080
          name: metrics
        env:
        # AI Configuration
        - name: AI_ENABLED
          value: "true"
        - name: AI_MODE
          value: "kubernetes"
        - name: AI_MODELS_PATH
          value: "/app/models"
        - name: AI_REDIS_ADDRESS
          value: "redis-service:6379"
        - name: AI_REDIS_PASSWORD
          value: ""
        - name: AI_REDIS_DB
          value: "0"
        
        # Telegram Configuration
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: ai-telegram-secret
              key: TELEGRAM_BOT_TOKEN
        - name: TELEGRAM_CHAT_ID
          valueFrom:
            secretKeyRef:
              name: ai-telegram-secret
              key: TELEGRAM_CHAT_ID
        
        # Cloudflare AI Secrets
        - name: CLOUDFLARE_AI_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-ai-secret
              key: CLOUDFLARE_AI_TOKEN
        - name: CLOUDFLARE_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: cloudflare-ai-secret
              key: CLOUDFLARE_ACCOUNT_ID
        - name: CLOUDFLARE_AI_MODEL
          value: "@cf/meta/llama-2-7b-chat-int8"
        - name: AI_TELEGRAM_PARSE_MODE
          value: "HTML"
        - name: AI_TELEGRAM_DISABLE_WEB_PAGE_PREVIEW
          value: "true"
        
        # Timezone Settings
        - name: TZ
          value: "Europe/Moscow"
        
        # Notification Settings
        - name: AI_NOTIFICATIONS_ENABLED
          value: "true"
        - name: RELAY_JWT_SECRET
          value: "your-jwt-secret-key-here"
        - name: AI_SEND_ANALYTICS_REPORTS
          value: "true"
        - name: AI_SEND_ANOMALY_ALERTS
          value: "true"
        - name: AI_SEND_PERFORMANCE_ALERTS
          value: "true"
        - name: AI_SEND_HEALTH_ALERTS
          value: "true"
        
        # Intervals
        - name: AI_ANALYTICS_REPORT_INTERVAL
          value: "1h"
        - name: AI_ANOMALY_CHECK_INTERVAL
          value: "5m"
        - name: AI_PERFORMANCE_CHECK_INTERVAL
          value: "10m"
        - name: AI_HEALTH_CHECK_INTERVAL
          value: "30s"
        
        # Thresholds
        - name: AI_ANOMALY_THRESHOLD
          value: "0.8"
        - name: AI_PERFORMANCE_THRESHOLD
          value: "0.85"
        - name: AI_HEALTH_THRESHOLD
          value: "0.9"
        # Resource thresholds
        - name: AI_DISK_USAGE_THRESHOLD
          value: "0.8"
        - name: AI_CPU_USAGE_THRESHOLD
          value: "0.8"
        - name: AI_MEMORY_USAGE_THRESHOLD
          value: "0.8"
        
        # Kubernetes Integration
        - name: AI_KUBERNETES_NAMESPACE
          value: "cloudbridge"
        - name: AI_KUBERNETES_MONITORING_INTERVAL
          value: "30s"
        - name: AI_KUBERNETES_METRICS_COLLECTION
          value: "true"
        - name: AI_KUBERNETES_AUTO_SCALING
          value: "true"
        
        # Prometheus Integration
        - name: AI_PROMETHEUS_URL
          value: "http://prometheus.cloudbridge-monitoring.svc.cluster.local:9090"
        
        # Cadence Integration
        - name: AI_CADENCE_INTEGRATION
          value: "true"
        
        # Cloudflare AI Integration
        - name: CLOUDFLARE_AI_ENABLED
          value: "true"
        - name: CLOUDFLARE_AI_API_URL
          value: "https://api.cloudflare.com/client/v4/accounts/073ae0130b7cee5e55a1ac1a335431a8/ai/run"
        - name: CLOUDFLARE_AI_LANGUAGE
          value: "russian"
        - name: CLOUDFLARE_AI_REPORT_PROMPT
          value: "Создай профессиональный отчет о состоянии системы CloudBridge на русском языке. Включи анализ метрик, производительности и рекомендации."
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: ai-config
          mountPath: /app/config
          readOnly: true
        - name: ai-models
          mountPath: /app/models
        - name: timezone-volume
          mountPath: /etc/localtime
          readOnly: true
        - name: timezone-volume
          mountPath: /etc/timezone
          readOnly: true
      volumes:
      - name: ai-config
        configMap:
          name: ai-telegram-config
      - name: ai-models
        emptyDir: {}
      - name: timezone-volume
        emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: cloudbridge
  labels:
    app.kubernetes.io/component: ai
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: cloudbridge-relay
spec:
  type: ClusterIP
  ports:
  - port: 8083
    targetPort: 8083
    name: http
  - port: 8080
    targetPort: 8080
    name: metrics
  selector:
    app.kubernetes.io/component: ai
    app.kubernetes.io/name: ai-service
