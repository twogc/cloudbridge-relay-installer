apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-telegram-config
  namespace: cloudbridge
  labels:
    app.kubernetes.io/component: ai
    app.kubernetes.io/name: ai-telegram-config
    app.kubernetes.io/part-of: cloudbridge-relay
data:
  ai-telegram-config.yaml: |
    # AI Telegram Configuration
    ai:
      enabled: true
      mode: "kubernetes"
      models_path: "/app/models"
      redis_address: "redis-service:6379"
      redis_password: ""
      redis_db: 0
      kubernetes:
        namespace: "cloudbridge"
        monitoring_interval: "30s"
        metrics_collection: true
        auto_scaling: true
      
      # AI Components Configuration
      anomaly_detection:
        enabled: true
        threshold: 0.8
        learning_rate: 0.01
        max_samples: 10000
        contamination: 0.1
        model_file: "anomaly_detector.gob"
        kubernetes_integration: true
        retrain_interval: "1h"
      
      predictive_analytics:
        enabled: true
        algorithm: "arima"
        forecast_horizon: 24
        confidence_level: 0.8
        model_file: "load_predictor.gob"
        retrain_interval: "6h"
      
      intelligent_routing:
        enabled: true
        algorithm: "multi_armed_bandit"
        exploration_rate: 0.1
        learning_rate: 0.05
        update_interval: "5m"
        model_file: "route_optimizer.gob"
        kubernetes_aware: true
      
      security_intelligence:
        enabled: true
        model_file: "security_threat_model.gob"
        threat_detection: true
        auto_response: false
      
      data_pipeline:
        enabled: true
        batch_size: 100
        processing_interval: "10s"
        prometheus_url: "http://prometheus-service:9090"
        retention_days: 30
        kubernetes_metrics: true
        prometheus_metrics: true
      
      monitoring:
        enabled: true
        metrics_endpoint: "/metrics"
        health_endpoint: "/health"
        cadence_integration: true
        prometheus_integration: true
      
      # Telegram Notifications Configuration
      notifications:
        enabled: true
        telegram:
          enabled: true
          bot_token: "8188460753:AAF31IbAFk1Z6Sc9hfjxvI9ZweQdHXoW0ug"
          chat_id: "-1002403555405"
          parse_mode: "HTML"
          disable_web_page_preview: true
          # Настройки уведомлений
          send_analytics_reports: true
          send_anomaly_alerts: true
          send_performance_alerts: true
          send_health_alerts: true
          # Интервалы отправки
          analytics_report_interval: "1h"
          anomaly_check_interval: "5m"
          performance_check_interval: "10m"
          health_check_interval: "30s"
          # Пороги для алертов
          anomaly_threshold: 0.8
          performance_threshold: 0.85
          health_threshold: 0.9
          # Пороги для ресурсов
          disk_usage_threshold: 0.8
          cpu_usage_threshold: 0.8
          memory_usage_threshold: 0.8
        slack:
          enabled: false
          webhook_url: ""
        email:
          enabled: false
          smtp_host: ""
          smtp_port: 587
          username: ""
          password: ""
          recipients: []
        webhooks:
          enabled: false
          urls: []
