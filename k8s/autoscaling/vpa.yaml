# Vertical Pod Autoscaler (VPA) for CloudBridge Relay
# This file contains VPA configurations for all services

---
# VPA for CloudBridge Relay main service
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cloudbridge-relay-vpa
  namespace: cloudbridge
  labels:
    app: cloudbridge-relay
    component: autoscaling
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudbridge-relay
  updatePolicy:
    updateMode: "Auto"  # Auto, Initial, Off
  resourcePolicy:
    containerPolicies:
    - containerName: cloudbridge-relay
      minAllowed:
        cpu: 100m
        memory: 128Mi
      maxAllowed:
        cpu: 2000m
        memory: 4Gi
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits
  recommendationPolicy:
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

