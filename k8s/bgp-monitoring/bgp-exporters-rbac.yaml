apiVersion: v1
kind: ServiceAccount
metadata:
  name: frr-exporter
  namespace: monitoring
  labels:
    app: frr-exporter
    component: bgp-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gobgp-exporter
  namespace: monitoring
  labels:
    app: gobgp-exporter
    component: bgp-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: frr-exporter
  labels:
    app: frr-exporter
    component: bgp-monitoring
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["monitoring.coreos.com"]
  resources: ["servicemonitors"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gobgp-exporter
  labels:
    app: gobgp-exporter
    component: bgp-monitoring
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["monitoring.coreos.com"]
  resources: ["servicemonitors"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: frr-exporter
  labels:
    app: frr-exporter
    component: bgp-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frr-exporter
subjects:
- kind: ServiceAccount
  name: frr-exporter
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gobgp-exporter
  labels:
    app: gobgp-exporter
    component: bgp-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gobgp-exporter
subjects:
- kind: ServiceAccount
  name: gobgp-exporter
  namespace: monitoring





