apiVersion: v1
kind: ConfigMap
metadata:
  name: cadence-config
  namespace: cloudbridge
data:
  config_template.yaml: |
    global:
      membership:
        maxJoinDuration: 30s
        broadcastAddress: "0.0.0.0"
        broadcastPort: 7933
        ringpop:
          name: "cadence"
          bootstrapMode: "hosts"
          bootstrapHosts: ["cadence:7933"]
      persistence:
        defaultStore: "sqlite"
        sql:
          driverName: "sqlite3"
          dataSourceName: "/var/lib/cadence/cadence.db"
        visibilityStore: "sqlite"
        sql:
          driverName: "sqlite3"
          dataSourceName: "/var/lib/cadence/visibility.db"
      clusterMetadata:
        enableGlobalDomain: true
        failoverVersionIncrement: 10
        masterClusterName: "active"
        currentClusterName: "active"
      services:
        history:
          rpc:
            grpcPort: 7933
        matching:
          rpc:
            grpcPort: 7933
        frontend:
          rpc:
            grpcPort: 7933
          pprof:
            port: 7934
        worker:
          rpc:
            grpcPort: 7933
