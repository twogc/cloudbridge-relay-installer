apiVersion: v1
kind: Namespace
metadata:
  name: cadence-system
  labels:
    name: cadence-system
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: cadence-system
type: Opaque
data:
  password: Y2FkZW5jZQ== # cadence
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cadence-config
  namespace: cadence-system
data:
  docker.yaml: |
    log:
      level: info
      output: stdout
    services:
      frontend:
        rpc:
          grpcPort: 7933
          membershipPort: 7934
          bindOnLocalHost: false
          bindOnIP: "0.0.0.0"
    persistence:
      defaultStore: postgres
      postgres:
        user: ${POSTGRES_USER}
        password: ${POSTGRES_PASSWORD}
        host: ${POSTGRES_HOST}
        port: ${POSTGRES_PORT}
        database: ${POSTGRES_DATABASE}
        sslmode: disable
    clusterMetadata:
      enableGlobalDomain: true
      failoverVersionIncrement: 10
      masterClusterName: "active"
      currentClusterName: "active"
      clusterInformation:
        active:
          enabled: true
          initialFailoverVersion: 1
          address: "127.0.0.1:7933"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cadence-system
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:13
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: cadence
        - name: POSTGRES_USER
          value: cadence
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - cadence
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - cadence
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: postgres-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: cadence-system
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadence-server
  namespace: cadence-system
  labels:
    app: cadence-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cadence-server
  template:
    metadata:
      labels:
        app: cadence-server
    spec:
      containers:
      - name: cadence-server
        image: cadence-custom:latest
        ports:
        - containerPort: 7933
          name: grpc
        - containerPort: 7934
          name: membership
        env:
        - name: POSTGRES_HOST
          value: "postgres-service"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: "cadence"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: POSTGRES_DATABASE
          value: "cadence"
        volumeMounts:
        - name: cadence-config
          mountPath: /etc/cadence/config
        # Используем кастомный entrypoint из образа
        readinessProbe:
          tcpSocket:
            port: 7933
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 7933
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: cadence-config
        configMap:
          name: cadence-config
---
apiVersion: v1
kind: Service
metadata:
  name: cadence-service
  namespace: cadence-system
spec:
  selector:
    app: cadence-server
  ports:
  - name: grpc
    port: 7933
    targetPort: 7933
  - name: membership
    port: 7934
    targetPort: 7934
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: cadence-service-external
  namespace: cadence-system
spec:
  selector:
    app: cadence-server
  ports:
  - name: grpc
    port: 7933
    targetPort: 7933
    nodePort: 30193
  - name: membership
    port: 7934
    targetPort: 7934
    nodePort: 30194
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadence-worker
  namespace: cadence-system
  labels:
    app: cadence-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cadence-worker
  template:
    metadata:
      labels:
        app: cadence-worker
    spec:
      containers:
      - name: cadence-worker
        image: cloudbridge-relay:latest
        ports:
        - containerPort: 9091
          name: api
        env:
        - name: CADENCE_HOST
          value: "cadence-service"
        - name: CADENCE_PORT
          value: "7933"
        - name: CADENCE_DOMAIN
          value: "cloudbridge"
        - name: CADENCE_TASK_LIST
          value: "cloudbridge-task-list"
        - name: CADENCE_ENABLED
          value: "true"
        command: ["/app/cloudbridge-relay"]
        args:
        - --cadence-enabled
        - --cadence-host=cadence-service:7933
        - --cadence-domain=cloudbridge
        - --cadence-task-list=cloudbridge-task-list
        readinessProbe:
          httpGet:
            path: /health
            port: 9091
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 9091
          initialDelaySeconds: 60
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: cadence-worker-service
  namespace: cadence-system
spec:
  selector:
    app: cadence-worker
  ports:
  - name: api
    port: 9091
    targetPort: 9091
  type: ClusterIP
