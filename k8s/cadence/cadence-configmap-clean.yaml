apiVersion: v1
kind: ConfigMap
metadata:
  name: cadence-config
  namespace: cloudbridge
data:
  config_template.yaml: |
    log:
      stdout: true
      level: info

    persistence:
      defaultStore: sql
      visibilityStore: sql
      numHistoryShards: 1
      datastores:
        sql:
          sql:
            driverName: sqlite
            databaseFilePath: /var/lib/cadence/cadence.db
            maxConns: 1
            maxIdleConns: 1

    services:
      frontend: { rpc: { port: 7933 } }
      history:  { rpc: { port: 7934 } }
      matching: { rpc: { port: 7935 } }
      worker:   { rpc: { port: 7939 } }

    ringpop:
      name: cadence
      bootstrapMode: none

    clusterMetadata:
      enableGlobalDomain: false
      failoverVersionIncrement: 10
      masterClusterName: active
      currentClusterName: active
      clusterInformation:
        active:
          enabled: true
          initialFailoverVersion: 1
          rpcName: cadence-frontend
          rpcAddress: 127.0.0.1:7933

    metrics:
      statsd:
        disableTags: true
