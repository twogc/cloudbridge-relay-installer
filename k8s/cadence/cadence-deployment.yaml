apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadence
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cadence
    app.kubernetes.io/component: workflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cadence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cadence
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
      volumes:
        - name: cfg-ro
          configMap:
            name: cadence-config
        - name: cfg-rw
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: cadence-data
          persistentVolumeClaim:
            claimName: cadence-pvc
      initContainers:
        - name: copy-config
          image: alpine:3.20
          command: ["/bin/sh","-c"]
          # копируем все, что в ConfigMap, в writable-том
          args: ["cp -av /cfg/* /cfgw/"]
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: cfg-ro
              mountPath: /cfg
            - name: cfg-rw
              mountPath: /cfgw
      containers:
        - name: server
          image: ubercadence/server:v0.22.4
          env:
            - name: SERVICES
              value: "frontend,history,matching,worker"
            - name: LOG_LEVEL
              value: "info"
            - name: SKIP_SCHEMA_SETUP
              value: "false"
            - name: AUTO_SETUP
              value: "true"
            - name: CONFIG_FILE_PATH
              value: "/etc/cadence/config/docker.yaml"
          ports:
            - name: rpc-frontend
              containerPort: 7933
            - name: rpc-history
              containerPort: 7934
            - name: rpc-matching
              containerPort: 7935
            - name: rpc-worker
              containerPort: 7939
          volumeMounts:
            - name: cfg-rw
              mountPath: /etc/cadence/config
            - name: tmp
              mountPath: /tmp
            - name: cadence-data
              mountPath: /var/lib/cadence
          readinessProbe:
            tcpSocket: 
              port: 7933
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            tcpSocket: 
              port: 7933
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsUser: 10001
            runAsGroup: 10001
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      nodeSelector:
        kubernetes.io/os: linux
