apiVersion: v1
kind: ConfigMap
metadata:
  name: cadence-dynamicconfig
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cadence
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: workflow-engine
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubernetes
data:
  development-sql.yaml: |
    # Минимальная динамическая конфигурация для Cadence
    frontend.enableDomainFailover:
      - value: false
    history.enableShardIDMetrics:
      - value: true
    system.enableReadFromClosedExecutionV2:
      - value: true
    system.enableVisibilitySampling:
      - value: true

