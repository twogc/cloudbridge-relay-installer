apiVersion: v1
kind: ConfigMap
metadata:
  name: cadence-config
  namespace: cloudbridge
data:
  docker.yaml: |
    log:
      level: info
      stdout: true

    services:
      frontend:
        rpc:
          port: 7933
          grpcPort: 7833
          bindOnLocalHost: false
        pprof:
          port: 7934
        metrics:
          prometheus:
            listenAddress: "0.0.0.0:8000"
      history:
        rpc:
          port: 7935
      matching:
        rpc:
          port: 7936
      worker:
        rpc:
          port: 7939

    clusterMetadata:
      enableGlobalDomain: false
      failoverVersionIncrement: 10
      masterClusterName: "active"
      currentClusterName: "active"
      clusterInformation:
        active:
          enabled: true
          initialFailoverVersion: 1
          rpcAddress: "cadence:7933"

    persistence:
      numHistoryShards: 4
      defaultStore: "sql-default"
      visibilityStore: "sql-visibility"
      datastores:
        sql-default:
          sql:
            pluginName: "postgres"
            databaseName: "cadence"
            connectAddr: "postgres.cloudbridge-system.svc:5432"
            connectProtocol: "tcp"
            user: "ipam_user"
            password: "secure_password_123"
            maxConns: 50
            maxIdleConns: 20
            maxConnLifetime: "1h"
        sql-visibility:
          sql:
            pluginName: "postgres"
            databaseName: "cadence_visibility"
            connectAddr: "postgres.cloudbridge-system.svc:5432"
            connectProtocol: "tcp"
            user: "ipam_user"
            password: "secure_password_123"
            maxConns: 50
            maxIdleConns: 20
            maxConnLifetime: "1h"

    ringpop:
      name: "cadence"
      bootstrapMode: "hosts"
      bootstrapHosts: ["cadence:7933"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadence
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cadence
    app.kubernetes.io/component: workflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cadence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cadence
    spec:
      containers:
      - name: cadence
        image: ubercadence/server:v0.22.4
        command: ["/bin/bash","-lc"]
        args:
          - |
            echo "Starting Cadence (environment variables mode)"
            exec /usr/local/bin/cadence-server start --services=frontend,history,matching,worker
        ports:
        - name: tchan-frontend
          containerPort: 7933
          protocol: TCP
        - name: web
          containerPort: 7934
          protocol: TCP
        - name: metrics
          containerPort: 8000
          protocol: TCP
        env:
        - name: CADENCE_USE_ENV_VARS
          value: "true"
        - name: LOG_LEVEL
          value: "info"
        - name: SERVICES
          value: "frontend,history,matching,worker"
        - name: DB
          value: "postgres"
        - name: DB_HOST
          value: "10.105.221.45"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "cadence"
        - name: DB_USER
          value: "ipam_user"
        - name: DB_PASSWORD
          value: "secure_password_123"
        - name: VISIBILITY_STORE
          value: "postgres"
        - name: VISIBILITY_DB_HOST
          value: "10.105.221.45"
        - name: VISIBILITY_DB_PORT
          value: "5432"
        - name: VISIBILITY_DB_NAME
          value: "cadence_visibility"
        - name: VISIBILITY_DB_USER
          value: "ipam_user"
        - name: VISIBILITY_DB_PASSWORD
          value: "secure_password_123"
        - name: CLUSTER_METADATA_ENABLE_GLOBAL_DOMAIN
          value: "false"
        - name: CLUSTER_METADATA_FAILOVER_VERSION_INCREMENT
          value: "10"
        - name: CLUSTER_METADATA_MASTER_CLUSTER_NAME
          value: "active"
        - name: CLUSTER_METADATA_CURRENT_CLUSTER_NAME
          value: "active"
        - name: SKIP_SCHEMA_SETUP
          value: "false"
        - name: AUTO_SETUP
          value: "true"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 7933
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          tcpSocket:
            port: 7933
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        volumeMounts:
        - name: cadence-config
          mountPath: /etc/cadence/config
        - name: cadence-data
          mountPath: /var/lib/cadence
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: cadence-config
        configMap:
          name: cadence-config
      - name: cadence-data
        persistentVolumeClaim:
          claimName: cadence-pvc
      - name: tmp
        emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cadence-pvc
  namespace: cloudbridge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cadence
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cadence
spec:
  ports:
    - name: tchan-frontend
      port: 7933
      targetPort: 7933
    - name: web
      port: 7934
      targetPort: 7934
    - name: metrics
      port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: cadence