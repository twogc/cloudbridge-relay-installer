apiVersion: v1
kind: ConfigMap
metadata:
  name: cadence-config
  namespace: cadence
  labels:
    app.kubernetes.io/name: cadence
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: workflow-engine
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubernetes
data:
  config.yaml: |
    log:
      level: info
      output: stdout
      format: json

    services:
      frontend:
        rpc:
          grpcPort: 7933
          membershipPort: 7933
          bindOnLocalHost: false
          bindOnIP: "0.0.0.0"
        pprof:
          port: 7934
        metrics:
          prometheus:
            timerType: histogram
            listenAddress: "0.0.0.0:9090"
        clusterMetadata:
          enableGlobalDomain: true
          failoverVersionIncrement: 10
          masterClusterName: "active"
          currentClusterName: "active"
          clusterInformation:
            active:
              enabled: true
              initialFailoverVersion: 1
              rpcName: "cadence-frontend"
              rpcAddress: "cadence-frontend.cadence.svc.cluster.local:7933"
        dcRedirectionPolicy:
          policy: "noop"
        archival:
          history:
            status: "disabled"
            enableRead: false
            provider:
              filestore:
                fileMode: "0666"
                dirMode: "0766"
          visibility:
            status: "disabled"
            enableRead: false
            provider:
              filestore:
                fileMode: "0666"
                dirMode: "0766"
        domainDefaults:
          archival:
            history:
              status: "disabled"
              URI: ""
            visibility:
              status: "disabled"
              URI: ""
          retentionDays: 3
          emitMetric: true
        dynamicConfigClient:
          filepath: "/etc/cadence/config/dynamicconfig/development-sql.yaml"
          pollInterval: "10s"
        systemWorker:
          enableArchivalCompression: false
        publicClient:
          hostPort: "cadence-frontend.cadence.svc.cluster.local:7933"
        persistence:
          defaultStore: "cassandra-default"
          numHistoryShards: 4
          datastores:
            cassandra-default:
              cassandra:
                hosts: "cassandra.cassandra.svc.cluster.local"
                port: 9042
                user: ""
                password: ""
                keyspace: "cadence"
                datacenter: "dc1"
                maxConns: 2
                maxConnectionsPerHost: 1
                connectConsistency: "local-one"
                timeout: "600ms"
                connectTimeout: "600ms"
                socketKeepalive: "0s"
                maxRetryAttempts: 3
                retryPolicy: "exponential"
                convConsistency: "local-quorum"
                reconnectionPolicy: "constant"
                disableInitialHostLookup: false
                consistency:
                  default:
                    consistency: "local-quorum"
                  serial:
                    consistency: "local-serial"
                  strong:
                    consistency: "local-quorum"
                  eventual:
                    consistency: "local-one"
                allowedAuthenticators:
                  - "org.apache.cassandra.auth.PasswordAuthenticator"
                  - "com.amazon.helix.store.cassandra.HelixCassandraAuthenticator"
                auth:
                  enabled: false
                  username: ""
                  password: ""
                  provider: "internal"
                protoVersion: 4
                maxConnsPerHost: 1
                connectConsistency: "local-one"
                timeout: "600ms"
                connectTimeout: "600ms"
                socketKeepalive: "0s"
                maxRetryAttempts: 3
                retryPolicy: "exponential"
                convConsistency: "local-quorum"
                reconnectionPolicy: "constant"
                disableInitialHostLookup: false
                consistency:
                  default:
                    consistency: "local-quorum"
                  serial:
                    consistency: "local-serial"
                  strong:
                    consistency: "local-quorum"
                  eventual:
                    consistency: "local-one"
                allowedAuthenticators:
                  - "org.apache.cassandra.auth.PasswordAuthenticator"
                  - "com.amazon.helix.store.cassandra.HelixCassandraAuthenticator"
                auth:
                  enabled: false
                  username: ""
                  password: ""
                  provider: "internal"
                protoVersion: 4

