apiVersion: v1
kind: Service
metadata:
  name: cadence-frontend
  namespace: cadence
  labels:
    app.kubernetes.io/name: cadence
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubernetes
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cadence
    app.kubernetes.io/component: frontend
    app.kubernetes.io/instance: production
  ports:
    - name: grpc
      port: 7933
      targetPort: 7933
      protocol: TCP
    - name: membership
      port: 7935
      targetPort: 7935
      protocol: TCP
    - name: pprof
      port: 7934
      targetPort: 7934
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP

