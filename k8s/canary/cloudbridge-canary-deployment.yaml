apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbridge-relay-canary
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: relay
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
    deployment-type: canary
spec:
  replicas: 1  # Start with 1 replica for 10% traffic
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudbridge-relay
      app.kubernetes.io/component: relay
      deployment-type: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudbridge-relay
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: relay
        app.kubernetes.io/part-of: cloudbridge-relay
        app.kubernetes.io/managed-by: kubectl
        deployment-type: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: "/metrics"
        # Add canary annotations for traffic splitting
        nginx.ingress.kubernetes.io/canary: "true"
        nginx.ingress.kubernetes.io/canary-weight: "10"
    spec:
      serviceAccountName: cloudbridge-relay
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: cloudbridge-relay
        image: cloudbridge-relay:grpc-enabled
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9090
          protocol: TCP
        - name: quic
          containerPort: 9090
          protocol: UDP
        - name: wireguard
          containerPort: 51820
          protocol: UDP
        - name: metrics
          containerPort: 8084
          protocol: TCP
        - name: grpc
          containerPort: 8444
          protocol: TCP
        env:
        - name: CONFIG_PATH
          value: "/app/configs/config.json"
        - name: LOG_LEVEL
          value: "info"
        - name: GIN_MODE
          value: "release"
        - name: DEPLOYMENT_TYPE
          value: "canary"
        - name: CANARY_WEIGHT
          value: "10"
        # gRPC configuration
        - name: GRPC_ENABLED
          value: "true"
        - name: GRPC_PORT
          value: "8444"
        - name: GRPC_TLS_ENABLED
          value: "true"
        - name: GRPC_CERT_FILE
          value: "/app/certs/tls.crt"
        - name: GRPC_KEY_FILE
          value: "/app/certs/tls.key"
        - name: GRPC_MTLS_ENABLED
          value: "false"  # Start without mTLS, enable later
        # Standard environment variables
        - name: TZ
          value: "UTC"
        - name: RELAY_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: cloudbridge-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: config
          mountPath: /app/configs
          readOnly: true
        - name: tls-certs
          mountPath: /app/certs
          readOnly: true
        - name: logs
          mountPath: /app/logs
        livenessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
            add:
            - NET_ADMIN
            - NET_RAW
      volumes:
      - name: config
        configMap:
          name: cloudbridge-config
      - name: logs
        persistentVolumeClaim:
          claimName: cloudbridge-logs-pvc
      - name: tls-certs
        secret:
          secretName: cloudbridge-tls
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - cloudbridge-relay
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: cloudbridge-relay-canary
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: relay
    app.kubernetes.io/part-of: cloudbridge-relay
    deployment-type: canary
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: relay
    deployment-type: canary
  ports:
  - name: relay-tcp
    port: 9090
    targetPort: 9090
    protocol: TCP
  - name: grpc-tcp
    port: 8444
    targetPort: 8444
    protocol: TCP
  - name: metrics
    port: 8084
    targetPort: 8084
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudbridge-relay-canary-ingress
  namespace: cloudbridge
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Canary"
    nginx.ingress.kubernetes.io/canary-by-header-value: "grpc"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    nginx.ingress.kubernetes.io/grpc-backend: "true"
spec:
  tls:
  - hosts:
    - grpc-canary.cloudbridge.local
    secretName: cloudbridge-tls
  rules:
  - host: grpc-canary.cloudbridge.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-canary
            port:
              number: 8444
