apiVersion: v1
kind: ConfigMap
metadata:
  name: grpc-rollout-config
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: rollout
data:
  rollout-plan.yaml: |
    # CloudBridge gRPC Staged Rollout Plan
    phases:
      
      # Phase 1: Initial Canary (10% traffic)
      - name: canary-10
        description: "Deploy gRPC with 10% traffic split"
        replicas: 1
        traffic_weight: 10
        success_criteria:
          - error_rate_threshold: 0.1  # Max 0.1% error rate
          - latency_p95_threshold: 1000  # Max 1000ms P95 latency
          - duration_minutes: 30  # Monitor for 30 minutes
        rollback_triggers:
          - error_rate: "> 0.1%"
          - latency_p95: "> 1000ms"
          - any_critical_alert: true
          
      # Phase 2: Increased Canary (25% traffic)
      - name: canary-25
        description: "Increase gRPC traffic to 25%"
        replicas: 2
        traffic_weight: 25
        success_criteria:
          - error_rate_threshold: 0.1
          - latency_p95_threshold: 1000
          - duration_minutes: 60
        rollback_triggers:
          - error_rate: "> 0.1%"
          - latency_p95: "> 1000ms"
          - any_critical_alert: true
          
      # Phase 3: Majority Traffic (50% traffic)
      - name: canary-50
        description: "Split traffic equally between gRPC and HTTP"
        replicas: 3
        traffic_weight: 50
        success_criteria:
          - error_rate_threshold: 0.1
          - latency_p95_threshold: 1000
          - duration_minutes: 120
        rollback_triggers:
          - error_rate: "> 0.1%"
          - latency_p95: "> 1000ms"
          - any_critical_alert: true
          
      # Phase 4: Full Rollout (100% traffic)
      - name: full-rollout
        description: "Complete migration to gRPC"
        replicas: 6
        traffic_weight: 100
        success_criteria:
          - error_rate_threshold: 0.1
          - latency_p95_threshold: 1000
          - duration_minutes: 240
        rollback_triggers:
          - error_rate: "> 0.1%"
          - latency_p95: "> 1000ms"
          - any_critical_alert: true
    
    monitoring:
      prometheus_queries:
        error_rate: |
          (
            sum(rate(grpc_server_handled_total{job="cloudbridge-relay",grpc_code!="OK"}[5m]))
            /
            sum(rate(grpc_server_handled_total{job="cloudbridge-relay"}[5m]))
          ) * 100
          
        latency_p95: |
          histogram_quantile(0.95, 
            sum(rate(grpc_server_handling_seconds_bucket{job="cloudbridge-relay"}[5m])) 
            by (le)
          ) * 1000
          
        active_connections: |
          sum(grpc_server_started_total{job="cloudbridge-relay"} - grpc_server_handled_total{job="cloudbridge-relay"})
          
        requests_per_second: |
          sum(rate(grpc_server_started_total{job="cloudbridge-relay"}[5m]))
      
      alerts:
        - name: grpc-error-rate
          threshold: "0.1%"
          action: "rollback"
        - name: grpc-latency-p95
          threshold: "1000ms" 
          action: "rollback"
        - name: grpc-service-down
          threshold: "1 minute"
          action: "rollback"
    
    validation:
      pre_deployment:
        - check: "prometheus-connection"
          command: "curl -s http://prometheus:9090/-/healthy"
        - check: "grafana-dashboard"
          command: "curl -s http://grafana:3000/api/health"
        - check: "tls-certificates"
          command: "kubectl get secret cloudbridge-tls -n cloudbridge"
        
      post_deployment:
        - check: "grpc-health"
          command: "grpc_health_probe -addr=cloudbridge-relay:8444"
          retry_count: 5
          retry_interval: "10s"
        - check: "metrics-endpoint"
          command: "curl -s http://cloudbridge-relay:8084/metrics | grep grpc_server"
        - check: "log-analysis"
          command: "kubectl logs deployment/cloudbridge-relay-canary | grep 'gRPC Integration started'"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: grpc-rollout-validator
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: validator
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: rollout-validator
        image: curlimages/curl:latest
        command: ["/bin/sh"]
        args:
        - -c
        - |
          set -e
          echo "Validating gRPC rollout prerequisites..."
          
          # Check if Prometheus is accessible
          echo "Checking Prometheus connection..."
          curl -f -s http://prometheus.cloudbridge-monitoring:9090/-/healthy || {
            echo "ERROR: Prometheus is not accessible"
            exit 1
          }
          
          # Check if Grafana is accessible
          echo "Checking Grafana connection..."
          curl -f -s http://grafana.cloudbridge-monitoring:3000/api/health || {
            echo "ERROR: Grafana is not accessible"
            exit 1
          }
          
          # Check if TLS certificates exist
          echo "Checking TLS certificates..."
          if ! kubectl get secret cloudbridge-tls -n cloudbridge > /dev/null 2>&1; then
            echo "ERROR: TLS certificates not found"
            exit 1
          fi
          
          # Check if gRPC metrics are being collected
          echo "Checking if gRPC metrics are available in Prometheus..."
          METRICS_CHECK=$(curl -s "http://prometheus.cloudbridge-monitoring:9090/api/v1/query?query=grpc_server_started_total" | grep -o '"status":"success"' || true)
          if [ -z "$METRICS_CHECK" ]; then
            echo "WARNING: gRPC metrics not yet available in Prometheus (this is expected before first deployment)"
          else
            echo "SUCCESS: gRPC metrics are available"
          fi
          
          echo "Validation completed successfully!"
      serviceAccountName: grpc-rollout-validator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grpc-rollout-validator
  namespace: cloudbridge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grpc-rollout-validator
  namespace: cloudbridge
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grpc-rollout-validator
  namespace: cloudbridge
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grpc-rollout-validator
subjects:
- kind: ServiceAccount
  name: grpc-rollout-validator
  namespace: cloudbridge
