apiVersion: v1
kind: PersistentVolume
metadata:
  name: cassandra-pv
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/instance: cadence
    app.kubernetes.io/version: "4.1.0"
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cadence
    app.kubernetes.io/managed-by: kubernetes
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: /data/cassandra
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cassandra-data-cassandra-0
  namespace: cassandra
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/instance: cadence
    app.kubernetes.io/version: "4.1.0"
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cadence
    app.kubernetes.io/managed-by: kubernetes
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard

