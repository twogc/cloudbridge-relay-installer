apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: cassandra
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/instance: cadence
    app.kubernetes.io/version: "4.1.0"
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cadence
    app.kubernetes.io/managed-by: kubernetes
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/instance: cadence
  ports:
    - name: intra-node
      port: 7000
      targetPort: 7000
      protocol: TCP
    - name: tls-intra-node
      port: 7001
      targetPort: 7001
      protocol: TCP
    - name: jmx
      port: 7199
      targetPort: 7199
      protocol: TCP
    - name: cql
      port: 9042
      targetPort: 9042
      protocol: TCP
    - name: thrift
      port: 9160
      targetPort: 9160
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: cassandra-headless
  namespace: cassandra
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/instance: cadence
    app.kubernetes.io/version: "4.1.0"
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cadence
    app.kubernetes.io/managed-by: kubernetes
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/instance: cadence
  ports:
    - name: cql
      port: 9042
      targetPort: 9042
      protocol: TCP

