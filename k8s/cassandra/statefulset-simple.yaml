apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: cassandra
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/instance: cadence
    app.kubernetes.io/version: "4.1.0"
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cadence
    app.kubernetes.io/managed-by: kubernetes
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cassandra
      app.kubernetes.io/instance: cadence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cassandra
        app.kubernetes.io/instance: cadence
        app.kubernetes.io/version: "4.1.0"
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: cadence
        app.kubernetes.io/managed-by: kubernetes
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-dirs
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              mkdir -p /var/lib/cassandra/data
              mkdir -p /var/lib/cassandra/commitlog
              mkdir -p /var/lib/cassandra/hints
              mkdir -p /var/lib/cassandra/saved_caches
              chown -R 999:999 /var/lib/cassandra
              chmod -R 755 /var/lib/cassandra
          volumeMounts:
            - name: cassandra-data
              mountPath: /var/lib/cassandra
          securityContext:
            runAsUser: 0
            runAsGroup: 0
      containers:
        - name: cassandra
          image: cassandra:4.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: intra-node
              containerPort: 7000
              protocol: TCP
            - name: tls-intra-node
              containerPort: 7001
              protocol: TCP
            - name: jmx
              containerPort: 7199
              protocol: TCP
            - name: cql
              containerPort: 9042
              protocol: TCP
            - name: thrift
              containerPort: 9160
              protocol: TCP
          env:
            - name: CASSANDRA_SEEDS
              value: "cassandra-0.cassandra.cassandra.svc.cluster.local"
            - name: CASSANDRA_CLUSTER_NAME
              value: "Cadence Cluster"
            - name: CASSANDRA_DC
              value: "dc1"
            - name: CASSANDRA_RACK
              value: "rack1"
            - name: CASSANDRA_AUTO_BOOTSTRAP
              value: "true"
            - name: CASSANDRA_BROADCAST_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CASSANDRA_LISTEN_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MAX_HEAP_SIZE
              value: "512M"
            - name: HEAP_NEWSIZE
              value: "100M"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/cassandra/bin/nodetool status
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - /opt/cassandra/bin/cqlsh -e "SELECT now() FROM system.local;"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: cassandra-data
              mountPath: /var/lib/cassandra
  volumeClaimTemplates:
    - metadata:
        name: cassandra-data
        labels:
          app.kubernetes.io/name: cassandra
          app.kubernetes.io/instance: cadence
          app.kubernetes.io/version: "4.1.0"
          app.kubernetes.io/component: database
          app.kubernetes.io/part-of: cadence
          app.kubernetes.io/managed-by: kubernetes
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
        storageClassName: standard
