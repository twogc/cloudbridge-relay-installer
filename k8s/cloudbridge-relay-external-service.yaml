apiVersion: v1
kind: Service
metadata:
  name: cloudbridge-relay-external
  namespace: cloudbridge
  labels:
    app: cloudbridge-relay
    app.kubernetes.io/part-of: cloudbridge-relay
spec:
  type: NodePort
  selector:
    app: cloudbridge-relay
  ports:
    # Main Server
    - name: main-server
      port: 5550
      targetPort: 5550
      nodePort: 30080
      protocol: TCP
    # Metrics
    - name: metrics
      port: 5551
      targetPort: 5551
      nodePort: 30081
      protocol: TCP
    # P2P API  
    - name: p2p-api
      port: 5552
      targetPort: 5552
      nodePort: 32500
      protocol: TCP
    # HTTP API
    - name: http-api
      port: 5553
      targetPort: 5553
      nodePort: 30087
      protocol: TCP
    # STUN Server
    - name: stun-server
      port: 19302
      targetPort: 19302
      nodePort: 30302
      protocol: UDP
    # QUIC Transport
    - name: quic-transport
      port: 9090
      targetPort: 9090
      nodePort: 30090
      protocol: UDP
    # MASQUE Proxy
    - name: masque-proxy
      port: 8443
      targetPort: 8443
      nodePort: 30443
      protocol: TCP
    # Enhanced QUIC
    - name: enhanced-quic
      port: 9092
      targetPort: 9092
      nodePort: 30092
      protocol: UDP
    # P2P QUIC Server
    - name: p2p-quic
      port: 5553
      targetPort: 5553
      nodePort: 30553
      protocol: UDP
---
