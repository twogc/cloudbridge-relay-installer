apiVersion: v1
kind: Service
metadata:
  name: cloudbridge-relay-external
  namespace: cloudbridge
  labels:
    app.kubernetes.io/component: relay
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/part-of: cloudbridge-relay
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: relay
    app.kubernetes.io/name: cloudbridge-relay
  ports:
    # HTTP API
    - name: http-api
      port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
    # P2P API  
    - name: p2p-api
      port: 8082
      targetPort: 8082
      nodePort: 30082
      protocol: TCP
    # STUN Server
    - name: stun-server
      port: 19302
      targetPort: 19302
      nodePort: 30302
      protocol: UDP
    # QUIC Transport
    - name: quic-transport
      port: 9090
      targetPort: 9090
      nodePort: 30090
      protocol: UDP
    # MASQUE Proxy
    - name: masque-proxy
      port: 8443
      targetPort: 8443
      nodePort: 30443
      protocol: TCP
    # Enhanced QUIC
    - name: enhanced-quic
      port: 9092
      targetPort: 9092
      nodePort: 30092
      protocol: UDP
---
