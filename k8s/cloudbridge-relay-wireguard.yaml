apiVersion: v1
kind: Namespace
metadata:
  name: cloudbridge-relay
  labels:
    name: cloudbridge-relay
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbridge-relay
  namespace: cloudbridge-relay
  labels:
    app: cloudbridge-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudbridge-relay
  template:
    metadata:
      labels:
        app: cloudbridge-relay
    spec:
      # Критически важные настройки для WireGuard
      securityContext:
        capabilities:
          add: ["NET_ADMIN"]  # Для создания сетевых интерфейсов
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      
      # TUN устройство для WireGuard
      hostNetwork: false  # Используем bridge network для изоляции
      containers:
      - name: cloudbridge-relay
        image: twogc/cloudbridge-relay:latest
        imagePullPolicy: Always
        
        # Переменные окружения
        env:
        - name: CONFIG_PATH
          value: "/app/configs/config.json"
        - name: LOG_LEVEL
          value: "info"
        - name: WIREGUARD_ENABLED
          value: "true"
        - name: TZ
          value: "UTC"
        
        # Порты
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        - name: api
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 8081
          protocol: TCP
        - name: api2
          containerPort: 8082
          protocol: TCP
        - name: quic
          containerPort: 9090
          protocol: UDP
        - name: wireguard
          containerPort: 51820
          protocol: UDP
        
        # Health check
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Ресурсы
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        
        # Тома
        volumeMounts:
        - name: config
          mountPath: /app/configs
          readOnly: true
        - name: logs
          mountPath: /app/logs
        - name: wireguard-config
          mountPath: /etc/wireguard
          readOnly: true
        
        # Безопасность
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop: ["ALL"]
            add: ["NET_ADMIN"]
      
      # Тома
      volumes:
      - name: config
        configMap:
          name: cloudbridge-config
      - name: logs
        emptyDir: {}
      - name: wireguard-config
        secret:
          secretName: wireguard-config
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: cloudbridge-relay
  namespace: cloudbridge-relay
  labels:
    app: cloudbridge-relay
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: api
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 8081
    targetPort: 8081
    protocol: TCP
  - name: api2
    port: 8082
    targetPort: 8082
    protocol: TCP
  - name: quic
    port: 9090
    targetPort: 9090
    protocol: UDP
  - name: wireguard
    port: 51820
    targetPort: 51820
    protocol: UDP
  selector:
    app: cloudbridge-relay
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudbridge-config
  namespace: cloudbridge-relay
data:
  config.json: |
    {
      "server": {
        "address": "0.0.0.0",
        "port": 9090,
        "timeout": "30s",
        "max_tunnels": 1000,
        "ping_interval": "30s",
        "cleanup_interval": "1m"
      },
      "wireguard": {
        "enabled": true,
        "port": 51820,
        "interface": {
          "name": "wg-mesh0",
          "listen_port": 51820,
          "address": "10.100.1.1/24"
        }
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: wireguard-config
  namespace: cloudbridge-relay
type: Opaque
data:
  # Базовые настройки WireGuard (опционально)
  # wg0.conf: <base64-encoded-config>
