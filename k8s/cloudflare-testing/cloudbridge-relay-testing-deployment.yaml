apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbridge-relay-testing
  namespace: cloudbridge-testing
  labels:
    app: cloudbridge-relay-testing
    purpose: cloudflare-integration-testing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudbridge-relay-testing
  template:
    metadata:
      labels:
        app: cloudbridge-relay-testing
        purpose: cloudflare-integration-testing
    spec:
      containers:
      - name: cloudbridge-relay
        image: cloudbridge-relay:cloudflare-testing-20251002-001431
        imagePullPolicy: Never
        ports:
        - containerPort: 6001
          name: main-server
          protocol: TCP
        - containerPort: 6002
          name: metrics
          protocol: TCP
        - containerPort: 6003
          name: p2p-api
          protocol: TCP
        - containerPort: 6004
          name: http-api
          protocol: TCP
        - containerPort: 6005
          name: https-api
          protocol: TCP
        - containerPort: 6006
          name: cf-metrics
          protocol: TCP
        - containerPort: 6007
          name: cf-health
          protocol: TCP
        - containerPort: 6091
          name: quic-transport
          protocol: UDP
        - containerPort: 19303
          name: stun-server
          protocol: UDP
        env:
        - name: SERVER_HOST
          value: "0.0.0.0"
        - name: SERVER_PORT
          value: "6001"
        - name: LOG_LEVEL
          value: "debug"
        - name: TESTING_MODE
          value: "true"
        - name: CLOUDFLARE_TESTING
          value: "true"
        - name: P2P_ENABLED
          value: "true"
        - name: ICE_ENABLED
          value: "true"
        - name: MASQUE_ENABLED
          value: "true"
        - name: ZITADEL_ENABLED
          value: "false"
        - name: AUTH_ENABLED
          value: "false"
        - name: RELAY_JWT_SECRET
          value: "85Sk/NfLq3gqzCXzmBKbJCpL+f5BssXz3G8dVi3sPiE="
        - name: JWT_SECRET
          value: "85Sk/NfLq3gqzCXzmBKbJCpL+f5BssXz3G8dVi3sPiE="
        - name: CONFIG_PATH
          value: "/app/configs/config.json"
        - name: CLOUDFLARE_TUNNEL_ID
          value: "${CLOUDFLARE_TUNNEL_ID}"
        - name: CLOUDFLARE_ACCOUNT_TAG
          value: "${CLOUDFLARE_ACCOUNT_TAG}"
        - name: CLOUDFLARE_TUNNEL_SECRET
          value: "${CLOUDFLARE_TUNNEL_SECRET}"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 6003
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 6003
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config-volume
          mountPath: /app/configs
          readOnly: true
        - name: cloudflared-config
          mountPath: /etc/cloudflared
          readOnly: true
        - name: logs-volume
          mountPath: /var/log
      volumes:
      - name: config-volume
        configMap:
          name: cloudbridge-testing-config
      - name: cloudflared-config
        configMap:
          name: cloudflared-test-config
      - name: logs-volume
        emptyDir: {}
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
