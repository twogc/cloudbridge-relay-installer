apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudbridge-testing-config
  namespace: cloudbridge-testing
  labels:
    app: cloudbridge-relay-testing
    purpose: cloudflare-integration-testing
data:
  config-cloudflare-testing.json: |
    {
      "server": {
        "address": "0.0.0.0",
        "port": 6001,
        "timeout": "30s",
        "max_tunnels": 100,
        "ping_interval": "30s",
        "cleanup_interval": "60s"
      },
      "django": {
        "api_endpoint": "",
        "jwt_secret": "85Sk/NfLq3gqzCXzmBKbJCpL+f5BssXz3G8dVi3sPiE=",
        "jwt_expiry": "24h",
        "rest_timeout": "5s",
        "rest_cache_ttl": "5m",
        "rest_max_retries": 3,
        "rest_retry_delay": "100ms"
      },
      "keycloak": {
        "enabled": false
      },
      "zitadel": {
        "enabled": false
      },
      "security": {
        "tls_enabled": false,
        "allowed_ips": [],
        "rate_limit": {
          "enabled": true,
          "requests_per_second": 50.0,
          "burst": 500
        },
        "mtls": {
          "enabled": false
        },
        "audit": {
          "enabled": true,
          "log_file": "/var/log/relay_testing_audit.log"
        }
      },
      "metrics": {
        "enabled": true,
        "port": 6002,
        "path": "/metrics"
      },
      "api": {
        "enabled": true,
        "port": 6003,
        "version": "v1"
      },
      "http_api": {
        "enabled": true,
        "port": 6004,
        "host": "0.0.0.0",
        "cors_enabled": true,
        "rate_limit": {
          "enabled": true,
          "requests_per_minute": 50
        }
      },
      "https_api": {
        "enabled": true,
        "port": 6005,
        "host": "0.0.0.0",
        "tls": {
          "enabled": false
        },
        "cors_enabled": true,
        "rate_limit": {
          "enabled": true,
          "requests_per_minute": 50
        }
      },
      "logging": {
        "level": "debug",
        "format": "json",
        "output": "stdout",
        "file": "/var/log/relay_testing.log",
        "max_size": "50m",
        "max_age": "24h",
        "max_backups": 3
      },
      "protocol": {
        "auto_select": true,
        "preferred": "quic",
        "fallback": "http",
        "switch_threshold": 0.2,
        "health_check_interval": "30s"
      },
      "quic": {
        "enabled": true,
        "max_streams": 50,
        "keep_alive": true,
        "idle_timeout": "30s",
        "handshake_timeout": "10s",
        "connection_migration": true,
        "multiplexing": true
      },
      "zero_trust": {
        "enabled": true,
        "client_daemon": false,
        "service_discovery": false,
        "auto_reconnect": true,
        "circuit_breaker": {
          "enabled": true,
          "failure_threshold": 3,
          "success_threshold": 2,
          "timeout": "30s",
          "window_size": "60s"
        },
        "health_check": {
          "enabled": true,
          "interval": "30s",
          "timeout": "10s",
          "checks": []
        },
        "rate_limit": {
          "enabled": true,
          "requests_per": 50,
          "window_size": 60
        },
        "authentication": {
          "enabled": false,
          "type": "jwt",
          "jwt_secret": "",
          "keycloak_url": ""
        }
      },
      "enhanced_quic": {
        "enabled": true,
        "max_streams": 50,
        "keep_alive": true,
        "idle_timeout": "30s",
        "handshake_timeout": "10s",
        "ddos_protection": false,
        "geographic_routing": false,
        "keycloak_integration": false
      },
      "ice_stun_turn": {
        "enabled": true,
        "stun_servers": [
          "stun.l.google.com:19302",
          "stun1.l.google.com:19302"
        ],
        "turn_servers": [],
        "ice_timeout": "30s",
        "connection_timeout": "10s",
        "gathering_timeout": "5s",
        "candidate_types": [
          "host",
          "srflx",
          "relay"
        ]
      },
      "masque": {
        "enabled": true,
        "proxy_url": "https://auth.2gc.ru:8443",
        "alpn_protocols": [
          "h3",
          "h3-29",
          "h3-28",
          "h3-27"
        ],
        "fallback_enabled": true
      },
      "wireguard": {
        "enabled": false
      },
      "quantum": {
        "enabled": false
      },
      "ai": {
        "enabled": false
      },
      "cadence": {
        "enabled": false
      },
      "cloudflare": {
        "enabled": true,
        "testing_mode": true,
        "tunnel_id": "${CLOUDFLARE_TUNNEL_ID}",
        "credentials_file": "/etc/cloudflared/credentials.json",
        "config_file": "/etc/cloudflared/config.yml",
        "log_level": "debug",
        "metrics_port": 5556,
        "health_check_port": 5557
      }
    }
