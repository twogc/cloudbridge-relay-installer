apiVersion: v1
kind: Service
metadata:
  name: cloudbridge-relay-testing
  namespace: cloudbridge-testing
  labels:
    app: cloudbridge-relay-testing
    purpose: cloudflare-integration-testing
spec:
  type: ClusterIP
  ports:
  - port: 6001
    targetPort: 6001
    name: main-server
    protocol: TCP
  - port: 6002
    targetPort: 6002
    name: metrics
    protocol: TCP
  - port: 6003
    targetPort: 6003
    name: p2p-api
    protocol: TCP
  - port: 6004
    targetPort: 6004
    name: http-api
    protocol: TCP
  - port: 6005
    targetPort: 6005
    name: https-api
    protocol: TCP
  - port: 6091
    targetPort: 6091
    name: quic-transport
    protocol: UDP
  - port: 19303
    targetPort: 19303
    name: stun-server
    protocol: UDP
  selector:
    app: cloudbridge-relay-testing
---
apiVersion: v1
kind: Service
metadata:
  name: cloudflared-testing
  namespace: cloudbridge-testing
  labels:
    app: cloudflared-testing
    purpose: cloudflare-integration-testing
spec:
  type: ClusterIP
  ports:
  - port: 6006
    targetPort: 6006
    name: metrics
    protocol: TCP
  - port: 6007
    targetPort: 6007
    name: health
    protocol: TCP
  selector:
    app: cloudflared-testing
---
apiVersion: v1
kind: Service
metadata:
  name: cloudbridge-testing-nodeport
  namespace: cloudbridge-testing
  labels:
    app: cloudbridge-relay-testing
    purpose: cloudflare-integration-testing
spec:
  type: NodePort
  ports:
  - port: 6001
    targetPort: 6001
    nodePort: 30601
    name: main-server
    protocol: TCP
  - port: 6002
    targetPort: 6002
    nodePort: 30602
    name: metrics
    protocol: TCP
  - port: 6003
    targetPort: 6003
    nodePort: 30603
    name: p2p-api
    protocol: TCP
  - port: 6004
    targetPort: 6004
    nodePort: 30604
    name: http-api
    protocol: TCP
  - port: 6005
    targetPort: 6005
    nodePort: 30605
    name: https-api
    protocol: TCP
  - port: 6091
    targetPort: 6091
    nodePort: 30691
    name: quic-transport
    protocol: UDP
  selector:
    app: cloudbridge-relay-testing
