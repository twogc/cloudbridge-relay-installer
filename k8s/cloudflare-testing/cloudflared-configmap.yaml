apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-test-config
  namespace: cloudbridge-testing
  labels:
    app: cloudflared-testing
    purpose: cloudflare-integration-testing
data:
  config.yml: |
    tunnel: ${CLOUDFLARE_TUNNEL_ID}
    credentials-file: /etc/cloudflared/credentials/credentials.json
    
    # Metrics and health check
    metrics: 0.0.0.0:6006
    no-autoupdate: true
    loglevel: debug
    
    # Ingress rules for testing
    ingress:
      # Health check endpoint
      - hostname: health-test.cloudbridge-testing.example.com
        service: http://cloudbridge-relay-testing:6003/health
      
      # Main API endpoint
      - hostname: api-test.cloudbridge-testing.example.com
        service: http://cloudbridge-relay-testing:6004
      
      # Metrics endpoint
      - hostname: metrics-test.cloudbridge-testing.example.com
        service: http://cloudbridge-relay-testing:6002/metrics
      
      # QUIC transport endpoint
      - hostname: quic-test.cloudbridge-testing.example.com
        service: http://cloudbridge-relay-testing:6091
      
      # Catch-all rule
      - service: http_status:404
    
    # Origin certificate (if using)
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s
      tlsTimeout: 10s
      tcpKeepAlive: 30s
      keepAliveConnections: 10
      keepAliveTimeout: 90s
      httpHostHeader: ""
      originServerName: ""
      caPool: ""
      noTLSVerify: false
      disableChunkedEncoding: false
      bastionMode: false
      proxyAddress: ""
      proxyPort: 0
      proxyType: ""
      http2Origin: true
    
    # Retry configuration
    retries: 5
    grace-period: 30s
    
    # Connection settings
    protocol: auto
    heartbeatCount: 5
    heartbeatInterval: 5s
    
    # Logging
    logfile: /var/log/cloudflared.log
    logfile-max-size: 10
    logfile-max-backups: 3
    logfile-max-age: 7
