apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-testing
  namespace: cloudbridge-testing
  labels:
    app: cloudflared-testing
    purpose: cloudflare-integration-testing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-testing
  template:
    metadata:
      labels:
        app: cloudflared-testing
        purpose: cloudflare-integration-testing
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        command: ["cloudflared"]
        args: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
        ports:
        - containerPort: 6006
          name: metrics
          protocol: TCP
        - containerPort: 6007
          name: health
          protocol: TCP
        env:
        - name: TUNNEL_TOKEN
          value: "${CLOUDFLARE_TUNNEL_TOKEN}"
        - name: TUNNEL_ORIGIN_CERT
          value: "${CLOUDFLARE_ORIGIN_CERT}"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /ready
            port: 6007
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 6007
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: cloudflared-config
          mountPath: /etc/cloudflared
          readOnly: true
        - name: cloudflared-credentials
          mountPath: /etc/cloudflared/credentials
          readOnly: true
      volumes:
      - name: cloudflared-config
        configMap:
          name: cloudflared-test-config
      - name: cloudflared-credentials
        secret:
          secretName: cloudflared-credentials
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
