apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipsec-magic-wan
  namespace: cloudbridge-testing
  labels:
    app: ipsec-magic-wan
    purpose: magic-wan-l3-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ipsec-magic-wan
  template:
    metadata:
      labels:
        app: ipsec-magic-wan
        purpose: magic-wan-l3-tunnel
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: ipsec-magic-wan
        image: ubuntu:22.04
        command: ["/bin/bash"]
        args: ["-c", "while true; do sleep 3600; done"]
        securityContext:
          privileged: true
          capabilities:
            add:
            - NET_ADMIN
            - SYS_MODULE
        env:
        - name: LOCAL_PUBLIC_IP
          value: "10.0.0.249"  # Заменить на реальный публичный IP
        - name: LOCAL_INTERNAL_NETWORKS
          value: "10.0.0.0/24,10.100.77.0/24,172.17.0.0/16"  # Внутренние сети
        - name: CF_PEER_IP
          value: "162.159.75.92"  # Magic WAN Primary
        - name: CF_PEER_IP_SECONDARY
          value: "172.64.251.46"  # Magic WAN Secondary
        - name: CF_PSK
          value: "CHANGE_ME"  # Получить от Cloudflare
        volumeMounts:
        - name: ipsec-config
          mountPath: /etc/ipsec
        - name: strongswan-config
          mountPath: /etc/strongswan
        - name: setup-scripts
          mountPath: /scripts
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "ipsec statusall | grep -q 'ESTABLISHED' || exit 1"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - "ipsec statusall | grep -q 'ESTABLISHED' || exit 1"
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: ipsec-config
        configMap:
          name: ipsec-magic-wan-config
          items:
          - key: ipsec.conf
            path: ipsec.conf.template
          - key: ipsec.secrets
            path: ipsec.secrets.template
      - name: strongswan-config
        configMap:
          name: ipsec-magic-wan-config
          items:
          - key: strongswan.conf
            path: strongswan.conf
      - name: setup-scripts
        configMap:
          name: ipsec-magic-wan-config
          items:
          - key: setup-ipsec.sh
            path: setup-ipsec.sh
            mode: 0755
          - key: test-ipsec.sh
            path: test-ipsec.sh
            mode: 0755
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
