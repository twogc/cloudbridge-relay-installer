apiVersion: v1
kind: Service
metadata:
  name: ipsec-magic-wan
  namespace: cloudbridge-testing
  labels:
    app: ipsec-magic-wan
    purpose: magic-wan-l3-tunnel
spec:
  type: ClusterIP
  ports:
  - name: ike
    port: 500
    targetPort: 500
    protocol: UDP
  - name: nat-t
    port: 4500
    targetPort: 4500
    protocol: UDP
  selector:
    app: ipsec-magic-wan
---
apiVersion: v1
kind: Service
metadata:
  name: ipsec-magic-wan-nodeport
  namespace: cloudbridge-testing
  labels:
    app: ipsec-magic-wan
    purpose: magic-wan-l3-tunnel
spec:
  type: NodePort
  ports:
  - name: ike
    port: 500
    targetPort: 500
    nodePort: 30500
    protocol: UDP
  - name: nat-t
    port: 4500
    targetPort: 4500
    nodePort: 30501
    protocol: UDP
  selector:
    app: ipsec-magic-wan
