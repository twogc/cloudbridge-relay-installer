apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudbridge-relay-config
  namespace: cloudbridge-relay
data:
  # Server configuration
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  SERVER_TLS_PORT: "8443"
  
  # Database configuration
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "cloudbridge_relay"
  DB_USER: "postgres"
  DB_SSL_MODE: "disable"
  
  # Redis configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  
  # STUN/TURN servers
  STUN_SERVERS: "stun.l.google.com:19302,stun1.l.google.com:19302"
  TURN_SERVERS: ""
  
  # MASQUE configuration
  MASQUE_ENABLED: "true"
  MASQUE_PORT: "8443"
  
  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  
  # P2P configuration
  P2P_ENABLED: "true"
  P2P_MAX_CONNECTIONS: "1000"
  
  # ICE configuration
  ICE_ENABLED: "true"
  ICE_TIMEOUT: "30s"
  
  # JWT configuration
  RELAY_JWT_SECRET: "test-jwt-secret-key-for-development-only"
