apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudbridge-config
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
data:
  config.json: |
    {
      "server": {
        "address": "0.0.0.0",
        "port": 9090,
        "timeout": "30s",
        "max_tunnels": 1000,
        "ping_interval": "30s",
        "cleanup_interval": "1m"
      },
      "django": {
        "api_endpoint": "http://localhost:8000/api",
        "jwt_secret": "your-secret-key",
        "jwt_expiry": "24h",
        "rest_timeout": "5s",
        "rest_cache_ttl": "5m",
        "rest_max_retries": 3,
        "rest_retry_delay": "100ms"
      },
      "tenants": {
        "relay-test-tenant": {
          "enabled": true,
          "name": "Relay Test Tenant",
          "description": "Test tenant for DevOps development",
          "limits": {
            "max_tunnels": 10,
            "max_connections": 20,
            "max_bandwidth_mbps": 100,
            "rate_limit_per_second": 500,
            "burst": 100
          },
          "jwt": {
            "issuer": "2gc.ru",
            "audience": "relay-test-tenant",
            "allowed_claims": ["tenant_id", "user_id", "permissions"]
          },
          "allowed_ips": [],
          "allowed_ports": [],
          "features": ["tls", "jwt", "tunneling", "p2p", "quic"]
        }
      },
      "keycloak": {
        "enabled": false,
        "server_url": "",
        "realm": "",
        "client_id": "",
        "client_secret": "",
        "public_key": "",
        "token_validation": {
          "issuer": "",
          "audience": "",
          "clock_skew": "30s"
        },
        "jwks_cache_ttl": "1h",
        "http_timeout": "30s"
      },
      "security": {
        "tls_enabled": true,
        "cert_file": "/app/certs/server.crt",
        "key_file": "/app/certs/server.key",
        "allowed_ips": [],
        "rate_limit": {
          "enabled": true,
          "requests_per_second": 1000,
          "burst": 100
        },
        "mtls": {
          "enabled": true,
          "ca_file": "/app/certs/ca.crt",
          "client_cert_required": true
        },
        "cipher_suites": ["TLS_AES_256_GCM_SHA384", "TLS_CHACHA20_POLY1305_SHA256"],
        "min_tls_version": "1.2",
        "audit": {
          "enabled": true,
          "log_file": "/app/logs/security.log"
        }
      },
      "metrics": {
        "enabled": true,
        "port": 8084,
        "path": "/metrics"
      },
      "api": {
        "enabled": true,
        "port": 9091,
        "version": "v1"
      },
      "logging": {
        "level": "info",
        "format": "json",
        "output": "stdout",
        "file": "",
        "max_size": "100MB",
        "max_age": "7d",
        "max_backups": 5
      },
      "protocol": {
        "auto_select": true,
        "preferred": "quic",
        "fallback": "http2",
        "switch_threshold": 0.8,
        "health_check_interval": "30s"
      },
      "quic": {
        "enabled": true,
        "port": 9090,
        "max_streams": 100,
        "keep_alive": true,
        "idle_timeout": "30s",
        "handshake_timeout": "10s"
      },
      "zero_trust": {
        "enabled": false,
        "client_daemon": false,
        "service_discovery": false,
        "auto_reconnect": false,
        "circuit_breaker": {
          "enabled": false,
          "failure_threshold": 5,
          "success_threshold": 2,
          "timeout": "30s",
          "window_size": "60s"
        },
        "health_check": {
          "enabled": true,
          "interval": "30s",
          "timeout": "5s",
          "checks": [
            {
              "type": "http",
              "url": "http://localhost:9090/health",
              "timeout": "5s"
            },
            {
              "type": "tcp",
              "host": "localhost",
              "port": 51820,
              "timeout": "5s"
            },
            {
              "type": "tcp",
              "host": "localhost",
              "port": 9090,
              "timeout": "5s"
            }
          ]
        },
        "rate_limit": {
          "enabled": false,
          "requests_per": 1000,
          "window_size": 60
        },
        "authentication": {
          "enabled": false,
          "type": "jwt",
          "jwt_secret": "",
          "keycloak_url": ""
        }
      },
      "enhanced_quic": {
        "enabled": true,
        "port": 9092,
        "max_streams": 100,
        "keep_alive": true,
        "idle_timeout": "30s",
        "handshake_timeout": "10s",
        "ddos_protection": true,
        "geographic_routing": false,
        "keycloak_integration": false
      },
      "wireguard": {
        "enabled": true,
        "port": 51820,
        "interface": {
          "name": "wg-mesh0",
          "listen_port": 51820,
          "address": "10.100.1.1/24"
        },
        "discovery": {
          "registry_url": "https://edge.2gc.ru/wg/peers",
          "heartbeat_interval": "25s",
          "max_peers": 50
        },
        "mesh": {
          "enabled": true,
          "auto_discovery": true,
          "max_connections": 100,
          "routing_strategy": "hybrid"
        },
        "site_to_site": {
          "enabled": false,
          "corporate_networks": []
        }
      },
      "quantum": {
        "enabled": false,
        "algorithm": "kyber",
        "hybrid_mode": true,
        "key_size": 256,
        "signature_scheme": "dilithium",
        "fallback_enabled": true,
        "key_rotation_days": 30,
        "wireguard": {
          "enabled": false
        },
        "enhanced_quic": {
          "enabled": false
        }
      },
      "ai": {
        "enabled": false,
        "behavior_analysis": {
          "enabled": false,
          "model_path": "",
          "threshold": 0.8,
          "learning_rate": 0.01
        },
        "predictive_security": {
          "enabled": false,
          "confidence": 0.9
        },
        "automated_response": {
          "enabled": false
        },
        "monitoring": {
          "enabled": false,
          "dashboard_url": "",
          "refresh_rate": "30s"
        }
      },
      "cadence": {
        "enabled": true,
        "host_port": "cadence-service:7933",
        "domain": "cloudbridge",
        "task_list": "relay-task-list"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cassandra-config
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/version: "3.11"
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
data:
  cassandra.yaml: |
    cluster_name: 'cloudbridge-cluster'
    num_tokens: 256
    hinted_handoff_enabled: true
    max_hint_window_in_ms: 10800000
    hinted_handoff_throttle_in_kb: 1024
    max_hints_delivery_threads: 2
    batchlog_replay_throttle_in_kb: 1024
    authenticator: AllowAllAuthenticator
    authorizer: AllowAllAuthorizer
    role_manager: CassandraRoleManager
    roles_validity_in_ms: 2000
    permissions_validity_in_ms: 2000
    credentials_validity_in_ms: 2000
    partitioner: org.apache.cassandra.dht.Murmur3Partitioner
    data_file_directories:
      - /var/lib/cassandra/data
    commitlog_directory: /var/lib/cassandra/commitlog
    disk_failure_policy: stop
    commit_failure_policy: stop
    key_cache_size_in_mb: 100
    key_cache_save_period: 14400
    row_cache_size_in_mb: 0
    row_cache_save_period: 0
    counter_cache_size_in_mb: 50
    counter_cache_save_period: 7200
    saved_caches_directory: /var/lib/cassandra/saved_caches
    commitlog_sync: periodic
    commitlog_sync_period_in_ms: 10000
    commitlog_segment_size_in_mb: 32
    seed_provider:
      - class_name: org.apache.cassandra.locator.SimpleSeedProvider
        parameters:
          - seeds: "cassandra-service"
    concurrent_reads: 32
    concurrent_writes: 32
    concurrent_counter_writes: 32
    concurrent_materialized_view_writes: 32
    memtable_allocation_type: heap_buffers
    index_summary_capacity_in_mb: 0
    index_summary_resize_interval_in_minutes: 60
    trickle_fsync: false
    trickle_fsync_interval_in_kb: 10240
    storage_port: 7000
    ssl_storage_port: 7001
    listen_address: 0.0.0.0
    start_native_transport: true
    native_transport_port: 9042
    start_rpc: true
    rpc_address: 0.0.0.0
    rpc_port: 9160
    rpc_keepalive: true
    rpc_server_type: sync
    thrift_framed_transport_size_in_mb: 15
    incremental_backups: false
    snapshot_before_compaction: false
    auto_snapshot: true
    tombstone_warn_threshold: 1000
    tombstone_failure_threshold: 100000
    column_index_size_in_kb: 64
    batch_size_warn_threshold_in_kb: 5
    batch_size_fail_threshold_in_kb: 50
    compaction_throughput_mb_per_sec: 16
    compaction_large_partition_warning_threshold_mb: 100
    sstable_preemptive_open_interval_in_mb: 50
    read_request_timeout_in_ms: 5000
    range_request_timeout_in_ms: 10000
    write_request_timeout_in_ms: 2000
    counter_write_request_timeout_in_ms: 5000
    cas_contention_timeout_in_ms: 1000
    truncate_request_timeout_in_ms: 60000
    request_timeout_in_ms: 10000
    cross_node_timeout: false
    endpoint_snitch: SimpleSnitch
    dynamic_snitch_update_interval_in_ms: 100
    dynamic_snitch_reset_interval_in_ms: 600000
    dynamic_snitch_badness_threshold: 0.1
    request_scheduler: org.apache.cassandra.scheduler.NoScheduler
    server_encryption_options:
      internode_encryption: none
      keystore: conf/.keystore
      keystore_password: cassandra
      truststore: conf/.truststore
      truststore_password: cassandra
      protocol: TLS
      algorithm: SunX509
      store_type: JKS
      cipher_suites: [TLS_RSA_WITH_AES_128_CBC_SHA,TLS_RSA_WITH_AES_256_CBC_SHA,TLS_DHE_RSA_WITH_AES_128_CBC_SHA,TLS_DHE_RSA_WITH_AES_256_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA]
      require_client_auth: false
    client_encryption_options:
      enabled: false
      keystore: conf/.keystore
      keystore_password: cassandra
      require_client_auth: false
      protocol: TLS
      algorithm: SunX509
      store_type: JKS
      cipher_suites: [TLS_RSA_WITH_AES_128_CBC_SHA,TLS_RSA_WITH_AES_256_CBC_SHA,TLS_DHE_RSA_WITH_AES_128_CBC_SHA,TLS_DHE_RSA_WITH_AES_256_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA]
    internode_compression: all
    inter_dc_tcp_nodelay: false
    tracetype_query_ttl: 86400
    tracetype_repair_ttl: 604800
    enable_user_defined_functions: false
    enable_scripted_user_defined_functions: false
    windows_timer_interval: 1
    internode_authenticator: org.apache.cassandra.auth.AllowAllInternodeAuthenticator
  init.cql: |
    CREATE KEYSPACE IF NOT EXISTS cloudbridge
      WITH REPLICATION = {
        'class': 'SimpleStrategy',
        'replication_factor': 1
      };
    
    CREATE KEYSPACE IF NOT EXISTS cadence
      WITH REPLICATION = {
        'class': 'SimpleStrategy',
        'replication_factor': 1
      };
    
    CREATE KEYSPACE IF NOT EXISTS cadence_visibility
      WITH REPLICATION = {
        'class': 'SimpleStrategy',
        'replication_factor': 1
      };
    
    USE cloudbridge;
    
    CREATE TABLE IF NOT EXISTS relay_sessions (
      id UUID PRIMARY KEY,
      client_id TEXT,
      created_at TIMESTAMP,
      updated_at TIMESTAMP,
      status TEXT,
      metadata MAP<TEXT, TEXT>
    );
    
    CREATE TABLE IF NOT EXISTS workflow_executions (
      id UUID PRIMARY KEY,
      workflow_id TEXT,
      run_id TEXT,
      status TEXT,
      created_at TIMESTAMP,
      updated_at TIMESTAMP,
      result TEXT
    );

