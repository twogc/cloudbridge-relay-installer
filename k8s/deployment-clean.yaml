apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbridge-relay
  namespace: cloudbridge
  labels:
    app: cloudbridge-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudbridge-relay
  template:
    metadata:
      labels:
        app: cloudbridge-relay
    spec:
      containers:
      - name: cloudbridge-relay
        image: cloudbridge-relay:clean-test
        imagePullPolicy: Never
        ports:
        - containerPort: 5550
          name: main-server
          protocol: TCP
        - containerPort: 5551
          name: metrics
          protocol: TCP
        - containerPort: 5552
          name: p2p-api
          protocol: TCP
        - containerPort: 5553
          name: http-api
          protocol: TCP
        env:
        - name: SERVER_HOST
          value: "0.0.0.0"
        - name: SERVER_PORT
          value: "9091"
        - name: LOG_LEVEL
          value: "info"
        - name: P2P_ENABLED
          value: "true"
        - name: ICE_ENABLED
          value: "true"
        - name: MASQUE_ENABLED
          value: "false"
        - name: ZITADEL_ENABLED
          value: "false"
        - name: AUTH_ENABLED
          value: "false"
        - name: RELAY_JWT_SECRET
          value: "85Sk/NfLq3gqzCXzmBKbJCpL+f5BssXz3G8dVi3sPiE="
        - name: JWT_SECRET
          value: "85Sk/NfLq3gqzCXzmBKbJCpL+f5BssXz3G8dVi3sPiE="
        - name: CONFIG_PATH
          value: "/app/configs/config.json"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5552
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5552
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /app/configs
          readOnly: true
        - name: data-volume
          mountPath: /app/data
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: cloudbridge-relay-config-safe-ports
      - name: data-volume
        emptyDir: {}
      - name: tmp-volume
        emptyDir: {}
      restartPolicy: Always

