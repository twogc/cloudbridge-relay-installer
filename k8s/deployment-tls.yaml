apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbridge-relay-tls
  namespace: cloudbridge
  labels:
    app: cloudbridge-relay-tls
    version: tls-enabled
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloudbridge-relay-tls
  template:
    metadata:
      labels:
        app: cloudbridge-relay-tls
        version: tls-enabled
    spec:
      containers:
      - name: cloudbridge-relay
        image: cloudbridge-relay:security-20250928-121004
        imagePullPolicy: Never
        ports:
        - containerPort: 9091
          name: http-api
          protocol: TCP
        - containerPort: 8082
          name: p2p-api
          protocol: TCP
        - containerPort: 8443
          name: https-api
          protocol: TCP
        - containerPort: 5553
          name: grpc-api
          protocol: TCP
        - containerPort: 19302
          name: stun-server
          protocol: UDP
        - containerPort: 9090
          name: quic-transport
          protocol: UDP
        - containerPort: 9092
          name: enhanced-quic
          protocol: UDP
        env:
        - name: CLOUDBRIDGE_ENV
          value: "production"
        - name: TLS_CERT_FILE
          value: "/etc/ssl/certs/tls.crt"
        - name: TLS_KEY_FILE
          value: "/etc/ssl/private/tls.key"
        - name: HTTPS_PORT
          value: "8443"
        - name: HTTP_PORT
          value: "9091"
        - name: FORCE_HTTPS
          value: "true"
        - name: ALLOWED_ORIGINS
          value: "https://edge.2gc.ru,https://api.edge.2gc.ru,https://www.edge.2gc.ru"
        - name: RELAY_JWT_SECRET
          value: "cloudbridge-super-secret-jwt-key-for-edge-2gc-ru-production-2025"
        volumeMounts:
        - name: tls-certs
          mountPath: /etc/ssl/certs
          readOnly: true
        - name: tls-private
          mountPath: /etc/ssl/private
          readOnly: true
        - name: tls-config
          mountPath: /etc/cloudbridge/tls
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 9091
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 9091
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
      volumes:
      - name: tls-certs
        secret:
          secretName: edge-2gc-ru-tls
          items:
          - key: tls.crt
            path: tls.crt
            mode: 0644
      - name: tls-private
        secret:
          secretName: edge-2gc-ru-tls
          items:
          - key: tls.key
            path: tls.key
            mode: 0600
      - name: tls-config
        configMap:
          name: cloudbridge-tls-config
      securityContext:
        fsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      serviceAccountName: default
---
apiVersion: v1
kind: Service
metadata:
  name: cloudbridge-relay-tls
  namespace: cloudbridge
  labels:
    app: cloudbridge-relay-tls
spec:
  type: NodePort
  ports:
  - name: http-api
    port: 9091
    targetPort: 9091
    nodePort: 30091
    protocol: TCP
  - name: https-api
    port: 8443
    targetPort: 8443
    nodePort: 31443
    protocol: TCP
  - name: p2p-api
    port: 8082
    targetPort: 8082
    nodePort: 31082
    protocol: TCP
  - name: grpc-api
    port: 5553
    targetPort: 5553
    nodePort: 31553
    protocol: TCP
  - name: stun-server
    port: 19302
    targetPort: 19302
    nodePort: 31302
    protocol: UDP
  - name: quic-transport
    port: 9090
    targetPort: 9090
    nodePort: 31090
    protocol: UDP
  - name: enhanced-quic
    port: 9092
    targetPort: 9092
    nodePort: 31092
    protocol: UDP
  selector:
    app: cloudbridge-relay-tls
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudbridge-tls-config
  namespace: cloudbridge
data:
  tls-config.yaml: |
    tls:
      cert_file: "/etc/ssl/certs/tls.crt"
      key_file: "/etc/ssl/private/tls.key"
      min_version: 1.2
      max_version: 1.3
      auto_redirect: true
      http_port: 9091
      https_port: 8443
    security:
      environment: "production"
      https:
        force_https: true
        hsts_max_age: 31536000
        hsts_include_subdomain: true
        hsts_preload: true
      cors:
        allowed_origins:
          - "https://edge.2gc.ru"
          - "https://api.edge.2gc.ru"
          - "https://www.edge.2gc.ru"
          - "https://dashboard.edge.2gc.ru"
        allowed_methods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
          - "HEAD"
        allowed_headers:
          - "Origin"
          - "Content-Type"
          - "Accept"
          - "Authorization"
          - "X-Requested-With"
          - "X-CSRF-Token"
        allow_credentials: true
        max_age: 86400
      headers:
        content_type_options: "nosniff"
        frame_options: "DENY"
        xss_protection: "1; mode=block"
        content_security_policy: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://edge.2gc.ru; frame-ancestors 'none'"
        referrer_policy: "strict-origin-when-cross-origin"
        remove_server_header: true
        remove_powered_by: true
