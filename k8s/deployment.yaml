apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbridge-relay
  namespace: cloudbridge
  labels:
    app: cloudbridge-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudbridge-relay
  template:
    metadata:
      labels:
        app: cloudbridge-relay
    spec:
      containers:
      - name: cloudbridge-relay
        image: cloudbridge-relay:fix-prometheus-20250927-160658
        imagePullPolicy: Never
        ports:
        - containerPort: 5550
          name: main-server
          protocol: TCP
        - containerPort: 5551
          name: metrics
          protocol: TCP
        - containerPort: 5552
          name: p2p-api
          protocol: TCP
        - containerPort: 5553
          name: http-api
          protocol: TCP
        - containerPort: 8443
          name: https-masque
          protocol: TCP
        - containerPort: 9090
          name: quic-transport
          protocol: UDP
        - containerPort: 9092
          name: enhanced-quic
          protocol: UDP
        - containerPort: 19302
          name: stun-server
          protocol: UDP
        env:
        - name: SERVER_HOST
          value: "0.0.0.0"
        - name: SERVER_PORT
          value: "5550"
        - name: LOG_LEVEL
          value: "info"
        - name: P2P_ENABLED
          value: "true"
        - name: ICE_ENABLED
          value: "true"
        - name: MASQUE_ENABLED
          value: "true"
        - name: RELAY_JWT_SECRET
          value: "85Sk/NfLq3gqzCXzmBKbJCpL+f5BssXz3G8dVi3sPiE="
        - name: TURN_PASSWORD
          value: "cloudbridge-turn-secret"
        - name: TURN_BACKUP_PASSWORD
          value: "cloudbridge-backup-secret"
        - name: CONFIG_PATH
          value: "/app/configs/config.json"
        - name: RELAY_TLS_CERT_FILE
          value: "/app/certs/tls.crt"
        - name: RELAY_TLS_KEY_FILE
          value: "/app/certs/tls.key"
        - name: PROMETHEUS_URL
          value: "http://prometheus.cloudbridge.svc.cluster.local:9090"
        - name: RELAY_URL
          value: "http://cloudbridge-relay:5551"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5550
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5550
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tls-certs
          mountPath: /app/certs
          readOnly: true
        - name: config
          mountPath: /app/configs
          readOnly: true
        - name: tmp-volume
          mountPath: /tmp
        - name: data-volume
          mountPath: /app/data
      volumes:
      - name: tls-certs
        secret:
          secretName: cloudbridge-tls
      - name: config
        configMap:
          name: cloudbridge-relay-config
      - name: tmp-volume
        emptyDir: {}
      - name: data-volume
        emptyDir: {}
