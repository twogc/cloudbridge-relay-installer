apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbridge-relay
  namespace: cloudbridge
  labels:
    app: cloudbridge-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudbridge-relay
  template:
    metadata:
      labels:
        app: cloudbridge-relay
    spec:
      containers:
      - name: cloudbridge-relay
        image: cloudbridge-relay:latest
        imagePullPolicy: Never  # For minikube local images
        ports:
        - containerPort: 8080
          name: http-api
          protocol: TCP
        - containerPort: 8082
          name: p2p-api
          protocol: TCP
        - containerPort: 8443
          name: https-masque
          protocol: TCP
        - containerPort: 9090
          name: quic-transport
          protocol: UDP
        - containerPort: 9092
          name: enhanced-quic
          protocol: UDP
        - containerPort: 19302
          name: stun-server
          protocol: UDP
        env:
        - name: SERVER_HOST
          valueFrom:
            configMapKeyRef:
              name: cloudbridge-relay-config
              key: SERVER_HOST
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: cloudbridge-relay-config
              key: SERVER_PORT
        - name: SERVER_TLS_PORT
          valueFrom:
            configMapKeyRef:
              name: cloudbridge-relay-config
              key: SERVER_TLS_PORT
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: cloudbridge-relay-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: cloudbridge-relay-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: cloudbridge-relay-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: cloudbridge-relay-config
              key: DB_USER
        - name: DB_SSL_MODE
          valueFrom:
            configMapKeyRef:
              name: cloudbridge-relay-config
              key: DB_SSL_MODE
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: cloudbridge-relay-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: cloudbridge-relay-config
              key: REDIS_PORT
        - name: STUN_SERVERS
          valueFrom:
            configMapKeyRef:
              name: cloudbridge-relay-config
              key: STUN_SERVERS
        - name: MASQUE_ENABLED
          valueFrom:
            configMapKeyRef:
              name: cloudbridge-relay-config
              key: MASQUE_ENABLED
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: cloudbridge-relay-config
              key: LOG_LEVEL
        - name: P2P_ENABLED
          valueFrom:
            configMapKeyRef:
              name: cloudbridge-relay-config
              key: P2P_ENABLED
        - name: ICE_ENABLED
          valueFrom:
            configMapKeyRef:
              name: cloudbridge-relay-config
              key: ICE_ENABLED
        - name: RELAY_JWT_SECRET
          valueFrom:
            configMapKeyRef:
              name: cloudbridge-relay-config
              key: RELAY_JWT_SECRET
        - name: CADENCE_ENABLED
          value: "true"
        - name: CADENCE_HOST_PORT
          value: "cadence:7933"
        - name: CADENCE_DOMAIN
          value: "cloudbridge-p2p"
        - name: CADENCE_TASK_LIST
          value: "p2p-quic-tasks"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tls-certs
          mountPath: /app/certs
          readOnly: true
        - name: letsencrypt-certs
          mountPath: /etc/letsencrypt
          readOnly: true
      volumes:
      - name: tls-certs
        secret:
          secretName: cloudbridge-tls
      - name: letsencrypt-certs
        hostPath:
          path: /etc/letsencrypt
          type: Directory
