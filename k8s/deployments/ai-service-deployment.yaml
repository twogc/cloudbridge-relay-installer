apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: ai
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
      app.kubernetes.io/component: ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: ai
        app.kubernetes.io/part-of: cloudbridge-relay
        app.kubernetes.io/managed-by: kubectl
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ai-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: ai-service
        image: cloudbridge-ai:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8083
          protocol: TCP
        - name: metrics
          containerPort: 8084
          protocol: TCP
        env:
        - name: AI_PORT
          value: "8083"
        - name: LOG_LEVEL
          value: "info"
        - name: GIN_MODE
          value: "release"
        - name: TZ
          value: "UTC"
        - name: CADENCE_HOST
          value: "cadence-service"
        - name: CADENCE_PORT
          value: "7933"
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT
          value: "6379"
        - name: PROMETHEUS_HOST
          value: "prometheus-service"
        - name: PROMETHEUS_PORT
          value: "9090"
        - name: KUBERNETES_NAMESPACE
          value: "cloudbridge"
        - name: AI_CONFIG_PATH
          value: "/app/configs/ai-config.yaml"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: ai-config
          mountPath: /app/configs
          readOnly: true
        - name: ai-models
          mountPath: /app/models
        - name: ai-logs
          mountPath: /app/logs
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
      volumes:
      - name: ai-config
        configMap:
          name: ai-config
      - name: ai-models
        persistentVolumeClaim:
          claimName: ai-models-pvc
      - name: ai-logs
        persistentVolumeClaim:
          claimName: ai-logs-pvc
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - ai-service
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-service
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: ai
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-service
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: ai
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-service
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: ai
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-service
subjects:
- kind: ServiceAccount
  name: ai-service
  namespace: cloudbridge
