apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadence
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cadence
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: workflow
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "7934"
    prometheus.io/path: "/metrics"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: workflow
      app.kubernetes.io/name: cadence
  template:
    metadata:
      labels:
        app.kubernetes.io/component: workflow
        app.kubernetes.io/instance: production
        app.kubernetes.io/name: cadence
        app.kubernetes.io/part-of: cloudbridge-relay
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: kubectl
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7934"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cadence
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: cadence
        image: ubercadence/server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: grpc
          containerPort: 7933
          protocol: TCP
        - name: web
          containerPort: 7934
          protocol: TCP
        - name: admin
          containerPort: 7935
          protocol: TCP
        env:
        - name: CASSANDRA_SEEDS
          value: "cassandra-service"
        - name: DB
          value: "cassandra"
        - name: DB_PORT
          value: "9042"
        - name: KEYSPACE
          value: "cadence"
        - name: VISIBILITY_KEYSPACE
          value: "cadence_visibility"
        - name: RINGPOP_SEEDS
          value: "cadence:7933"
        - name: NUM_HISTORY_SHARDS
          value: "4"
        - name: SERVICES
          value: "history,matching,frontend,worker"
        - name: CASSANDRA_USER
          valueFrom:
            secretKeyRef:
              name: cloudbridge-secrets
              key: cassandra-username
        - name: CASSANDRA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloudbridge-secrets
              key: cassandra-password
        - name: CASSANDRA_HOSTS
          value: "cassandra-service.cloudbridge.svc.cluster.local"
        - name: CASSANDRA_PORT
          value: "9042"
        - name: CASSANDRA_KEYSPACE
          value: "cadence"
        - name: CASSANDRA_VISIBILITY_KEYSPACE
          value: "cadence_visibility"
        - name: CASSANDRA_DATACENTER
          value: "dc1"
        - name: CASSANDRA_AUTH_ENABLED
          value: "false"
        - name: CASSANDRA_MAX_CONNS
          value: "2"
        - name: CASSANDRA_MAX_CONNECTIONS_PER_HOST
          value: "1"
        - name: CASSANDRA_CONNECT_CONSISTENCY
          value: "local-one"
        - name: CASSANDRA_TIMEOUT
          value: "600ms"
        - name: CASSANDRA_CONNECT_TIMEOUT
          value: "600ms"
        - name: CASSANDRA_MAX_RETRY_ATTEMPTS
          value: "3"
        - name: CASSANDRA_RETRY_POLICY
          value: "exponential"
        - name: CASSANDRA_CONV_CONSISTENCY
          value: "local-quorum"
        - name: CASSANDRA_RECONNECTION_POLICY
          value: "constant"
        - name: CASSANDRA_DISABLE_INITIAL_HOST_LOOKUP
          value: "false"
        - name: CASSANDRA_PROTO_VERSION
          value: "4"
        - name: LOG_LEVEL
          value: "debug"
        - name: SKIP_SCHEMA_SETUP
          value: "false"
        - name: CASSANDRA_CONSISTENCY
          value: "local-quorum"
        # Critical: Set the correct paths for dockerize
        - name: CONFIG_TEMPLATE_PATH
          value: "/etc/cadence/config/config_template.yaml"
        - name: CONFIG_FILE_PATH
          value: "/etc/cadence/config/docker.yaml"
        # Additional ringpop configuration
        - name: RINGPOP_NAME
          value: "cadence"
        - name: RINGPOP_BOOTSTRAP_MODE
          value: "hosts"
        - name: RINGPOP_BOOTSTRAP_HOSTS
          value: "cadence:7933"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 7934
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 7934
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: cadence-data
          mountPath: /var/lib/cadence
        # RW directory for generated config
        - name: cadence-config-rw
          mountPath: /etc/cadence/config
        # Template file mounted directly via subPath
        - name: cadence-config-template
          mountPath: /etc/cadence/config/config_template.yaml
          subPath: config_template.yaml
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
      volumes:
      - name: cadence-data
        persistentVolumeClaim:
          claimName: cadence-pvc
      # RW volume for generated config files
      - name: cadence-config-rw
        emptyDir: {}
      # Template from ConfigMap
      - name: cadence-config-template
        configMap:
          name: cadence-config-template
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - cadence
              topologyKey: kubernetes.io/hostname

