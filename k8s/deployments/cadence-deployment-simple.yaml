apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadence
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cadence
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: workflow
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: workflow
      app.kubernetes.io/name: cadence
  template:
    metadata:
      labels:
        app.kubernetes.io/component: workflow
        app.kubernetes.io/instance: production
        app.kubernetes.io/name: cadence
        app.kubernetes.io/part-of: cloudbridge-relay
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: kubectl
    spec:
      serviceAccountName: cadence
      containers:
      - name: cadence
        image: ubercadence/server:v0.22.4
        imagePullPolicy: IfNotPresent
        ports:
        - name: grpc
          containerPort: 7933
          protocol: TCP
        - name: web
          containerPort: 7934
          protocol: TCP
        env:
        # Basic configuration
        - name: SERVICES
          value: "history,matching,frontend,worker"
        - name: LOG_LEVEL
          value: "info"
        - name: SKIP_SCHEMA_SETUP
          value: "false"
        - name: AUTO_SETUP
          value: "true"
        
        # Ringpop
        - name: RINGPOP_NAME
          value: "cadence"
        - name: RINGPOP_BOOTSTRAP_MODE
          value: "hosts"
        - name: RINGPOP_BOOTSTRAP_HOSTS
          value: "cadence:7933"
        
        # Database
        - name: DB
          value: "cassandra"
        - name: DB_PORT
          value: "9042"
        - name: KEYSPACE
          value: "cadence"
        - name: VISIBILITY_KEYSPACE
          value: "cadence_visibility"
        - name: NUM_HISTORY_SHARDS
          value: "4"
        
        # Cassandra connection
        - name: CASSANDRA_SEEDS
          value: "cassandra-service"
        - name: CASSANDRA_HOSTS
          value: "cassandra-service.cloudbridge.svc.cluster.local"
        - name: CASSANDRA_PORT
          value: "9042"
        - name: CASSANDRA_KEYSPACE
          value: "cadence"
        - name: CASSANDRA_VISIBILITY_KEYSPACE
          value: "cadence_visibility"
        - name: CASSANDRA_DATACENTER
          value: "dc1"
        - name: CASSANDRA_AUTH_ENABLED
          value: "false"
        - name: CASSANDRA_MAX_CONNS
          value: "2"
        - name: CASSANDRA_CONNECT_CONSISTENCY
          value: "local-one"
        - name: CASSANDRA_TIMEOUT
          value: "600ms"
        - name: CASSANDRA_CONNECT_TIMEOUT
          value: "600ms"
        - name: CASSANDRA_MAX_RETRY_ATTEMPTS
          value: "3"
        - name: CASSANDRA_RETRY_POLICY
          value: "exponential"
        - name: CASSANDRA_CONV_CONSISTENCY
          value: "local-quorum"
        - name: CASSANDRA_RECONNECTION_POLICY
          value: "constant"
        - name: CASSANDRA_DISABLE_INITIAL_HOST_LOOKUP
          value: "false"
        - name: CASSANDRA_PROTO_VERSION
          value: "4"
        - name: CASSANDRA_CONSISTENCY
          value: "local-quorum"
        
        # Cluster metadata
        - name: CLUSTER_METADATA_ENABLE_GLOBAL_DOMAIN
          value: "true"
        - name: CLUSTER_METADATA_FAILOVER_VERSION_INCREMENT
          value: "10"
        - name: CLUSTER_METADATA_MASTER_CLUSTER_NAME
          value: "active"
        - name: CLUSTER_METADATA_CURRENT_CLUSTER_NAME
          value: "active"
        
        # Disable config file completely
        - name: CONFIG_TEMPLATE_PATH
          value: ""
        - name: CONFIG_FILE_PATH
          value: ""
        - name: DOCKERIZE_TEMPLATE
          value: ""
        - name: DOCKERIZE_DELAY
          value: "0"
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 7934
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 7934
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: cadence-data
          mountPath: /var/lib/cadence
      volumes:
      - name: cadence-data
        persistentVolumeClaim:
          claimName: cadence-pvc
      nodeSelector:
        kubernetes.io/os: linux
