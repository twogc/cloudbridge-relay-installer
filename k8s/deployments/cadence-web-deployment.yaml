apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadence-web
  namespace: cloudbridge
  labels:
    app.kubernetes.io/component: web-ui
    app.kubernetes.io/name: cadence-web
    app.kubernetes.io/part-of: cloudbridge-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: web-ui
      app.kubernetes.io/name: cadence-web
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web-ui
        app.kubernetes.io/name: cadence-web
    spec:
      containers:
      - name: cadence-web
        image: ubercadence/web:latest
        ports:
        - containerPort: 8088
          name: http
        env:
        - name: CADENCE_CLUSTERS_NAMES
          value: "active"
        - name: CADENCE_GRPC_PEERS
          value: "cadence-service.cloudbridge.svc.cluster.local:7933"
        - name: CADENCE_GRPC_SERVICES_NAMES
          value: "cadence-frontend"
        - name: CADENCE_WEB_PORT
          value: "8088"
        - name: CADENCE_WEB_HOSTNAME
          value: "0.0.0.0"
        - name: CADENCE_ARCHIVAL_DEFAULT_SEARCH_ENABLED
          value: "true"
        - name: CADENCE_EXTENDED_DOMAIN_INFO_METADATA_ENABLED
          value: "true"
        - name: CADENCE_WORKFLOW_DIAGNOSTICS_ENABLED
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
