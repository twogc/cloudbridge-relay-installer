apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadence
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cadence
    app.kubernetes.io/component: workflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cadence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cadence
    spec:
      containers:
      - name: cadence
        image: ubercadence/server:v0.22.4
        imagePullPolicy: IfNotPresent
        ports:
        - name: grpc
          containerPort: 7933
          protocol: TCP
        - name: web
          containerPort: 7934
          protocol: TCP
        env:
        # Basic configuration
        - name: SERVICES
          value: "history,matching,frontend,worker"
        - name: LOG_LEVEL
          value: "info"
        - name: SKIP_SCHEMA_SETUP
          value: "false"
        - name: AUTO_SETUP
          value: "true"
        
        # Ringpop
        - name: RINGPOP_NAME
          value: "cadence"
        - name: RINGPOP_BOOTSTRAP_MODE
          value: "hosts"
        - name: RINGPOP_BOOTSTRAP_HOSTS
          value: "cadence:7933"
        
        # Database - SQLite
        - name: DB
          value: "sqlite"
        - name: DB_PATH
          value: "/var/lib/cadence/cadence.db"
        
        # Visibility Store
        - name: VISIBILITY_STORE
          value: "sqlite"
        - name: VISIBILITY_DB_PATH
          value: "/var/lib/cadence/visibility.db"
        
        # Cluster metadata
        - name: CLUSTER_METADATA_ENABLE_GLOBAL_DOMAIN
          value: "true"
        - name: CLUSTER_METADATA_FAILOVER_VERSION_INCREMENT
          value: "10"
        - name: CLUSTER_METADATA_MASTER_CLUSTER_NAME
          value: "active"
        - name: CLUSTER_METADATA_CURRENT_CLUSTER_NAME
          value: "active"
        
        # Disable config file completely
        - name: CONFIG_TEMPLATE_PATH
          value: ""
        - name: CONFIG_FILE_PATH
          value: ""
        - name: DOCKERIZE_TEMPLATE
          value: ""
        - name: DOCKERIZE_DELAY
          value: "0"
        
        # Force environment variables
        - name: CADENCE_USE_ENV_VARS
          value: "true"
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 7934
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 7934
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        volumeMounts:
        - name: cadence-data
          mountPath: /var/lib/cadence
      volumes:
      - name: cadence-data
        persistentVolumeClaim:
          claimName: cadence-pvc
      nodeSelector:
        kubernetes.io/os: linux
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cadence-pvc
  namespace: cloudbridge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
