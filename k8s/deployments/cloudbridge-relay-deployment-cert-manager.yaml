apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbridge-relay
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: relay
    app.kubernetes.io/version: "v1.0.0"
    app.kubernetes.io/managed-by: cert-manager
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudbridge-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudbridge-relay
        app.kubernetes.io/component: relay
        app.kubernetes.io/version: "v1.0.0"
      annotations:
        # cert-manager annotations for automatic certificate management
        cert-manager.io/inject-ca-from-secret: "cloudbridge-main-tls"
        prometheus.io/scrape: "true"
        prometheus.io/port: "5551"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cloudbridge-relay
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: cloudbridge-relay
        image: cloudbridge/relay:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 9090
          protocol: TCP
        - name: https
          containerPort: 5553
          protocol: TCP
        - name: grpc
          containerPort: 8444
          protocol: TCP
        - name: metrics
          containerPort: 5551
          protocol: TCP
        - name: p2p-udp
          containerPort: 3478
          protocol: UDP
        - name: p2p-tcp
          containerPort: 3478
          protocol: TCP
        env:
        - name: CLOUDBRIDGE_ENV
          value: "production"
        - name: CLOUDBRIDGE_LOG_LEVEL
          value: "info"
        - name: CLOUDBRIDGE_HTTP_PORT
          value: "9090"
        - name: CLOUDBRIDGE_HTTPS_PORT
          value: "5553"
        - name: CLOUDBRIDGE_GRPC_PORT
          value: "8444"
        - name: CLOUDBRIDGE_METRICS_PORT
          value: "5551"
        - name: CLOUDBRIDGE_P2P_UDP_PORT
          value: "3478"
        - name: CLOUDBRIDGE_P2P_TCP_PORT
          value: "3478"
        # TLS Configuration from cert-manager
        - name: TLS_CERT_FILE
          value: "/etc/ssl/certs/tls.crt"
        - name: TLS_KEY_FILE
          value: "/etc/ssl/private/tls.key"
        - name: TLS_CA_FILE
          value: "/etc/ssl/certs/ca.crt"
        - name: TLS_ENABLED
          value: "true"
        - name: TLS_MIN_VERSION
          value: "1.2"
        - name: TLS_MAX_VERSION
          value: "1.3"
        # gRPC TLS Configuration
        - name: GRPC_TLS_ENABLED
          value: "true"
        - name: GRPC_CERT_FILE
          value: "/etc/ssl/grpc/tls.crt"
        - name: GRPC_KEY_FILE
          value: "/etc/ssl/grpc/tls.key"
        - name: GRPC_CA_FILE
          value: "/etc/ssl/grpc/ca.crt"
        # Database Configuration
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: cloudbridge-database
              key: url
        - name: DATABASE_SSL_MODE
          value: "require"
        # Zitadel Configuration
        - name: ZITADEL_ISSUER
          value: "https://auth.2gc.ru"
        - name: ZITADEL_AUDIENCE
          value: "cloudbridge-relay"
        - name: ZITADEL_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: cloudbridge-zitadel
              key: client-id
        - name: ZITADEL_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: cloudbridge-zitadel
              key: client-secret
        # Prometheus Configuration
        - name: PROMETHEUS_ENABLED
          value: "true"
        - name: PROMETHEUS_PORT
          value: "5551"
        - name: PROMETHEUS_PATH
          value: "/metrics"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 9090
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 9090
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/cloudbridge
          readOnly: true
        - name: wireguard-keys
          mountPath: /etc/wireguard
          readOnly: true
        # cert-manager TLS certificates
        - name: tls-certs
          mountPath: /etc/ssl/certs
          readOnly: true
        - name: tls-private
          mountPath: /etc/ssl/private
          readOnly: true
        # gRPC TLS certificates
        - name: grpc-tls-certs
          mountPath: /etc/ssl/grpc
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: cloudbridge-config
      - name: wireguard-keys
        secret:
          secretName: wireguard-keys
      # cert-manager TLS certificates
      - name: tls-certs
        secret:
          secretName: cloudbridge-main-tls
          items:
          - key: tls.crt
            path: tls.crt
          - key: ca.crt
            path: ca.crt
      - name: tls-private
        secret:
          secretName: cloudbridge-main-tls
          items:
          - key: tls.key
            path: tls.key
      # gRPC TLS certificates
      - name: grpc-tls-certs
        secret:
          secretName: cloudbridge-grpc-tls
          items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key
          - key: ca.crt
            path: ca.crt
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - cloudbridge-relay
              topologyKey: kubernetes.io/hostname
