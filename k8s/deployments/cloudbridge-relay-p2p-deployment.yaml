apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbridge-relay-p2p
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay-p2p
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: relay
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudbridge-relay-p2p
      app.kubernetes.io/component: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudbridge-relay-p2p
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: relay
        app.kubernetes.io/part-of: cloudbridge-relay
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
      - name: cloudbridge-relay-p2p
        image: cr.yandex/crpblcmklr11njvr6ikg/cloudbridge-relay:v1.0.0-p2p
        imagePullPolicy: IfNotPresent
        ports:
        - name: http-api
          containerPort: 8080
          protocol: TCP
        - name: p2p-api
          containerPort: 8082
          protocol: TCP
        - name: quic-p2p
          containerPort: 5553
          protocol: UDP
        - name: masque
          containerPort: 8443
          protocol: TCP
        - name: stun
          containerPort: 19302
          protocol: UDP
        env:
        - name: CONFIG_PATH
          value: "/app/configs/config.json"
        - name: LOG_LEVEL
          value: "debug"
        - name: QUIC_GO_LOG_LEVEL
          value: "debug"
        - name: GIN_MODE
          value: "release"
        - name: TZ
          value: "UTC"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: cloudbridge-relay-secrets
              key: jwt-secret
        - name: KEYCLOAK_FALLBACK_SECRET
          valueFrom:
            secretKeyRef:
              name: cloudbridge-relay-secrets
              key: jwt-secret
        - name: RELAY_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: cloudbridge-relay-secrets
              key: jwt-secret
        - name: ICE_STUN_ENABLED
          value: "true"
        - name: MASQUE_ENABLED
          value: "true"
        - name: STATELESS_RESET_ENABLED
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        volumeMounts:
        - name: config
          mountPath: /app/configs
          readOnly: true
        - name: data
          mountPath: /app/data
        - name: certs
          mountPath: /app/certs
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          capabilities:
            drop:
            - ALL
            add:
            - NET_ADMIN
            - NET_RAW
      volumes:
      - name: config
        configMap:
          name: cloudbridge-config
      - name: data
        emptyDir: {}
      - name: certs
        emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
