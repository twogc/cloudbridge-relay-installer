apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbridge-relay-p2p
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay-p2p
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: relay
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudbridge-relay-p2p
      app.kubernetes.io/component: relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudbridge-relay-p2p
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: relay
        app.kubernetes.io/part-of: cloudbridge-relay
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
      - name: cloudbridge-relay-p2p
        image: cloudbridge-relay-p2p:20250918-211458-53c7b168-fixed
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9090
          protocol: TCP
        - name: p2p-api
          containerPort: 9091
          protocol: TCP
        - name: wireguard
          containerPort: 51820
          protocol: UDP
        env:
        - name: CONFIG_PATH
          value: "/app/configs/config.json"
        - name: LOG_LEVEL
          value: "info"
        - name: GIN_MODE
          value: "release"
        - name: TZ
          value: "UTC"
        - name: JWT_SECRET
          value: "85Sk/NfLq3gqzCXzmBKbJCpL+f5BssXz3G8dVi3sPiE="
        - name: KEYCLOAK_FALLBACK_SECRET
          value: "85Sk/NfLq3gqzCXzmBKbJCpL+f5BssXz3G8dVi3sPiE="
        - name: RELAY_JWT_SECRET
          value: "85Sk/NfLq3gqzCXzmBKbJCpL+f5BssXz3G8dVi3sPiE="
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        volumeMounts:
        - name: config
          mountPath: /app/configs
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          capabilities:
            drop:
            - ALL
            add:
            - NET_ADMIN
            - NET_RAW
      volumes:
      - name: config
        configMap:
          name: cloudbridge-config
      nodeSelector:
        kubernetes.io/os: linux
