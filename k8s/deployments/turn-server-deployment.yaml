---
# ConfigMap для конфигурации TURN сервера
apiVersion: v1
kind: ConfigMap
metadata:
  name: turn-server-config
  namespace: cloudbridge
  labels:
    app: turn-server
    component: nat-traversal
data:
  turnserver.conf: |
    # Listening IP and port
    listening-port=3478
    tls-listening-port=5349

    # Relay IP address (will be set by environment variable)
    relay-ip=${TURN_EXTERNAL_IP}

    # Authentication realm
    realm=cloudbridge.2gc.ru

    # Require authentication
    lt-cred-mech

    # User database (static credentials - in production use external-secrets)
    user=cloudbridge:${TURN_PASSWORD}

    # Relay ports range for client connections
    min-port=49152
    max-port=65535

    # Security settings
    fingerprint
    no-multicast-peers
    no-loopback-peers

    # Logging
    log-file=/var/log/turn/turnserver.log
    verbose

    # TLS/SSL settings
    cert=/etc/turn/certs/tls.crt
    pkey=/etc/turn/certs/tls.key
    cipher-list="HIGH:!aNULL:!MD5:!RC4"

    # Additional security
    no-tlsv1
    no-tlsv1_1
    no-tcp-relay

    # Performance
    max-bps=1000000
    bps-capacity=0
    total-quota=100
    user-quota=10

    # Stale nonce handling
    stale-nonce=600

    # Mobility support
    mobility

    # Prometheus metrics
    prometheus
    prometheus-port=9641

---
# Secret для TURN credentials (should be managed by External Secrets in production)
apiVersion: v1
kind: Secret
metadata:
  name: turn-server-credentials
  namespace: cloudbridge
  labels:
    app: turn-server
    component: nat-traversal
type: Opaque
stringData:
  TURN_PASSWORD: "changeme-in-production"
  TURN_EXTERNAL_IP: "0.0.0.0"  # Will be updated by LoadBalancer

---
# Service для TURN сервера (UDP + TCP)
apiVersion: v1
kind: Service
metadata:
  name: turn-server
  namespace: cloudbridge
  labels:
    app: turn-server
    component: nat-traversal
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9641"
    prometheus.io/path: "/metrics"
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours
  ports:
    # TURN UDP port
    - name: turn-udp
      protocol: UDP
      port: 3478
      targetPort: 3478
    # TURN TCP port
    - name: turn-tcp
      protocol: TCP
      port: 3478
      targetPort: 3478
    # TURNS (TURN over TLS) port
    - name: turns-tcp
      protocol: TCP
      port: 5349
      targetPort: 5349
    # Prometheus metrics
    - name: metrics
      protocol: TCP
      port: 9641
      targetPort: 9641
  selector:
    app: turn-server

---
# PersistentVolumeClaim для логов
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: turn-server-logs
  namespace: cloudbridge
  labels:
    app: turn-server
    component: nat-traversal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: cinder-csi-high-iops  # VK Cloud

---
# Deployment для TURN сервера
apiVersion: apps/v1
kind: Deployment
metadata:
  name: turn-server
  namespace: cloudbridge
  labels:
    app: turn-server
    component: nat-traversal
    version: v1.0.0
spec:
  replicas: 2  # High availability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: turn-server
  template:
    metadata:
      labels:
        app: turn-server
        component: nat-traversal
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9641"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cloudbridge-relay

      # Init container для обнаружения external IP
      initContainers:
        - name: get-external-ip
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              # Wait for LoadBalancer IP
              echo "Waiting for LoadBalancer external IP..."
              until [ -n "$EXTERNAL_IP" ]; do
                EXTERNAL_IP=$(kubectl get svc turn-server -n cloudbridge -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
                if [ -z "$EXTERNAL_IP" ]; then
                  echo "Waiting for external IP... (retry in 5s)"
                  sleep 5
                fi
              done
              echo "External IP detected: $EXTERNAL_IP"
              echo "$EXTERNAL_IP" > /config/external-ip
          volumeMounts:
            - name: config-volume
              mountPath: /config

      containers:
        # CloudBridge встроенный TURN сервер
        - name: cloudbridge-turn
          image: cr.yandex/crpblcmklr11njvr6ikg/cloudbridge-relay:latest
          imagePullPolicy: Always

          command:
            - /app/cloudbridge-relay

          args:
            - --mode=turn-server
            - --turn-listen-addr=0.0.0.0:3478
            - --turn-realm=$(TURN_REALM)
            - --turn-username=$(TURN_USERNAME)
            - --turn-password=$(TURN_PASSWORD)
            - --turn-external-ip=$(TURN_EXTERNAL_IP)
            - --prometheus-metrics-port=9641

          env:
            - name: TURN_REALM
              value: "cloudbridge.2gc.ru"
            - name: TURN_USERNAME
              value: "cloudbridge"
            - name: TURN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: turn-server-credentials
                  key: TURN_PASSWORD
            - name: TURN_EXTERNAL_IP
              valueFrom:
                secretKeyRef:
                  name: turn-server-credentials
                  key: TURN_EXTERNAL_IP
                  optional: true

          ports:
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
            - name: turn-tcp
              containerPort: 3478
              protocol: TCP
            - name: turns-tcp
              containerPort: 5349
              protocol: TCP
            - name: metrics
              containerPort: 9641
              protocol: TCP

          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi

          livenessProbe:
            httpGet:
              path: /metrics
              port: 9641
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /metrics
              port: 9641
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          volumeMounts:
            - name: logs
              mountPath: /var/log/turn
            - name: tls-certs
              mountPath: /etc/turn/certs
              readOnly: true
            - name: config-volume
              mountPath: /config

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE

      volumes:
        - name: config
          configMap:
            name: turn-server-config
        - name: logs
          persistentVolumeClaim:
            claimName: turn-server-logs
        - name: tls-certs
          secret:
            secretName: cloudbridge-tls
            optional: false
        - name: config-volume
          emptyDir: {}

      affinity:
        # Pod anti-affinity для распределения реплик
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - turn-server
                topologyKey: kubernetes.io/hostname

      # Tolerations для размещения на специальных нодах
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "network-intensive"
          effect: "NoSchedule"

---
# HorizontalPodAutoscaler для auto-scaling
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: turn-server-hpa
  namespace: cloudbridge
  labels:
    app: turn-server
    component: nat-traversal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: turn-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: turn_active_allocations
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max

---
# PodDisruptionBudget для high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: turn-server-pdb
  namespace: cloudbridge
  labels:
    app: turn-server
    component: nat-traversal
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: turn-server

---
# ServiceMonitor для Prometheus (если используется Prometheus Operator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: turn-server
  namespace: cloudbridge
  labels:
    app: turn-server
    component: nat-traversal
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: turn-server
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      scheme: http
  namespaceSelector:
    matchNames:
      - cloudbridge

---
# NetworkPolicy для ограничения доступа
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: turn-server-netpol
  namespace: cloudbridge
  labels:
    app: turn-server
    component: nat-traversal
spec:
  podSelector:
    matchLabels:
      app: turn-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Разрешаем TURN трафик от всех (публичный сервис)
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 3478
        - protocol: TCP
          port: 3478
        - protocol: TCP
          port: 5349
    # Разрешаем метрики от Prometheus
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9641
  egress:
    # Разрешаем relay трафик (весь UDP для relay портов)
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 49152
        - protocol: UDP
          port: 65535
    # Разрешаем DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53
