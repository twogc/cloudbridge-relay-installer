apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudbridge-external-lb-config
  namespace: cloudbridge
  labels:
    app: cloudbridge-relay
    component: external-loadbalancer
data:
  loadbalancer.yaml: |
    # CloudBridge External LoadBalancer Configuration
    # External IP: 109.120.180.160 (b1.2gc.space)
    # Internal IP: 10.0.0.242
    
    # LoadBalancer settings
    loadbalancer:
      external_ip: "109.120.180.160"
      internal_ip: "10.0.0.242"
      domain: "2gc.ru"
      
      # DNS mappings
      dns_mappings:
        - domain: "b1.2gc.space"
          ip: "109.120.180.160"
          type: "A"
        - domain: "masque.2gc.space"
          target: "b1.2gc.space"
          type: "CNAME"
        - domain: "relay.2gc.space"
          target: "b1.2gc.space"
          type: "CNAME"
      
      # Service mappings for 2gc.ru domain
      services:
        # Main CloudBridge Relay
        - domain: "relay.2gc.ru"
          upstream: "cloudbridge-relay-loadbalancer.cloudbridge.svc.cluster.local"
          ports:
            - name: "https"
              external: 443
              internal: 8443
              protocol: "TCP"
            - name: "grpc"
              external: 8444
              internal: 8444
              protocol: "TCP"
            - name: "quic"
              external: 9090
              internal: 9090
              protocol: "UDP"
              
        # MASQUE Protocol
        - domain: "masque.2gc.ru"
          upstream: "cloudbridge-relay-loadbalancer.cloudbridge.svc.cluster.local"
          ports:
            - name: "masque-https"
              external: 443
              internal: 8443
              protocol: "TCP"
            - name: "masque-quic"
              external: 9090
              internal: 9090
              protocol: "UDP"
              
        # P2P API
        - domain: "p2p.2gc.ru"
          upstream: "p2p-api-loadbalancer.cloudbridge.svc.cluster.local"
          ports:
            - name: "p2p-api"
              external: 8082
              internal: 8082
              protocol: "TCP"
              
        # Admin Dashboard
        - domain: "admin.2gc.ru"
          upstream: "cloudbridge-relay-external.cloudbridge.svc.cluster.local"
          ports:
            - name: "admin-https"
              external: 443
              internal: 8443
              protocol: "TCP"
              
        # Monitoring
        - domain: "monitor.2gc.ru"
          upstream: "prometheus.cloudbridge.svc.cluster.local"
          ports:
            - name: "prometheus"
              external: 9090
              internal: 9090
              protocol: "TCP"
              
        # API Gateway
        - domain: "api.2gc.ru"
          upstream: "cloudbridge-relay-external.cloudbridge.svc.cluster.local"
          ports:
            - name: "api-https"
              external: 443
              internal: 9091
              protocol: "TCP"
            - name: "api-grpc"
              external: 5553
              internal: 5553
              protocol: "TCP"
      
      # Health checks
      health_checks:
        enabled: true
        interval: "30s"
        timeout: "5s"
        retries: 3
        endpoints:
          - path: "/health"
            port: 9091
          - path: "/api/v1/health"
            port: 8082
            
      # SSL/TLS Configuration
      tls:
        enabled: true
        cert_path: "/etc/ssl/certs/2gc.ru.crt"
        key_path: "/etc/ssl/private/2gc.ru.key"
        ca_path: "/etc/ssl/certs/ca.crt"
        
        # Wildcard certificate for *.2gc.ru
        domains:
          - "2gc.ru"
          - "*.2gc.ru"
          - "relay.2gc.ru"
          - "masque.2gc.ru"
          - "p2p.2gc.ru"
          - "admin.2gc.ru"
          - "monitor.2gc.ru"
          - "api.2gc.ru"
          
      # Load balancing algorithm
      algorithm: "round_robin"  # round_robin, least_connections, ip_hash, weighted
      
      # Session affinity
      session_affinity:
        enabled: false
        cookie_name: "cloudbridge-session"
        timeout: "1h"
        
      # Rate limiting
      rate_limiting:
        enabled: true
        global_limit: "10000/min"
        per_ip_limit: "1000/min"
        burst_size: 100
        
      # Security
      security:
        # DDoS protection
        ddos_protection:
          enabled: true
          threshold: "1000/min"
          block_duration: "5m"
          
        # WAF rules
        waf:
          enabled: true
          rules:
            - name: "block_sql_injection"
              pattern: "(?i)(union|select|insert|delete|drop|create|alter)"
              action: "block"
            - name: "block_xss"
              pattern: "(?i)(<script|javascript:|onload=|onerror=)"
              action: "block"
              
        # Geo blocking (if needed)
        geo_blocking:
          enabled: false
          allowed_countries: ["RU", "BY", "KZ"]
          
---
apiVersion: v1
kind: Service
metadata:
  name: cloudbridge-external-lb
  namespace: cloudbridge
  labels:
    app: cloudbridge-relay
    component: external-loadbalancer
  annotations:
    # Указываем внешний IP балансировщика
    service.beta.kubernetes.io/external-traffic: "OnlyLocal"
    metallb.universe.tf/loadBalancerIPs: "109.120.180.160"
spec:
  type: LoadBalancer
  loadBalancerIP: "109.120.180.160"
  externalTrafficPolicy: Local
  ports:
  # Только HTTPS - все остальные сервисы проксируются через 443
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  selector:
    app: cloudbridge-relay

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudbridge-2gc-ru-ingress
  namespace: cloudbridge
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "cloudbridge-relay-external"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - "relay.2gc.ru"
    - "masque.2gc.ru"
    - "p2p.2gc.ru"
    - "admin.2gc.ru"
    - "monitor.2gc.ru"
    - "api.2gc.ru"
    secretName: cloudbridge-2gc-ru-tls
  rules:
  # Main relay service
  - host: relay.2gc.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 8443
              
  # MASQUE protocol
  - host: masque.2gc.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 8443
              
  # P2P API
  - host: p2p.2gc.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: p2p-api-loadbalancer
            port:
              number: 8082
              
  # Admin interface
  - host: admin.2gc.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 9091
              
  # Monitoring
  - host: monitor.2gc.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus
            port:
              number: 9090
              
  # API Gateway
  - host: api.2gc.ru
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 9091
      - path: /grpc
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5553
