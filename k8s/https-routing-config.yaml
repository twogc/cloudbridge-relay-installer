apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudbridge-https-routing
  namespace: cloudbridge
  labels:
    app: cloudbridge-relay
    component: https-routing
data:
  routing.yaml: |
    # CloudBridge HTTPS Routing Configuration
    # Все сервисы доступны через порт 443 с маршрутизацией по путям и заголовкам
    
    # Маршрутизация по доменам и путям через порт 443
    routing_rules:
      
      # Основной relay сервис
      - domain: "relay.2gc.ru"
        paths:
          - path: "/"
            service: "cloudbridge-relay-external"
            port: 8443
            protocol: "https"
          - path: "/api/v1"
            service: "cloudbridge-relay-external" 
            port: 9091
            protocol: "https"
          - path: "/health"
            service: "cloudbridge-relay-external"
            port: 9091
            protocol: "https"
            
      # MASQUE протокол
      - domain: "masque.2gc.ru"
        paths:
          - path: "/"
            service: "cloudbridge-relay-external"
            port: 8443
            protocol: "https"
          - path: "/.well-known/masque"
            service: "cloudbridge-relay-external"
            port: 8443
            protocol: "https"
            
      # P2P API
      - domain: "p2p.2gc.ru"
        paths:
          - path: "/"
            service: "p2p-api-loadbalancer"
            port: 8082
            protocol: "https"
          - path: "/api/v1/peers"
            service: "p2p-api-loadbalancer"
            port: 8082
            protocol: "https"
            
      # Admin интерфейс
      - domain: "admin.2gc.ru"
        paths:
          - path: "/"
            service: "cloudbridge-relay-external"
            port: 9091
            protocol: "https"
          - path: "/admin"
            service: "cloudbridge-relay-external"
            port: 9091
            protocol: "https"
            
      # Мониторинг
      - domain: "monitor.2gc.ru"
        paths:
          - path: "/"
            service: "prometheus"
            port: 9090
            protocol: "http"  # Prometheus обычно HTTP
          - path: "/metrics"
            service: "cloudbridge-relay-external"
            port: 9091
            protocol: "https"
            
      # API Gateway
      - domain: "api.2gc.ru"
        paths:
          - path: "/api/v1"
            service: "cloudbridge-relay-external"
            port: 9091
            protocol: "https"
          - path: "/grpc"
            service: "cloudbridge-relay-external"
            port: 5553
            protocol: "grpc"  # gRPC over HTTPS
          - path: "/health"
            service: "cloudbridge-relay-external"
            port: 9091
            protocol: "https"
            
    # Специальная маршрутизация для gRPC
    grpc_routing:
      - service_name: "cloudbridge.relay.v1.RelayService"
        backend: "cloudbridge-relay-external:5553"
      - service_name: "cloudbridge.p2p.v1.P2PService" 
        backend: "p2p-api-loadbalancer:8082"
      - service_name: "cloudbridge.heartbeat.v1.HeartbeatService"
        backend: "cloudbridge-relay-external:5553"
        
    # WebSocket маршрутизация
    websocket_routing:
      - path: "/ws/peers"
        service: "cloudbridge-relay-external"
        port: 9091
      - path: "/ws/tunnels"
        service: "cloudbridge-relay-external" 
        port: 8443
        
    # QUIC маршрутизация (через HTTPS/3)
    quic_routing:
      - alt_svc: "h3=\":443\""  # HTTP/3 over QUIC на порту 443
        service: "cloudbridge-relay-external"
        port: 9090
        
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudbridge-unified-ingress
  namespace: cloudbridge
  annotations:
    # Nginx Ingress Controller
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    
    # WebSocket поддержка
    nginx.ingress.kubernetes.io/websocket-services: "cloudbridge-relay-external"
    
    # gRPC поддержка
    nginx.ingress.kubernetes.io/grpc-backend: "true"
    
    # QUIC/HTTP3 поддержка
    nginx.ingress.kubernetes.io/http3: "true"
    
    # Сертификаты
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Кастомная конфигурация для маршрутизации
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # Определяем тип запроса и маршрутизируем соответственно
      set $backend_service "cloudbridge-relay-external";
      set $backend_port "8443";
      
      # gRPC запросы
      if ($content_type ~ "application/grpc") {
        set $backend_service "cloudbridge-relay-external";
        set $backend_port "5553";
      }
      
      # P2P API запросы
      if ($request_uri ~ "^/api/v1/peers") {
        set $backend_service "p2p-api-loadbalancer";
        set $backend_port "8082";
      }
      
      # WebSocket соединения
      if ($http_upgrade = "websocket") {
        set $backend_service "cloudbridge-relay-external";
        set $backend_port "9091";
      }
      
spec:
  tls:
  - hosts:
    - "relay.2gc.ru"
    - "masque.2gc.ru" 
    - "p2p.2gc.ru"
    - "admin.2gc.ru"
    - "monitor.2gc.ru"
    - "api.2gc.ru"
    secretName: cloudbridge-2gc-ru-tls
    
  rules:
  # Все домены маршрутизируются через порт 443
  - host: relay.2gc.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 8443
              
  - host: masque.2gc.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 8443
              
  - host: p2p.2gc.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: p2p-api-loadbalancer
            port:
              number: 8082
              
  - host: admin.2gc.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 9091
              
  - host: monitor.2gc.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus
            port:
              number: 9090
              
  - host: api.2gc.ru
    http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 9091
      - path: /grpc
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5553
