apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudbridge-api-ingress
  namespace: cloudbridge
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "cloudbridge-relay-external"
    nginx.ingress.kubernetes.io/ssl-certificate: "cloudbridge/cloudbridge-2gc-ru-tls"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - relay.2gc.ru
    - masque.2gc.ru
    - p2p.2gc.ru
    - admin.2gc.ru
    - monitor.2gc.ru
    - api.2gc.ru
    secretName: cloudbridge-2gc-ru-tls
  rules:
  # relay.2gc.ru - Main P2P Relay API
  - host: relay.2gc.ru
    http:
      paths:
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5552
      - path: /health
        pathType: Exact
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5551
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5552
  
  # masque.2gc.ru - MASQUE HTTP/3 Proxy
  - host: masque.2gc.ru
    http:
      paths:
      - path: /masque/
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 8443
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 8443
  
  # p2p.2gc.ru - P2P Discovery API
  - host: p2p.2gc.ru
    http:
      paths:
      - path: /p2p/
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5552
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5552
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5552
  
  # admin.2gc.ru - Admin Panel
  - host: admin.2gc.ru
    http:
      paths:
      - path: /admin/
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5551
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5551
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5551
  
  # monitor.2gc.ru - Metrics and Monitoring
  - host: monitor.2gc.ru
    http:
      paths:
      - path: /metrics/
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 9090
      - path: /prometheus/
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 9090
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 9090
  
  # api.2gc.ru - General API Gateway
  - host: api.2gc.ru
    http:
      paths:
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5552
      - path: /health
        pathType: Exact
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5551
      - path: /docs/
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5552
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5552
