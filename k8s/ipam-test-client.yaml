apiVersion: v1
kind: Pod
metadata:
  name: ipam-test-client
  namespace: cloudbridge-system
  labels:
    app: ipam-test
spec:
  containers:
  - name: ipam-test
    image: postgres:15-alpine
    command: ["/bin/sh"]
    args: ["-c", "while true; do sleep 3600; done"]
    env:
    - name: PGHOST
      value: "postgres"
    - name: PGPORT
      value: "5432"
    - name: PGDATABASE
      value: "cloudbridge_ipam"
    - name: PGUSER
      value: "ipam_user"
    - name: PGPASSWORD
      value: "secure_password_123"

