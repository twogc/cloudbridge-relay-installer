apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudbridge-relay-config
  namespace: cloudbridge
  labels:
    app: cloudbridge-relay
data:
  config.json: |
    {
      "server": {
        "address": "0.0.0.0",
        "port": 5550,
        "timeout": "30s",
        "max_tunnels": 1000,
        "ping_interval": "30s",
        "cleanup_interval": "60s"
      },
      "tenants": {
        "relay-test-tenant": {
          "enabled": true,
          "name": "Relay Test Tenant",
          "description": "Test tenant for DevOps development",
          "limits": {
            "max_tunnels": 10,
            "max_connections": 20,
            "max_bandwidth_mbps": 100,
            "rate_limit_per_second": 500,
            "burst": 100
          },
          "jwt": {
            "issuer": "2gc.ru",
            "audience": "relay-test-tenant",
            "allowed_claims": ["tenant_id", "user_id", "permissions"]
          },
          "allowed_ips": [],
          "allowed_ports": [],
          "features": ["tls", "jwt", "tunneling", "p2p", "quic", "grpc"]
        }
      },
      "keycloak": {
        "enabled": false,
        "server_url": "",
        "realm": "",
        "client_id": "",
        "client_secret": "",
        "public_key": "",
        "token_validation": {
          "issuer": "",
          "audience": "",
          "clock_skew": "30s"
        },
        "jwks_cache_ttl": "1h",
        "http_timeout": "30s"
      },
      "zitadel": {
        "enabled": true,
        "domain": "https://zitadel.local",
        "project_id": "cloudbridge-project",
        "client_id": "cloudbridge-relay",
        "client_secret": "cloudbridge-relay-secret",
        "fallback_secret": "85Sk/NfLq3gqzCXzmBKbJCpL+f5BssXz3G8dVi3sPiE=",
        "token_validation": {
          "audience": "cloudbridge-relay",
          "clock_skew": "30s"
        },
        "cache_ttl": "5m",
        "http_timeout": "30s"
      },
      "security": {
        "tls_enabled": false,
        "cert_file": "/app/certs/tls.crt",
        "key_file": "/app/certs/tls.key",
        "allowed_ips": [],
        "rate_limit": {
          "enabled": true,
          "requests_per_second": 100.0,
          "burst": 1000
        }
      },
      "metrics": {
        "enabled": true,
        "port": 5551,
        "path": "/metrics"
      },
      "api": {
        "enabled": true,
        "port": 5552,
        "version": "v1"
      },
      "logging": {
        "level": "info",
        "format": "json",
        "output": "stdout",
        "file": "",
        "max_size": "100MB",
        "max_age": "7d",
        "max_backups": 5
      },
      "protocol": {
        "auto_select": true,
        "preferred": "grpc",
        "fallback": "http2",
        "switch_threshold": 0.8,
        "health_check_interval": "30s"
      },
      "quic": {
        "enabled": true,
        "port": 9090,
        "max_streams": 100,
        "keep_alive": true,
        "idle_timeout": "30s",
        "handshake_timeout": "10s"
      },
      "zero_trust": {
        "enabled": false,
        "client_daemon": false,
        "service_discovery": false,
        "auto_reconnect": false,
        "circuit_breaker": {
          "enabled": false,
          "failure_threshold": 10,
          "success_threshold": 3,
          "timeout": "60s",
          "window_size": "120s"
        },
        "health_check": {
          "enabled": true,
          "interval": "30s",
          "timeout": "5s",
          "checks": [
            {
              "type": "http",
              "url": "http://localhost:5550/health",
              "timeout": "5s"
            }
          ]
        }
      },
      "enhanced_quic": {
        "enabled": true,
        "port": 9092,
        "max_streams": 100,
        "keep_alive": true,
        "idle_timeout": "30s",
        "handshake_timeout": "10s",
        "ddos_protection": false,
        "geographic_routing": false,
        "keycloak_integration": false
      },
      "p2p_api": {
        "enabled": true,
        "port": 8082,
        "host": "0.0.0.0",
        "cors_enabled": true,
        "rate_limit": {
          "enabled": true,
          "requests_per_minute": 100
        }
      },
      "masque": {
        "enabled": false,
        "proxy_url": "https://auth.2gc.ru:8445",
        "alpn_protocols": ["h3"],
        "fallback_enabled": true
      },
      "grpc": {
        "enabled": true,
        "port": 8444,
        "tls_enabled": false,
        "cert_file": "/app/certs/tls.crt",
        "key_file": "/app/certs/tls.key",
        "mtls_enabled": false,
        "keepalive_ping": "15s",
        "keepalive_timeout": "10s",
        "max_recv_msg_size": 4194304,
        "max_send_msg_size": 4194304
      },
      "cadence": {
        "enabled": true,
        "host_port": "cadence:7933",
        "domain": "cloudbridge",
        "task_list": "relay-task-list"
      }
    }
