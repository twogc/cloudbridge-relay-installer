apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-config
  namespace: cloudbridge
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/name: monitoring-config
    app.kubernetes.io/part-of: cloudbridge-relay
data:
  prometheus-rules.yaml: |
    groups:
    - name: cloudbridge-alerts
      rules:
      - alert: HighLatency
        expr: ai_prediction_accuracy < 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI prediction accuracy is low"
          description: "AI prediction accuracy is {{ $value }} which is below threshold"
      
      - alert: AIServiceDown
        expr: up{job="ai-service"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AI Service is down"
          description: "AI Service has been down for more than 1 minute"
      
      - alert: HighMemoryUsage
        expr: ai_memory_usage_bytes / 1024 / 1024 / 1024 > 1.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI Service high memory usage"
          description: "AI Service memory usage is {{ $value }}GB"
      
      - alert: HighCPUUsage
        expr: ai_cpu_usage_percent > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI Service high CPU usage"
          description: "AI Service CPU usage is {{ $value }}%"
      
      - alert: AnomaliesDetected
        expr: increase(ai_anomalies_detected_total[5m]) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High number of anomalies detected"
          description: "{{ $value }} anomalies detected in the last 5 minutes"
      
      - alert: CadenceWorkflowFailed
        expr: increase(cadence_workflow_failed_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Cadence workflow failed"
          description: "{{ $value }} Cadence workflows failed in the last 5 minutes"
  
  grafana-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "CloudBridge AI Monitoring",
        "tags": ["cloudbridge", "ai", "monitoring"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "AI Service Status",
            "type": "stat",
            "targets": [
              {
                "expr": "up{job=\"ai-service\"}",
                "legendFormat": "AI Service"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": 0},
                    {"color": "green", "value": 1}
                  ]
                }
              }
            }
          },
          {
            "id": 2,
            "title": "AI Prediction Accuracy",
            "type": "graph",
            "targets": [
              {
                "expr": "ai_prediction_accuracy",
                "legendFormat": "Accuracy"
              }
            ]
          },
          {
            "id": 3,
            "title": "AI Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "ai_memory_usage_bytes / 1024 / 1024",
                "legendFormat": "Memory (MB)"
              }
            ]
          },
          {
            "id": 4,
            "title": "AI CPU Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "ai_cpu_usage_percent",
                "legendFormat": "CPU %"
              }
            ]
          },
          {
            "id": 5,
            "title": "Anomalies Detected",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(ai_anomalies_detected_total[5m])",
                "legendFormat": "Anomalies/sec"
              }
            ]
          },
          {
            "id": 6,
            "title": "AI Requests Processed",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(ai_requests_processed_total[5m])",
                "legendFormat": "Requests/sec"
              }
            ]
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "30s"
      }
    }
  
  alertmanager-config.yaml: |
    global:
      smtp_smarthost: 'localhost:587'
      smtp_from: 'alerts@cloudbridge.local'
    
    route:
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'web.hook'
    
    receivers:
    - name: 'web.hook'
      webhook_configs:
      - url: 'http://ai-service:8083/api/v1/alerts'
        send_resolved: true
    
    - name: 'email'
      email_configs:
      - to: 'admin@cloudbridge.local'
        subject: 'CloudBridge Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          {{ end }}
