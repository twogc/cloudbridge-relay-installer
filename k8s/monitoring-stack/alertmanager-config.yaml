apiVersion: v1
kind: Secret
metadata:
  name: cloudbridge-alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/component: alert-router
    app.kubernetes.io/instance: cloudbridge
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: cloudbridge-monitoring
type: Opaque
stringData:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'localhost:587'
      smtp_from: 'alertmanager@cloudbridge.com'
      smtp_auth_username: 'alertmanager@cloudbridge.com'
      smtp_auth_password: 'password'
    
    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'web.hook'
      routes:
      - match:
          severity: critical
        receiver: 'critical-alerts'
        group_wait: 5s
        repeat_interval: 5m
      - match:
          severity: warning
        receiver: 'warning-alerts'
        group_wait: 30s
        repeat_interval: 1h
      - match:
          component: bgp
        receiver: 'bgp-alerts'
        group_wait: 10s
        repeat_interval: 30m
      - match:
          component: anycast
        receiver: 'anycast-alerts'
        group_wait: 10s
        repeat_interval: 30m
      - match:
          component: cloudbridge
        receiver: 'cloudbridge-alerts'
        group_wait: 10s
        repeat_interval: 1h
    
    receivers:
    - name: 'web.hook'
      webhook_configs:
      - url: 'http://127.0.0.1:5001/'
    
    - name: 'critical-alerts'
      email_configs:
      - to: 'oncall@cloudbridge.com'
        subject: '[CRITICAL] CloudBridge Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Runbook: {{ .Annotations.runbook_url }}
          {{ end }}
      slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#alerts-critical'
        title: 'CloudBridge Critical Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
    
    - name: 'warning-alerts'
      email_configs:
      - to: 'team@cloudbridge.com'
        subject: '[WARNING] CloudBridge Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          {{ end }}
      slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#alerts-warning'
        title: 'CloudBridge Warning Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
    
    - name: 'bgp-alerts'
      email_configs:
      - to: 'network-team@cloudbridge.com'
        subject: '[BGP] CloudBridge BGP Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          BGP Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Runbook: {{ .Annotations.runbook_url }}
          {{ end }}
      slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#network-bgp'
        title: 'CloudBridge BGP Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
    
    - name: 'anycast-alerts'
      email_configs:
      - to: 'sre@cloudbridge.com'
        subject: '[ANYCAST] CloudBridge Anycast Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Anycast Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Runbook: {{ .Annotations.runbook_url }}
          {{ end }}
      slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#sre-anycast'
        title: 'CloudBridge Anycast Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
    
    - name: 'cloudbridge-alerts'
      email_configs:
      - to: 'devops@cloudbridge.com'
        subject: '[CLOUDBRIDGE] CloudBridge Service Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Service Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          {{ end }}
      slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#devops-cloudbridge'
        title: 'CloudBridge Service Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
    
    inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'cluster', 'service']
    - source_match:
        alertname: 'BGPExporterDown'
      target_match:
        alertname: 'BGPSessionDown'
      equal: ['instance']





