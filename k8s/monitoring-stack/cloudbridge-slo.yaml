  name: cloudbridge-anycast-availability
  namespace: monitoring
  labels:
    app.kubernetes.io/component: slo
    app.kubernetes.io/instance: cloudbridge
    app.kubernetes.io/name: sloth
    app.kubernetes.io/part-of: cloudbridge-monitoring
spec:
  service: "cloudbridge-anycast"
  sloPeriod: "30d"
  slos:
  - name: "anycast-availability"
    objective: 99.99
    description: "CloudBridge Anycast service availability"
    sli:
      events:
        error_query: |
          sum(rate(anycast_health == 0[5m]))
        total_query: |
          sum(rate(anycast_health[5m]))
    alerting:
      name: "cloudbridge-anycast-availability"
      labels:
        severity: "critical"
        component: "anycast"
        service: "routing"
      annotations:
        summary: "CloudBridge Anycast availability is below SLO"
        description: "CloudBridge Anycast availability is {{ $value }}%, below the 99.99% SLO"
        runbook_url: "https://cloudbridge-docs.com/runbooks/anycast-availability"
---
apiVersion: sloth.slok.dev/v1
kind: SLO
metadata:
  name: cloudbridge-latency
  namespace: monitoring
  labels:
    app.kubernetes.io/component: slo
    app.kubernetes.io/instance: cloudbridge
    app.kubernetes.io/name: sloth
    app.kubernetes.io/part-of: cloudbridge-monitoring
spec:
  service: "cloudbridge-latency"
  sloPeriod: "30d"
  slos:
  - name: "latency"
    objective: 99.5
    description: "CloudBridge latency under 100ms"
    sli:
      events:
        error_query: |
          sum(rate(cloudbridge_relay_request_duration_seconds_bucket{le="0.1"}[5m]))
        total_query: |
          sum(rate(cloudbridge_relay_request_duration_seconds_bucket[5m]))
    alerting:
      name: "cloudbridge-latency"
      labels:
        severity: "warning"
        component: "cloudbridge"
        service: "performance"
      annotations:
        summary: "CloudBridge latency is above SLO"
        description: "CloudBridge latency is {{ $value }}%, above the 99.5% SLO"
        runbook_url: "https://cloudbridge-docs.com/runbooks/latency-optimization"





