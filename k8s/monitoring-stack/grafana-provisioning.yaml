# Grafana Provisioning for CloudBridge
# Based on Grafana reference implementation

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app.kubernetes.io/component: visualization
    app.kubernetes.io/instance: cloudbridge
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: cloudbridge-monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://cloudbridge-prometheus:9090
      access: proxy
      isDefault: true
      editable: true
      jsonData:
        httpMethod: POST
        queryTimeout: 60s
        timeInterval: 5s
    - name: VictoriaMetrics
      type: prometheus
      url: http://vmselect:8481
      access: proxy
      isDefault: false
      editable: true
      jsonData:
        httpMethod: POST
        queryTimeout: 60s
        timeInterval: 5s
    - name: CloudBridge BGP
      type: prometheus
      url: http://cloudbridge-prometheus:9090
      access: proxy
      isDefault: false
      editable: true
      jsonData:
        httpMethod: POST
        queryTimeout: 60s
        timeInterval: 5s
      uid: cloudbridge-bgp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/component: visualization
    app.kubernetes.io/instance: cloudbridge
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: cloudbridge-monitoring
data:
  dashboard-providers.yaml: |
    apiVersion: 1
    providers:
    - name: 'CloudBridge Monitoring'
      orgId: 1
      folder: 'CloudBridge'
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards/cloudbridge
    - name: 'BGP Monitoring'
      orgId: 1
      folder: 'BGP'
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards/bgp
    - name: 'SLO Monitoring'
      orgId: 1
      folder: 'SLO'
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards/slo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cloudbridge-overview
  namespace: monitoring
  labels:
    app.kubernetes.io/component: visualization
    app.kubernetes.io/instance: cloudbridge
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: cloudbridge-monitoring
data:
  cloudbridge-overview.json: |
    {
      "dashboard": {
        "id": null,
        "title": "CloudBridge Overview",
        "tags": ["cloudbridge", "overview", "monitoring"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "CloudBridge Services Status",
            "type": "stat",
            "targets": [
              {
                "expr": "up{job=~\"cloudbridge-.*\"}",
                "legendFormat": "{{ job }}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "thresholds": {
                  "steps": [
                    {
                      "color": "red",
                      "value": 0
                    },
                    {
                      "color": "green",
                      "value": 1
                    }
                  ]
                }
              }
            },
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 0,
              "y": 0
            }
          },
          {
            "id": 2,
            "title": "CloudBridge Request Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(cloudbridge_relay_requests_total[5m])",
                "legendFormat": "{{ instance }}",
                "refId": "A"
              }
            ],
            "gridPos": {
              "h": 8,
              "w": 12,
              "x": 12,
              "y": 0
            }
          },
          {
            "id": 3,
            "title": "CloudBridge Response Time",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(cloudbridge_relay_request_duration_seconds_bucket[5m]))",
                "legendFormat": "95th percentile",
                "refId": "A"
              },
              {
                "expr": "histogram_quantile(0.50, rate(cloudbridge_relay_request_duration_seconds_bucket[5m]))",
                "legendFormat": "50th percentile",
                "refId": "B"
              }
            ],
            "gridPos": {
              "h": 8,
              "w": 24,
              "x": 0,
              "y": 8
            }
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "30s"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-slo-overview
  namespace: monitoring
  labels:
    app.kubernetes.io/component: visualization
    app.kubernetes.io/instance: cloudbridge
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: cloudbridge-monitoring
data:
  slo-overview.json: |
    {
      "dashboard": {
        "id": null,
        "title": "CloudBridge SLO Overview",
        "tags": ["cloudbridge", "slo", "monitoring"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "SLO Status",
            "type": "stat",
            "targets": [
              {
                "expr": "sloth_sli_error_ratio{sloth_id=\"cloudbridge-relay-availability\"}",
                "legendFormat": "Relay Availability",
                "refId": "A"
              },
              {
                "expr": "sloth_sli_error_ratio{sloth_id=\"cloudbridge-bgp-availability\"}",
                "legendFormat": "BGP Availability",
                "refId": "B"
              },
              {
                "expr": "sloth_sli_error_ratio{sloth_id=\"cloudbridge-anycast-availability\"}",
                "legendFormat": "Anycast Availability",
                "refId": "C"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "thresholds": {
                  "steps": [
                    {
                      "color": "green",
                      "value": 0
                    },
                    {
                      "color": "yellow",
                      "value": 0.1
                    },
                    {
                      "color": "red",
                      "value": 0.5
                    }
                  ]
                }
              }
            },
            "gridPos": {
              "h": 8,
              "w": 24,
              "x": 0,
              "y": 0
            }
          },
          {
            "id": 2,
            "title": "Error Budget Consumption",
            "type": "graph",
            "targets": [
              {
                "expr": "sloth_slo_error_budget_ratio{sloth_id=\"cloudbridge-relay-availability\"}",
                "legendFormat": "Relay Error Budget",
                "refId": "A"
              },
              {
                "expr": "sloth_slo_error_budget_ratio{sloth_id=\"cloudbridge-bgp-availability\"}",
                "legendFormat": "BGP Error Budget",
                "refId": "B"
              },
              {
                "expr": "sloth_slo_error_budget_ratio{sloth_id=\"cloudbridge-anycast-availability\"}",
                "legendFormat": "Anycast Error Budget",
                "refId": "C"
              }
            ],
            "gridPos": {
              "h": 8,
              "w": 24,
              "x": 0,
              "y": 8
            }
          }
        ],
        "time": {
          "from": "now-7d",
          "to": "now"
        },
        "refresh": "30s"
      }
    }





