# VictoriaMetrics Cluster for CloudBridge
# Based on VictoriaMetrics reference implementation

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vmstorage
  namespace: monitoring
  labels:
    app.kubernetes.io/component: storage
    app.kubernetes.io/instance: cloudbridge
    app.kubernetes.io/name: victoriametrics
    app.kubernetes.io/part-of: cloudbridge-monitoring
spec:
  serviceName: vmstorage
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: storage
      app.kubernetes.io/instance: cloudbridge
      app.kubernetes.io/name: victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/component: storage
        app.kubernetes.io/instance: cloudbridge
        app.kubernetes.io/name: victoriametrics
        app.kubernetes.io/part-of: cloudbridge-monitoring
    spec:
      containers:
      - name: vmstorage
        image: victoriametrics/vmstorage:latest
        args:
        - -storageDataPath=/vmstorage-data
        - -retentionPeriod=1y
        - -httpListenAddr=:8482
        - -vminsertAddr=:8400
        - -vmselectAddr=:8401
        - -vmselectAddr=:8401
        ports:
        - name: http
          containerPort: 8482
        - name: vminsert
          containerPort: 8400
        - name: vmselect
          containerPort: 8401
        resources:
          requests:
            memory: 1Gi
            cpu: 200m
          limits:
            memory: 4Gi
            cpu: 1000m
        volumeMounts:
        - name: vmstorage-data
          mountPath: /vmstorage-data
        livenessProbe:
          httpGet:
            path: /health
            port: 8482
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8482
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: vmstorage-data
        persistentVolumeClaim:
          claimName: vmstorage-data
  volumeClaimTemplates:
  - metadata:
      name: vmstorage-data
    spec:
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vmstorage
  namespace: monitoring
  labels:
    app.kubernetes.io/component: storage
    app.kubernetes.io/instance: cloudbridge
    app.kubernetes.io/name: victoriametrics
spec:
  ports:
  - name: http
    port: 8482
    targetPort: 8482
  - name: vminsert
    port: 8400
    targetPort: 8400
  - name: vmselect
    port: 8401
    targetPort: 8401
  selector:
    app.kubernetes.io/component: storage
    app.kubernetes.io/instance: cloudbridge
    app.kubernetes.io/name: victoriametrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vminsert
  namespace: monitoring
  labels:
    app.kubernetes.io/component: insert
    app.kubernetes.io/instance: cloudbridge
    app.kubernetes.io/name: victoriametrics
    app.kubernetes.io/part-of: cloudbridge-monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: insert
      app.kubernetes.io/instance: cloudbridge
      app.kubernetes.io/name: victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/component: insert
        app.kubernetes.io/instance: cloudbridge
        app.kubernetes.io/name: victoriametrics
        app.kubernetes.io/part-of: cloudbridge-monitoring
    spec:
      containers:
      - name: vminsert
        image: victoriametrics/vminsert:latest
        args:
        - -storageNode=vmstorage-0.vmstorage:8400
        - -storageNode=vmstorage-1.vmstorage:8400
        - -storageNode=vmstorage-2.vmstorage:8400
        - -httpListenAddr=:8480
        - -maxInsertRequestSize=33554432
        ports:
        - name: http
          containerPort: 8480
        resources:
          requests:
            memory: 512Mi
            cpu: 100m
          limits:
            memory: 2Gi
            cpu: 500m
        livenessProbe:
          httpGet:
            path: /health
            port: 8480
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8480
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vminsert
  namespace: monitoring
  labels:
    app.kubernetes.io/component: insert
    app.kubernetes.io/instance: cloudbridge
    app.kubernetes.io/name: victoriametrics
spec:
  ports:
  - name: http
    port: 8480
    targetPort: 8480
  selector:
    app.kubernetes.io/component: insert
    app.kubernetes.io/instance: cloudbridge
    app.kubernetes.io/name: victoriametrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmselect
  namespace: monitoring
  labels:
    app.kubernetes.io/component: select
    app.kubernetes.io/instance: cloudbridge
    app.kubernetes.io/name: victoriametrics
    app.kubernetes.io/part-of: cloudbridge-monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: select
      app.kubernetes.io/instance: cloudbridge
      app.kubernetes.io/name: victoriametrics
  template:
    metadata:
      labels:
        app.kubernetes.io/component: select
        app.kubernetes.io/instance: cloudbridge
        app.kubernetes.io/name: victoriametrics
        app.kubernetes.io/part-of: cloudbridge-monitoring
    spec:
      containers:
      - name: vmselect
        image: victoriametrics/vmselect:latest
        args:
        - -storageNode=vmstorage-0.vmstorage:8401
        - -storageNode=vmstorage-1.vmstorage:8401
        - -storageNode=vmstorage-2.vmstorage:8401
        - -httpListenAddr=:8481
        - -maxConcurrentRequests=1000
        ports:
        - name: http
          containerPort: 8481
        resources:
          requests:
            memory: 1Gi
            cpu: 200m
          limits:
            memory: 4Gi
            cpu: 1000m
        livenessProbe:
          httpGet:
            path: /health
            port: 8481
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8481
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: vmselect
  namespace: monitoring
  labels:
    app.kubernetes.io/component: select
    app.kubernetes.io/instance: cloudbridge
    app.kubernetes.io/name: victoriametrics
spec:
  ports:
  - name: http
    port: 8481
    targetPort: 8481
  selector:
    app.kubernetes.io/component: select
    app.kubernetes.io/instance: cloudbridge
    app.kubernetes.io/name: victoriametrics





