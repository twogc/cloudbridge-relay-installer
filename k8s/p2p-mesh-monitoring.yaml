apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudbridge-p2p-mesh
  namespace: cloudbridge-monitoring
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: p2p-mesh
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudbridge-relay
      app.kubernetes.io/component: relay
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
    - cloudbridge
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: p2p-mesh-dashboard
  namespace: cloudbridge-monitoring
  labels:
    grafana_dashboard: "1"
data:
  p2p-mesh-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "CloudBridge P2P Mesh Monitoring",
        "tags": ["cloudbridge", "p2p", "wireguard", "quic"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "P2P Connections",
            "type": "stat",
            "targets": [
              {
                "expr": "cloudbridge_p2p_connections_total",
                "legendFormat": "Total Connections"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "thresholds": {
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "yellow", "value": 50},
                    {"color": "red", "value": 100}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "WireGuard Peers",
            "type": "stat",
            "targets": [
              {
                "expr": "cloudbridge_wireguard_peers_total",
                "legendFormat": "Active Peers"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "thresholds": {
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "yellow", "value": 20},
                    {"color": "red", "value": 50}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "QUIC Connections",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(cloudbridge_quic_connections_total[5m])",
                "legendFormat": "QUIC Connections/sec"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "WireGuard Handshakes",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(cloudbridge_wireguard_handshakes_total[5m])",
                "legendFormat": "Handshakes/sec"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}
          },
          {
            "id": 5,
            "title": "P2P Traffic",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(cloudbridge_p2p_bytes_received_total[5m])",
                "legendFormat": "Bytes Received/sec"
              },
              {
                "expr": "rate(cloudbridge_p2p_bytes_sent_total[5m])",
                "legendFormat": "Bytes Sent/sec"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}
          },
          {
            "id": 6,
            "title": "Peer Latency",
            "type": "graph",
            "targets": [
              {
                "expr": "cloudbridge_peer_latency_seconds",
                "legendFormat": "{{peer}}"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 24}
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "30s"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-p2p-rules
  namespace: cloudbridge-monitoring
data:
  p2p-mesh-rules.yml: |
    groups:
    - name: cloudbridge-p2p-mesh
      rules:
      - alert: P2PConnectionHigh
        expr: cloudbridge_p2p_connections_total > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High number of P2P connections"
          description: "P2P connections count is {{ $value }}, which is above threshold"
      
      - alert: WireGuardPeerDown
        expr: cloudbridge_wireguard_peers_total < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No WireGuard peers available"
          description: "WireGuard peer count is {{ $value }}"
      
      - alert: QUICConnectionFailure
        expr: rate(cloudbridge_quic_connection_failures_total[5m]) > 0.1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High QUIC connection failure rate"
          description: "QUIC connection failure rate is {{ $value }} failures/sec"
      
      - alert: P2PTrafficAnomaly
        expr: rate(cloudbridge_p2p_bytes_total[5m]) > 1000000
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Unusual P2P traffic pattern"
          description: "P2P traffic rate is {{ $value }} bytes/sec"

