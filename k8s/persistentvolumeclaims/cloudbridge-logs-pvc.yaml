apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudbridge-logs-pvc
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Persistent volume for CloudBridge relay logs"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-ssd  # Use 'standard' for development/minikube
  resources:
    requests:
      storage: 10Gi
  # Optional: Volume selector for specific PV
  # selector:
  #   matchLabels:
  #     type: ssd
