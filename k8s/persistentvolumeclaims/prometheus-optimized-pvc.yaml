apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-optimized-pvc
  namespace: cloudbridge-monitoring
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/version: 2.45.0
    storage-type: optimized
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: prometheus-optimized-storage
