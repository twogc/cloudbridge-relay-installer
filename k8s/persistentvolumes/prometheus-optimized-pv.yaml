apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-optimized-pv
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/version: 2.45.0
    storage-type: optimized
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: prometheus-optimized-storage
  hostPath:
    path: /data/prometheus
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - minikube
