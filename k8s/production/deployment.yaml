apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbridge-relay-production
  namespace: cloudbridge-production
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubernetes
    environment: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudbridge-relay
      app.kubernetes.io/instance: production
      environment: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudbridge-relay
        app.kubernetes.io/instance: production
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: cloudbridge-relay
        app.kubernetes.io/managed-by: kubernetes
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: cloudbridge-relay-production
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudbridge-relay
          image: cloudbridge-relay:production
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
            - name: http-udp
              containerPort: 9090
              protocol: UDP
            - name: wireguard
              containerPort: 51820
              protocol: UDP
            - name: metrics
              containerPort: 8084
              protocol: TCP
          env:
            - name: CONFIG_PATH
              value: "/app/configs/config.json"
            - name: LOG_LEVEL
              value: "info"
            - name: WIREGUARD_ENABLED
              value: "true"
            - name: GIN_MODE
              value: "release"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - SYS_MODULE
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
            - name: wireguard-config
              mountPath: /etc/wireguard
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: var-run
              mountPath: /var/run
            - name: var-log
              mountPath: /var/log/cloudbridge-relay
      volumes:
        - name: config
          configMap:
            name: cloudbridge-relay-production-config
        - name: wireguard-config
          configMap:
            name: cloudbridge-relay-wireguard-config
            optional: true
        - name: tmp
          emptyDir: {}
        - name: var-run
          emptyDir: {}
        - name: var-log
          emptyDir: {}
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - cloudbridge-relay
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
