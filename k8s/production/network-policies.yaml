apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudbridge-production-network-policy
  namespace: cloudbridge-production
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubernetes
    environment: production
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudbridge-relay
      environment: production
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {} # Allow all pods within the same namespace (for internal communication)
        - namespaceSelector:
            matchLabels:
              name: monitoring-production # Allow traffic from monitoring namespace
        - namespaceSelector:
            matchLabels:
              name: kube-system # Allow traffic from kube-system (for health checks, etc.)
      ports:
        - protocol: TCP
          port: 9090 # Allow HTTP/QUIC
        - protocol: UDP
          port: 9090 # Allow HTTP/QUIC
        - protocol: UDP
          port: 51820 # Allow WireGuard
        - protocol: TCP
          port: 8084 # Allow Metrics
    - from: [] # Deny all other ingress by default
  egress:
    - to:
        - podSelector: {} # Allow all pods within the same namespace
        - namespaceSelector: {} # Allow all namespaces (for external services like Cassandra, Cadence, etc.)
      ports:
        - protocol: TCP
          port: 9042 # Cassandra
        - protocol: TCP
          port: 7933 # Cadence Frontend
        - protocol: TCP
          port: 7934 # Cadence History
        - protocol: TCP
          port: 7935 # Cadence Matching
        - protocol: TCP
          port: 7939 # Cadence Worker
        - protocol: TCP
          port: 8084 # Metrics (if scraping other services)
        - protocol: TCP
          port: 9090 # Internal HTTP/QUIC
        - protocol: UDP
          port: 9090 # Internal HTTP/QUIC
        - protocol: UDP
          port: 51820 # Internal WireGuard
        - protocol: TCP
          port: 53 # DNS
        - protocol: UDP
          port: 53 # DNS
        - protocol: TCP
          port: 443 # HTTPS
        - protocol: TCP
          port: 80 # HTTP
    - to: [] # Deny all other egress by default
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudbridge-production-deny-all
  namespace: cloudbridge-production
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubernetes
    environment: production
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: [] # Deny all ingress
  egress: []  # Deny all egress

