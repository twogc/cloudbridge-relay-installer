apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudbridge-relay-production-pdb
  namespace: cloudbridge-production
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: availability
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubernetes
    environment: production
spec:
  minAvailable: 2 # Ensure at least 2 pods are available (out of 3 total)
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudbridge-relay
      app.kubernetes.io/instance: production
      environment: production

