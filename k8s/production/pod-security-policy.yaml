apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: cloudbridge-relay-production-psp
  namespace: cloudbridge-production
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubernetes
    environment: production
  annotations:
    seccomp.security.alpha.kubernetes.io/defaultProfileName: 'runtime/default'
    apparmor.security.beta.kubernetes.io/defaultProfileName: 'runtime/default'
spec:
  privileged: false # Don't allow privileged pods
  # Required to prevent escalations to root.
  allowPrivilegeEscalation: false
  # This is required for containers running with readOnlyRootFilesystem=true
  readOnlyRootFilesystem: true
  # The user ID that containers must run as.
  runAsUser:
    rule: 'MustRunAsNonRoot'
  # The group ID that containers must run as.
  runAsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1000
        max: 1000
  # The group ID for the volume that containers must run as.
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1000
        max: 1000
  # The capabilities that containers can request.
  requiredDropCapabilities:
    - ALL
  allowedCapabilities:
    - NET_ADMIN
    - SYS_MODULE
  # Allow all volume types
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  hostNetwork: false
  hostPID: false
  hostIPC: false
  seLinux:
    rule: 'RunAsAny'
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
      - min: 1000
        max: 1000
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudbridge-relay-production-psp
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubernetes
    environment: production
rules:
  - apiGroups: ['policy']
    resources: ['podsecuritypolicies']
    verbs: ['use']
    resourceNames:
      - cloudbridge-relay-production-psp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudbridge-relay-production-psp
  namespace: cloudbridge-production
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubernetes
    environment: production
roleRef:
  kind: ClusterRole
  name: cloudbridge-relay-production-psp
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: cloudbridge-relay-production
    namespace: cloudbridge-production

