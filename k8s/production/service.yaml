apiVersion: v1
kind: Service
metadata:
  name: cloudbridge-relay-production-service
  namespace: cloudbridge-production
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubernetes
    environment: production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/instance: production
    environment: production
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
    - name: http-udp
      port: 9090
      targetPort: 9090
      protocol: UDP
    - name: wireguard
      port: 51820
      targetPort: 51820
      protocol: UDP
    - name: metrics
      port: 8084
      targetPort: 8084
      protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: cloudbridge-relay-production-internal
  namespace: cloudbridge-production
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/instance: production
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubernetes
    environment: production
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/instance: production
    environment: production
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
    - name: http-udp
      port: 9090
      targetPort: 9090
      protocol: UDP
    - name: wireguard
      port: 51820
      targetPort: 51820
      protocol: UDP
    - name: metrics
      port: 8084
      targetPort: 8084
      protocol: TCP
  sessionAffinity: None

