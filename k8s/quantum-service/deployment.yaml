apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantum-service
  namespace: cloudbridge-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quantum-service
  template:
    metadata:
      labels:
        app: quantum-service
    spec:
      containers:
      - name: quantum-service
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http

        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"
          requests:
            cpu: "10m"
            memory: "32Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: quantum-service
  namespace: cloudbridge-relay
spec:
  type: ClusterIP
  ports:
  - port: 8094
    targetPort: 80
    name: http
  selector:
    app: quantum-service
