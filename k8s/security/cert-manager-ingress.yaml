# Main CloudBridge Ingress with cert-manager TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudbridge-main-ingress
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: ingress
  annotations:
    # cert-manager annotations
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    cert-manager.io/acme-challenge-type: "http01"
    # nginx annotations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-RSA-AES128-GCM-SHA256,ECDHE-RSA-AES256-GCM-SHA384,ECDHE-RSA-AES128-SHA256,ECDHE-RSA-AES256-SHA384"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"
    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'";
spec:
  tls:
  - hosts:
    - "2gc.ru"
    - "*.2gc.ru"
    - "relay.2gc.ru"
    - "masque.2gc.ru"
    - "p2p.2gc.ru"
    - "admin.2gc.ru"
    - "monitor.2gc.ru"
    - "api.2gc.ru"
    secretName: cloudbridge-main-tls
  rules:
  # Main domain
  - host: "2gc.ru"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 8080
  # Relay subdomain
  - host: "relay.2gc.ru"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 8080
  # MASQUE subdomain
  - host: "masque.2gc.ru"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-masque-service
            port:
              number: 8080
  # P2P subdomain
  - host: "p2p.2gc.ru"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-p2p-service
            port:
              number: 8080
  # Admin subdomain
  - host: "admin.2gc.ru"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-admin-service
            port:
              number: 8080
  # Monitor subdomain
  - host: "monitor.2gc.ru"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-monitoring-service
            port:
              number: 8080
  # API subdomain
  - host: "api.2gc.ru"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-api-service
            port:
              number: 8080
---
# Zitadel Ingress with separate certificate
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudbridge-zitadel-ingress
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/component: ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    cert-manager.io/acme-challenge-type: "http01"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"
spec:
  tls:
  - hosts:
    - "auth.2gc.ru"
    - "zitadel.2gc.ru"
    secretName: cloudbridge-zitadel-tls
  rules:
  - host: "auth.2gc.ru"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zitadel-service
            port:
              number: 8080
  - host: "zitadel.2gc.ru"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zitadel-service
            port:
              number: 8080
---
# Monitoring Ingress with separate certificate
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudbridge-monitoring-ingress
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/component: ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    cert-manager.io/acme-challenge-type: "http01"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"
spec:
  tls:
  - hosts:
    - "monitor.2gc.ru"
    - "prometheus.2gc.ru"
    - "grafana.2gc.ru"
    secretName: cloudbridge-monitoring-tls
  rules:
  - host: "monitor.2gc.ru"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus-service
            port:
              number: 9090
  - host: "prometheus.2gc.ru"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus-service
            port:
              number: 9090
  - host: "grafana.2gc.ru"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port:
              number: 3000
