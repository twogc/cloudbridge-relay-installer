# External Secrets Operator Setup
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets-system
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: external-secrets-system
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: operator
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["external-secrets.io"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets
subjects:
- kind: ServiceAccount
  name: external-secrets
  namespace: external-secrets-system
---
# SecretStore for Vault (if available)
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-secret-store
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: secrets
spec:
  provider:
    vault:
      server: "https://vault.2gc.ru:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "cloudbridge-relay"
          serviceAccountRef:
            name: cloudbridge-relay
            namespace: cloudbridge
---
# SecretStore for AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secret-store
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: "eu-west-1"
      auth:
        secretRef:
          accessKeyID:
            name: aws-credentials
            key: access-key-id
          secretAccessKey:
            name: aws-credentials
            key: secret-access-key
---
# SecretStore for Google Secret Manager
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-store
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: secrets
spec:
  provider:
    gcpsm:
      projectId: "cloudbridge-2gc"
      auth:
        secretRef:
          credentials:
            name: gcp-credentials
            key: credentials.json
---
# External Secret for Database credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudbridge-database-secret
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: database
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: cloudbridge-database
    creationPolicy: Owner
  data:
  - secretKey: url
    remoteRef:
      key: database/cloudbridge
      property: url
  - secretKey: username
    remoteRef:
      key: database/cloudbridge
      property: username
  - secretKey: password
    remoteRef:
      key: database/cloudbridge
      property: password
  - secretKey: ssl-mode
    remoteRef:
      key: database/cloudbridge
      property: ssl-mode
---
# External Secret for Zitadel credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudbridge-zitadel-secret
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: zitadel
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: cloudbridge-zitadel
    creationPolicy: Owner
  data:
  - secretKey: client-id
    remoteRef:
      key: zitadel/cloudbridge
      property: client-id
  - secretKey: client-secret
    remoteRef:
      key: zitadel/cloudbridge
      property: client-secret
  - secretKey: issuer
    remoteRef:
      key: zitadel/cloudbridge
      property: issuer
  - secretKey: audience
    remoteRef:
      key: zitadel/cloudbridge
      property: audience
---
# External Secret for API keys
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudbridge-api-keys
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: api
spec:
  refreshInterval: "24h"
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: cloudbridge-api-keys
    creationPolicy: Owner
  data:
  - secretKey: telegram-bot-token
    remoteRef:
      key: api/telegram
      property: bot-token
  - secretKey: openai-api-key
    remoteRef:
      key: api/openai
      property: api-key
  - secretKey: cloudflare-api-token
    remoteRef:
      key: api/cloudflare
      property: api-token
---
# External Secret for monitoring credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudbridge-monitoring-secret
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: monitoring
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: cloudbridge-monitoring
    creationPolicy: Owner
  data:
  - secretKey: grafana-admin-password
    remoteRef:
      key: monitoring/grafana
      property: admin-password
  - secretKey: prometheus-basic-auth
    remoteRef:
      key: monitoring/prometheus
      property: basic-auth
  - secretKey: alertmanager-webhook-url
    remoteRef:
      key: monitoring/alertmanager
      property: webhook-url
---
# External Secret for WireGuard keys
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: cloudbridge-wireguard-secret
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: wireguard
spec:
  refreshInterval: "168h" # 7 days
  secretStoreRef:
    name: vault-secret-store
    kind: SecretStore
  target:
    name: wireguard-keys
    creationPolicy: Owner
  data:
  - secretKey: private-key
    remoteRef:
      key: wireguard/cloudbridge
      property: private-key
  - secretKey: public-key
    remoteRef:
      key: wireguard/cloudbridge
      property: public-key
  - secretKey: preshared-key
    remoteRef:
      key: wireguard/cloudbridge
      property: preshared-key
---
# ClusterSecretStore for cross-namespace access
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-cluster-secret-store
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: cluster-store
spec:
  provider:
    vault:
      server: "https://vault.2gc.ru:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "cloudbridge-relay"
          serviceAccountRef:
            name: cloudbridge-relay
            namespace: cloudbridge
