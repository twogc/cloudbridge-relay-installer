apiVersion: v1
kind: Secret
metadata:
  name: grpc-client-certs
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: security
    app.kubernetes.io/instance: client
type: Opaque
data:
  # Client Certificate (PEM encoded, base64 wrapped)
  # Generated with: openssl req -new -key client-key.pem -out client.csr
  #                 openssl x509 -req -in client.csr -CA ca.pem -CAkey ca-key.pem -out client.pem -days 365 -CAcreateserial
  client.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSURRVENDQWltZ0F3SUJBZ0lKQU1aK2p5WmQ2TzBETUEwR0NTcUdTSWIzRFFFQkN3VUFNREVMTUE4R0ExVUUKQ0F3SUV4QVFVTU1GdmgKLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQo=
  # Client Private Key (PEM encoded, base64 wrapped)
  # Generated with: openssl genrsa -out client-key.pem 2048
  client.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCk1JSUV2Z0lCQURBTkJna3Foa2lHOXcwQkFRRUZBQVNDQktnd2dnU2tBZ0VBQW9JQkFRRExScDI2b3NiR2pmbjEKLS0tLS1FTkQgUFJJVkFURSBLRVktLS0tLQo=
