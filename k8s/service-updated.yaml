apiVersion: v1
kind: Service
metadata:
  name: cloudbridge-relay-service
  namespace: cloudbridge-relay
  labels:
    app: cloudbridge-relay
spec:
  type: LoadBalancer
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http-api
  - port: 8082
    targetPort: 8082
    protocol: TCP
    name: p2p-api
  - port: 8443
    targetPort: 8443
    protocol: TCP
    name: https-masque
  - port: 9090
    targetPort: 9090
    protocol: UDP
    name: quic-transport
  - port: 5553
    targetPort: 5553
    protocol: UDP
    name: p2p-quic
  - port: 9092
    targetPort: 9092
    protocol: UDP
    name: enhanced-quic
  - port: 19302
    targetPort: 19302
    protocol: UDP
    name: stun-server
  selector:
    app: cloudbridge-relay
---
apiVersion: v1
kind: Service
metadata:
  name: cloudbridge-relay-headless
  namespace: cloudbridge-relay
  labels:
    app: cloudbridge-relay
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http-api
  - port: 8082
    targetPort: 8082
    protocol: TCP
    name: p2p-api
  - port: 8443
    targetPort: 8443
    protocol: TCP
    name: https-masque
  - port: 9090
    targetPort: 9090
    protocol: UDP
    name: quic-transport
  - port: 5553
    targetPort: 5553
    protocol: UDP
    name: p2p-quic
  - port: 9092
    targetPort: 9092
    protocol: UDP
    name: enhanced-quic
  - port: 19302
    targetPort: 19302
    protocol: UDP
    name: stun-server
  selector:
    app: cloudbridge-relay
