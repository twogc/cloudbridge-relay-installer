apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: ai
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8083
    targetPort: 8083
    protocol: TCP
  - name: metrics
    port: 8084
    targetPort: 8084
    protocol: TCP
  selector:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/component: ai
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service-nodeport
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: ai
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
spec:
  type: NodePort
  ports:
  - name: http
    port: 8083
    targetPort: 8083
    nodePort: 30083
    protocol: TCP
  - name: metrics
    port: 8084
    targetPort: 8084
    nodePort: 30084
    protocol: TCP
  selector:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/component: ai
---
apiVersion: v1
kind: Service
metadata:
  name: ai-worker
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: ai-worker
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: ai-worker
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 8085
    targetPort: 8085
    protocol: TCP
  selector:
    app.kubernetes.io/name: ai-worker
    app.kubernetes.io/component: ai-worker

