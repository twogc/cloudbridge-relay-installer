apiVersion: v1
kind: Service
metadata:
  name: cloudbridge-https-nodeport
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: relay
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: relay
  ports:
  - name: https
    port: 9091
    targetPort: 9091
    protocol: TCP
    nodePort: 32443
