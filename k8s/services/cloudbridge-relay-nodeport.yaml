apiVersion: v1
kind: Service
metadata:
  name: cloudbridge-relay-nodeport
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: relay
    app.kubernetes.io/part-of: cloudbridge-relay
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: relay
  ports:
  - name: relay-tcp
    port: 9090
    targetPort: 9090
    protocol: TCP
    nodePort: 30990
  - name: quic-udp
    port: 9090
    targetPort: 9090
    protocol: UDP
    nodePort: 30991
  - name: wireguard-udp
    port: 51820
    targetPort: 51820
    protocol: UDP
    nodePort: 31820
  - name: p2p-api-tcp
    port: 8082
    targetPort: 8082
    protocol: TCP
    nodePort: 30882

