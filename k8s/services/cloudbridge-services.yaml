    app.kubernetes.io/component: relay
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    protocol: TCP
  - name: quic
    port: 9090
    targetPort: 9090
    protocol: UDP
  - name: wireguard
    port: 51820
    targetPort: 51820
    protocol: UDP
  - name: metrics
    port: 5551
    targetPort: 5551
    protocol: TCP
  selector:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: relay
---
