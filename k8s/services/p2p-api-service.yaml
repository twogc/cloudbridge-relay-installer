apiVersion: v1
kind: Service
metadata:
  name: p2p-api-service
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: p2p-api
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: p2p-api
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8082"
    prometheus.io/path: "/health"
spec:
  type: NodePort
  sessionAffinity: ClientIP
  ports:
  - name: p2p-api
    port: 8082
    targetPort: 8082
    protocol: TCP
    nodePort: 30084
  selector:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: relay
---
apiVersion: v1
kind: Service
metadata:
  name: p2p-api-loadbalancer
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: p2p-api
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: p2p-api
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP
  ports:
  - name: p2p-api
    port: 8082
    targetPort: 8082
    protocol: TCP
  selector:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: relay
