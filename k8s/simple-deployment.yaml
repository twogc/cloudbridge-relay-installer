apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbridge-relay
  namespace: cloudbridge
  labels:
    app: cloudbridge-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudbridge-relay
  template:
    metadata:
      labels:
        app: cloudbridge-relay
    spec:
      containers:
      - name: cloudbridge-relay
        image: cloudbridge-relay:security-fixed-20250920-093827-b65ac2ca
        imagePullPolicy: Never  # For minikube local images
        ports:
        - containerPort: 8080
          name: http-api
          protocol: TCP
        - containerPort: 8082
          name: p2p-api
          protocol: TCP
        - containerPort: 8443
          name: https-masque
          protocol: TCP
        - containerPort: 9090
          name: quic-transport
          protocol: UDP
        - containerPort: 9092
          name: enhanced-quic
          protocol: UDP
        - containerPort: 19302
          name: stun-server
          protocol: UDP
        env:
        - name: SERVER_HOST
          value: "0.0.0.0"
        - name: SERVER_PORT
          value: "8080"
        - name: LOG_LEVEL
          value: "info"
        - name: P2P_ENABLED
          value: "true"
        - name: ICE_ENABLED
          value: "true"
        - name: MASQUE_ENABLED
          value: "true"
        - name: RELAY_JWT_SECRET
          value: "85Sk/NfLq3gqzCXzmBKbJCpL+f5BssXz3G8dVi3sPiE="
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
