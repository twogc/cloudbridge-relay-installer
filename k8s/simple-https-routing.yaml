apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudbridge-simple-ingress
  namespace: cloudbridge
  annotations:
    # Nginx Ingress Controller - упрощенная конфигурация
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    
    # WebSocket поддержка
    nginx.ingress.kubernetes.io/websocket-services: "cloudbridge-relay-external"
    
    # Самоподписанный сертификат (для тестирования)
    nginx.ingress.kubernetes.io/ssl-certificate: "cloudbridge/cloudbridge-2gc-ru-tls"
    
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - "relay.2gc.ru"
    - "masque.2gc.ru" 
    - "p2p.2gc.ru"
    - "admin.2gc.ru"
    - "monitor.2gc.ru"
    - "api.2gc.ru"
    secretName: cloudbridge-2gc-ru-tls
    
  rules:
  # Основной relay сервис
  - host: relay.2gc.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5552
              
  # MASQUE протокол
  - host: masque.2gc.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5552
              
  # P2P API
  - host: p2p.2gc.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5552
              
  # Admin интерфейс
  - host: admin.2gc.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5552
              
  # API Gateway
  - host: api.2gc.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cloudbridge-relay-external
            port:
              number: 5552
