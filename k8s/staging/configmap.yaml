# Staging Environment ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudbridge-staging-config
  namespace: cloudbridge-staging
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: staging
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
    environment: staging
data:
  # Application Configuration
  config.json: |
    {
      "server": {
        "host": "0.0.0.0",
        "port": 9090,
        "tls": {
          "enabled": true,
          "cert_file": "/app/certs/server.crt",
          "key_file": "/app/certs/server.key"
        }
      },
      "api": {
        "host": "0.0.0.0",
        "port": 9091,
        "cors": {
          "enabled": true,
          "origins": ["*"]
        }
      },
      "metrics": {
        "enabled": true,
        "port": 8084,
        "path": "/metrics"
      },
      "logging": {
        "level": "debug",
        "format": "json",
        "output": "stdout"
      },
      "database": {
        "type": "cassandra",
        "hosts": ["cassandra-staging-service"],
        "port": 9042,
        "keyspace": "cloudbridge_staging",
        "replication_factor": 1
      },
      "cadence": {
        "host": "cadence-staging-service",
        "port": 7933,
        "domain": "cloudbridge-staging"
      },
      "wireguard": {
        "enabled": true,
        "port": 51820,
        "interface": {
          "name": "wg0",
          "listen_port": 51820,
          "address": "10.0.0.1/24"
        }
      },
      "quic": {
        "enabled": true,
        "port": 9090,
        "max_streams": 100
      },
      "ai": {
        "enabled": true,
        "model_path": "/app/models",
        "batch_size": 32
      },
      "quantum": {
        "enabled": false,
        "algorithm": "kyber512"
      },
      "monitoring": {
        "enabled": true,
        "prometheus": {
          "enabled": true,
          "port": 8084
        },
        "health_check": {
          "enabled": true,
          "interval": "30s"
        }
      },
      "security": {
        "jwt": {
          "secret_key": "staging-jwt-secret-key-change-in-production",
          "expiration": "24h"
        },
        "rate_limiting": {
          "enabled": true,
          "requests_per_minute": 1000
        }
      },
      "staging": {
        "enabled": true,
        "debug_mode": true,
        "mock_external_services": true,
        "test_data_enabled": true
      },
      "django": {
        "api_endpoint": "http://localhost:8000/api",
        "enabled": true,
        "jwt_secret": "staging-django-jwt-secret-key"
      },
      "keycloak": {
        "enabled": false,
        "url": "http://localhost:8080",
        "realm": "cloudbridge"
      }
    }
  
  # Environment-specific settings
  environment: "staging"
  debug_mode: "true"
  log_level: "debug"
  
  # Staging-specific configurations
  staging_config.yaml: |
    staging:
      enabled: true
      debug_mode: true
      mock_external_services: true
      test_data_enabled: true
      performance_testing: true
      
    features:
      experimental_features: true
      beta_features: true
      debug_endpoints: true
      
    testing:
      load_testing_enabled: true
      stress_testing_enabled: true
      integration_testing: true
      
    monitoring:
      detailed_metrics: true
      debug_logging: true
      performance_profiling: true
