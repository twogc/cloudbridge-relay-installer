# Staging Environment Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudbridge-relay-staging
  namespace: cloudbridge-staging
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: staging
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
    environment: staging
spec:
  replicas: 2  # Reduced replicas for staging
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudbridge-relay
      app.kubernetes.io/component: staging
      environment: staging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudbridge-relay
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: staging
        app.kubernetes.io/part-of: cloudbridge-relay
        app.kubernetes.io/managed-by: kubectl
        environment: staging
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: "/metrics"
        # Staging-specific annotations
        staging.cloudbridge.io/debug-mode: "true"
        staging.cloudbridge.io/test-data: "enabled"
    spec:
      serviceAccountName: cloudbridge-staging
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: cloudbridge-relay
        image: cloudbridge-relay:staging
        imagePullPolicy: IfNotPresent  # Use local image
        ports:
        - name: http
          containerPort: 9090
          protocol: TCP
        - name: quic
          containerPort: 9090
          protocol: UDP
        - name: wireguard
          containerPort: 51820
          protocol: UDP
        - name: metrics
          containerPort: 8084
          protocol: TCP
        env:
        - name: ENVIRONMENT
          value: "staging"
        - name: CONFIG_PATH
          value: "/app/configs/config.json"
        - name: LOG_LEVEL
          value: "debug"
        - name: GIN_MODE
          value: "debug"
        - name: TZ
          value: "UTC"
        - name: DEBUG_MODE
          value: "true"
        - name: STAGING_MODE
          value: "true"
        - name: CASSANDRA_HOSTS
          value: "cassandra-staging-service"
        - name: CASSANDRA_PORT
          value: "9042"
        - name: CASSANDRA_KEYSPACE
          value: "cloudbridge_staging"
        - name: CASSANDRA_USERNAME
          valueFrom:
            secretKeyRef:
              name: cloudbridge-staging-secrets
              key: cassandra-username
        - name: CASSANDRA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cloudbridge-staging-secrets
              key: cassandra-password
        - name: CADENCE_HOST
          value: "cadence-staging-service"
        - name: CADENCE_PORT
          value: "7933"
        - name: CADENCE_DOMAIN
          value: "cloudbridge-staging"
        - name: WIREGUARD_ENABLED
          value: "true"
        - name: WIREGUARD_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: wireguard-staging-keys
              key: private-key
        - name: WIREGUARD_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: wireguard-staging-keys
              key: public-key
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: cloudbridge-staging-secrets
              key: api-key
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: cloudbridge-staging-secrets
              key: jwt-secret
        - name: MOCK_EXTERNAL_SERVICES
          value: "true"
        - name: TEST_DATA_ENABLED
          value: "true"
        resources:
          requests:
            memory: "256Mi"  # Reduced resources for staging
            cpu: "125m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        volumeMounts:
        - name: config
          mountPath: /app/configs
          readOnly: true
        - name: logs
          mountPath: /app/logs
        - name: wireguard-config
          mountPath: /etc/wireguard
          readOnly: true
        - name: tls-certs
          mountPath: /app/certs
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
            add:
            - NET_ADMIN
            - NET_RAW
      volumes:
      - name: config
        configMap:
          name: cloudbridge-staging-config
      - name: logs
        emptyDir: {}  # Use emptyDir for staging logs
      - name: wireguard-config
        secret:
          secretName: wireguard-staging-keys
      - name: tls-certs
        secret:
          secretName: cloudbridge-staging-tls
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - cloudbridge-relay
              topologyKey: kubernetes.io/hostname

---
# Staging ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudbridge-staging
  namespace: cloudbridge-staging
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: staging
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
    environment: staging

---
# Staging Role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudbridge-staging
  namespace: cloudbridge-staging
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: staging
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
    environment: staging
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]

---
# Staging RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudbridge-staging
  namespace: cloudbridge-staging
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: staging
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
    environment: staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudbridge-staging
subjects:
- kind: ServiceAccount
  name: cloudbridge-staging
  namespace: cloudbridge-staging
