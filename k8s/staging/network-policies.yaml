apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudbridge-staging-network-policy
  namespace: cloudbridge-staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudbridge-relay
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow health checks from kubelet
  - from:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 9090
  # Allow internal communication within namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge-staging
    ports:
    - protocol: TCP
      port: 9090
    - protocol: UDP
      port: 51820
    - protocol: UDP
      port: 9090
  # Allow metrics scraping from monitoring namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8084
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow HTTPS traffic for external APIs
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow HTTP traffic for external APIs (if needed)
  - to: []
    ports:
    - protocol: TCP
      port: 80
  # Allow internal communication within namespace
  - to:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge-staging
    ports:
    - protocol: TCP
      port: 9090
    - protocol: UDP
      port: 51820
    - protocol: UDP
      port: 9090
  # Allow communication with Cadence (if in same cluster)
  - to:
    - namespaceSelector:
        matchLabels:
          name: cadence
    ports:
    - protocol: TCP
      port: 7933
    - protocol: TCP
      port: 7934
  # Allow communication with Cassandra (if in same cluster)
  - to:
    - namespaceSelector:
        matchLabels:
          name: cassandra
    ports:
    - protocol: TCP
      port: 9042
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudbridge-staging-deny-all
  namespace: cloudbridge-staging
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress: []

