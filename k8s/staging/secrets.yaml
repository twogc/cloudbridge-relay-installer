# Staging Environment Secrets
apiVersion: v1
kind: Secret
metadata:
  name: cloudbridge-staging-secrets
  namespace: cloudbridge-staging
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: staging
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
    environment: staging
type: Opaque
data:
  # Base64 encoded secrets (use staging-specific values)
  # Note: In production, these should be generated securely
  api-key: c3RhZ2luZy1hcGkta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9u
  jwt-secret: c3RhZ2luZy1qd3Qtc2VjcmV0LWNoYW5nZS1pbi1wcm9kdWN0aW9u
  cassandra-username: Y2Fzc2FuZHJh
  cassandra-password: c3RhZ2luZy1wYXNzd29yZA==
  database-url: c3RhZ2luZy1kYXRhYmFzZS11cmw=
  encryption-key: c3RhZ2luZy1lbmNyeXB0aW9uLWtleQ==
  
  # Staging-specific secrets
  staging-api-key: c3RhZ2luZy1zcGVjaWZpYy1hcGkta2V5
  test-jwt-secret: dGVzdC1qd3Qtc2VjcmV0
  mock-service-token: bW9jay1zZXJ2aWNlLXRva2Vu

---
# WireGuard Keys for Staging
apiVersion: v1
kind: Secret
metadata:
  name: wireguard-staging-keys
  namespace: cloudbridge-staging
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: staging
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
    environment: staging
type: Opaque
data:
  # WireGuard keys (staging-specific)
  private-key: c3RhZ2luZy13aXJlZ3VhcmQtcHJpdmF0ZS1rZXk=
  public-key: c3RhZ2luZy13aXJlZ3VhcmQtcHVibGljLWtleQ==
  preshared-key: c3RhZ2luZy13aXJlZ3VhcmQtcHJlc2hhcmVkLWtleQ==

---
# TLS Certificates for Staging
apiVersion: v1
kind: Secret
metadata:
  name: cloudbridge-staging-tls
  namespace: cloudbridge-staging
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: staging
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
    environment: staging
type: kubernetes.io/tls
data:
  # Self-signed certificates for staging (base64 encoded)
  # In production, use proper certificates from a CA
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t

