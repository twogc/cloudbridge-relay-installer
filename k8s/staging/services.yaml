# Staging Environment Services
apiVersion: v1
kind: Service
metadata:
  name: cloudbridge-relay-staging-service
  namespace: cloudbridge-staging
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: staging
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
    environment: staging
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    protocol: TCP
  - name: quic
    port: 9090
    targetPort: 9090
    protocol: UDP
  - name: wireguard
    port: 51820
    targetPort: 51820
    protocol: UDP
  - name: metrics
    port: 8084
    targetPort: 8084
    protocol: TCP
  selector:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/component: staging
    environment: staging

---
