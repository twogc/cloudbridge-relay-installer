apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a-test
  labels:
    tenant.cloudbridge.io/id: "tenant-123456789"

---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-b-test
  labels:
    tenant.cloudbridge.io/id: "tenant-216420165"

---
apiVersion: v1
kind: Pod
metadata:
  name: test-pod-tenant-a
  namespace: tenant-a-test
  labels:
    app: test-pod
    tenant.cloudbridge.io/id: "tenant-123456789"
spec:
  containers:
  - name: test-container
    image: nginx:alpine
    ports:
    - containerPort: 80
    command: ["/bin/sh"]
    args: ["-c", "while true; do echo 'Pod A running'; sleep 30; done"]

