apiVersion: v1
kind: ConfigMap
metadata:
  name: turn-server-config
  namespace: cloudbridge
  labels:
    app: turn-server
    component: nat-traversal
data:
  turnserver.conf: |
    # Coturn TURN SERVER configuration file
    # Based on coturn reference implementation
    
    # Listener ports
    listening-port=3478
    tls-listening-port=5349
    
    # Listening IPs
    listening-ip=0.0.0.0
    
    # Relay configuration
    relay-ip=0.0.0.0
    relay-ipv6=::
    min-port=49152
    max-port=65535
    
    # Authentication
    user=cloudbridge:${TURN_PASSWORD}
    realm=cloudbridge.ru
    
    # Security settings
    no-multicast-peers
    no-cli
    no-tlsv1
    no-tlsv1_1
    
    # Logging
    log-file=/var/log/turnserver.log
    verbose
    
    # Prometheus metrics
    prometheus
    prometheus-port=9641
    
    # Performance settings
    no-dtls
    no-tls
    no-tcp-relay
    
    # Network settings
    no-multicast-peers
    no-loopback-peers
    no-stdout-log
    
    # Resource limits
    max-bps=1000000
    max-allocate-lifetime=3600
    max-allocate-timeout=60
    
    # ICE settings
    no-ice-lite
    no-ice-tcp
    
    # Additional settings
    fingerprint
    lt-cred-mech
    use-auth-secret
    static-auth-secret=${TURN_SECRET}
    
    # Database (optional)
    # userdb=/var/lib/turn/turndb
    
    # Redis (optional)
    # redis-userdb="host=redis port=6379 dbname=0 connect_timeout=30"
    
    # PostgreSQL (optional)
    # psql-userdb="host=postgres port=5432 dbname=turn user=turn password=turn connect_timeout=30"

