apiVersion: v1
kind: Secret
metadata:
  name: turn-server-secret
  namespace: cloudbridge
  labels:
    app: turn-server
    component: nat-traversal
type: Opaque
data:
  # Base64 encoded passwords
  # echo -n "your-password" | base64
  turn-password: Y2xvdWRicmlkZ2UtcGFzc3dvcmQ=  # cloudbridge-password
  turn-secret: Y2xvdWRicmlkZ2Utc2VjcmV0  # cloudbridge-secret
stringData:
  # Plain text passwords (will be base64 encoded automatically)
  TURN_PASSWORD: "cloudbridge-password"
  TURN_SECRET: "cloudbridge-secret"

