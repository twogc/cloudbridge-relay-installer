apiVersion: v1
kind: Service
metadata:
  name: turn-server
  namespace: cloudbridge
  labels:
    app: turn-server
    component: nat-traversal
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  ports:
  - name: turn-udp
    port: 3478
    targetPort: 3478
    protocol: UDP
  - name: turn-tcp
    port: 3478
    targetPort: 3478
    protocol: TCP
  - name: turn-tls-udp
    port: 5349
    targetPort: 5349
    protocol: UDP
  - name: turn-tls-tcp
    port: 5349
    targetPort: 5349
    protocol: TCP
  - name: prometheus
    port: 9641
    targetPort: 9641
    protocol: TCP
  selector:
    app: turn-server
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: turn-server-headless
  namespace: cloudbridge
  labels:
    app: turn-server
    component: nat-traversal
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: turn-udp
    port: 3478
    targetPort: 3478
    protocol: UDP
  - name: turn-tcp
    port: 3478
    targetPort: 3478
    protocol: TCP
  - name: turn-tls-udp
    port: 5349
    targetPort: 5349
    protocol: UDP
  - name: turn-tls-tcp
    port: 5349
    targetPort: 5349
    protocol: TCP
  - name: prometheus
    port: 9641
    targetPort: 9641
    protocol: TCP
  selector:
    app: turn-server

