# CloudBridge Relay with Kubernetes Proxy Integration
# Helm values for kubectl proxy functionality

replicaCount: 3

image:
  repository: ghcr.io/twogc/cloudbridge-relay
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: "cloudbridge-relay"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "5551"
  prometheus.io/path: "/metrics"

podSecurityContext:
  fsGroup: 65534

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534

service:
  type: LoadBalancer
  loadBalancerIP: "109.120.180.160"  # Fixed EIP from kube.md
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-name: "LoadBalancer_3398"
  ports:
    - name: https-grpc
      protocol: TCP
      port: 443
      targetPort: 8444
    - name: metrics
      protocol: TCP  
      port: 5551
      targetPort: 5551
    - name: quic-udp
      protocol: UDP
      port: 443
      targetPort: 8443

ingress:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - cloudbridge-relay
        topologyKey: kubernetes.io/hostname

# CloudBridge Relay Configuration
config:
  server:
    address: ":8443"
    port: 8443
    timeout: "30s"
    max_tunnels: 1000
    ping_interval: "30s"
    cleanup_interval: "60s"

  security:
    tls_enabled: true
    cert_file: "/etc/relay/tls/tls.crt"
    key_file: "/etc/relay/tls/tls.key"

  metrics:
    enabled: true
    port: 5551
    path: "/metrics"

  api:
    enabled: true
    port: 8080
    version: "v1"

  grpc:
    enabled: true
    port: 8444
    tls_enabled: true
    cert_file: "/etc/relay/tls/tls.crt"
    key_file: "/etc/relay/tls/tls.key"
    keepalive_ping: "15s"
    keepalive_timeout: "10s"

  logging:
    level: "info"
    format: "json"
    output: "stdout"

# Kubernetes Proxy Configuration
kubernetes:
  clusters:
    - id: "production"
      api_server_url: "https://kubernetes.default.svc.cluster.local:443"
      ca: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      client_cert: "/etc/relay/clusters/production/client.crt"
      client_key: "/etc/relay/clusters/production/client.key"
      skip_tls_verify: false

    - id: "staging"
      api_server_url: "https://staging-k8s.example.com:6443"
      ca: "/etc/relay/clusters/staging/ca.crt"
      client_cert: "/etc/relay/clusters/staging/client.crt" 
      client_key: "/etc/relay/clusters/staging/client.key"
      skip_tls_verify: false

    - id: "development"
      api_server_url: "https://dev-k8s.example.com:6443"
      ca: "/etc/relay/clusters/dev/ca.crt"
      client_cert: "/etc/relay/clusters/dev/client.crt"
      client_key: "/etc/relay/clusters/dev/client.key"
      skip_tls_verify: false

  policies:
    # Default restrictive policy
    - tenant_id: "default"
      groups: ["users"]
      rules:
        - name: "default-read-only"
          verbs: ["get", "list", "watch"]
          api_groups: [""]
          resources: ["pods", "services", "configmaps"]
          namespaces: ["default"]

    # Development team - full access to dev/test namespaces
    - tenant_id: "dev-team"
      groups: ["developers", "qa"]
      rules:
        - name: "dev-full-access"
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          api_groups: ["", "apps", "extensions"]
          resources: ["pods", "services", "deployments", "configmaps", "secrets"]
          namespaces: ["development", "testing"]
        - name: "dev-exec-logs"
          verbs: ["exec", "attach", "logs", "portforward"]
          api_groups: [""]
          resources: ["pods", "pods/exec", "pods/attach", "pods/log", "pods/portforward"]
          namespaces: ["development", "testing"]
        - name: "staging-read-only"
          verbs: ["get", "list", "watch", "logs"]
          api_groups: ["", "apps"]
          resources: ["pods", "services", "deployments", "pods/log"]
          namespaces: ["staging"]
        - name: "deny-production"
          verbs: ["*"]
          api_groups: ["*"]
          resources: ["*"]
          namespaces: ["production", "kube-system"]
          deny: true

    # Operations team - cluster admin access
    - tenant_id: "ops-team"
      groups: ["operators", "sre"]
      rules:
        - name: "ops-cluster-admin"
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          api_groups: ["*"]
          resources: ["*"]
          namespaces: []
        - name: "ops-exec-access"
          verbs: ["exec", "attach", "logs", "portforward", "proxy"]
          api_groups: [""]
          resources: ["pods", "pods/exec", "pods/attach", "pods/log", "pods/portforward", "services/proxy", "nodes/proxy"]
          namespaces: []

    # Read-only viewer - limited access
    - tenant_id: "readonly-viewer"
      groups: ["viewers"]
      rules:
        - name: "global-read-only"
          verbs: ["get", "list", "watch"]
          api_groups: ["", "apps", "extensions", "networking.k8s.io"]
          resources: ["pods", "services", "deployments", "ingresses", "configmaps"]
          namespaces: ["default", "development", "staging"]
        - name: "logs-only"
          verbs: ["logs"]
          api_groups: [""]
          resources: ["pods/log"]
          namespaces: ["default", "development", "staging"]
        - name: "deny-exec-portforward"
          verbs: ["exec", "attach", "portforward", "proxy"]
          api_groups: [""]
          resources: ["pods/exec", "pods/attach", "pods/portforward"]
          namespaces: ["*"]
          deny: true

# TLS certificates and cluster certificates
volumes:
  # Main TLS certificate for gRPC/HTTPS
  - name: tls-certs
    secret:
      secretName: cloudbridge-relay-tls
      defaultMode: 0400

  # Kubernetes cluster certificates
  - name: cluster-certs
    projected:
      defaultMode: 0400
      sources:
      - secret:
          name: k8s-cluster-production-certs
          items:
          - key: ca.crt
            path: production/ca.crt
          - key: client.crt
            path: production/client.crt
          - key: client.key
            path: production/client.key
      - secret:
          name: k8s-cluster-staging-certs
          items:
          - key: ca.crt
            path: staging/ca.crt
          - key: client.crt
            path: staging/client.crt
          - key: client.key
            path: staging/client.key
      - secret:
          name: k8s-cluster-dev-certs
          items:
          - key: ca.crt
            path: dev/ca.crt
          - key: client.crt
            path: dev/client.crt
          - key: client.key
            path: dev/client.key

volumeMounts:
  - name: tls-certs
    mountPath: /etc/relay/tls
    readOnly: true
  - name: cluster-certs
    mountPath: /etc/relay/clusters
    readOnly: true

# ServiceMonitor for Prometheus
serviceMonitor:
  enabled: true
  namespace: monitoring
  labels:
    app: cloudbridge-relay
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  port: metrics

# Network Policies
networkPolicy:
  enabled: true
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: istio-system
      - namespaceSelector:
          matchLabels:
            name: monitoring
      ports:
      - protocol: TCP
        port: 8444  # gRPC
      - protocol: TCP
        port: 5551  # metrics
      - protocol: UDP
        port: 8443  # QUIC

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2
