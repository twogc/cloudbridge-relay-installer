# Velero Installation and Configuration for CloudBridge Relay
# This file contains the complete Velero setup for backup and disaster recovery

---
# Velero Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: velero
  labels:
    name: velero

---
# Velero ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: velero
  namespace: velero

---
# Velero ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: velero
rules:
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - '*'
- nonResourceURLs:
  - '*'
  verbs:
  - '*'

---
# Velero ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: velero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: velero
subjects:
- kind: ServiceAccount
  name: velero
  namespace: velero

---
# Velero Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velero
  namespace: velero
  labels:
    app: velero
spec:
  replicas: 1
  selector:
    matchLabels:
      app: velero
  template:
    metadata:
      labels:
        app: velero
    spec:
      serviceAccountName: velero
      containers:
      - name: velero
        image: velero/velero:v1.12.0
        command:
        - /velero
        args:
        - server
        - --log-level=info
        - --default-backup-storage-location=default
        - --default-volume-snapshot-locations=default
        env:
        - name: VELERO_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: VELERO_SCRATCH_DIR
          value: /scratch
        - name: AWS_SHARED_CREDENTIALS_FILE
          value: /credentials/cloud-credentials
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /credentials/cloud-credentials
        - name: AZURE_CREDENTIALS_FILE
          value: /credentials/cloud-credentials
        volumeMounts:
        - name: plugins
          mountPath: /plugins
        - name: scratch
          mountPath: /scratch
        - name: cloud-credentials
          mountPath: /credentials
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /metrics
            port: 8085
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /metrics
            port: 8085
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: plugins
        emptyDir: {}
      - name: scratch
        emptyDir: {}
      - name: cloud-credentials
        secret:
          secretName: cloud-credentials

---
# Velero Service
apiVersion: v1
kind: Service
metadata:
  name: velero
  namespace: velero
  labels:
    app: velero
spec:
  selector:
    app: velero
  ports:
  - name: metrics
    port: 8085
    targetPort: 8085
  type: ClusterIP

---
# Velero BackupStorageLocation for AWS S3
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: aws-s3
  namespace: velero
spec:
  provider: aws
  objectStorage:
    bucket: cloudbridge-velero-backups
    prefix: velero
  config:
    region: us-west-2
    s3ForcePathStyle: "false"
    s3Url: https://s3.us-west-2.amazonaws.com

---
# Velero BackupStorageLocation for GCS
apiVersion: velero.io/v1
kind: BackupStorageLocation
metadata:
  name: gcs
  namespace: velero
spec:
  provider: gcp
  objectStorage:
    bucket: cloudbridge-velero-backups
    prefix: velero
  config:
    region: us-central1

---
# Velero VolumeSnapshotLocation for AWS
apiVersion: velero.io/v1
kind: VolumeSnapshotLocation
metadata:
  name: aws-snapshot
  namespace: velero
spec:
  provider: aws
  config:
    region: us-west-2

---
# Velero VolumeSnapshotLocation for GCP
apiVersion: velero.io/v1
kind: VolumeSnapshotLocation
metadata:
  name: gcp-snapshot
  namespace: velero
spec:
  provider: gcp
  config:
    region: us-central1

---
# Velero Schedule for daily backups
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-backup
  namespace: velero
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  template:
    includedNamespaces:
    - cloudbridge
    - monitoring
    - velero
    storageLocation: aws-s3
    volumeSnapshotLocations:
    - aws-snapshot
    ttl: 720h0m0s  # 30 days retention
    metadata:
      labels:
        backup-type: daily
        environment: production

---
# Velero Schedule for weekly backups
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: weekly-backup
  namespace: velero
spec:
  schedule: "0 3 * * 0"  # Weekly on Sunday at 3 AM
  template:
    includedNamespaces:
    - cloudbridge
    - monitoring
    - velero
    storageLocation: aws-s3
    volumeSnapshotLocations:
    - aws-snapshot
    ttl: 2160h0m0s  # 90 days retention
    metadata:
      labels:
        backup-type: weekly
        environment: production

---
# Velero Schedule for monthly backups
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: monthly-backup
  namespace: velero
spec:
  schedule: "0 4 1 * *"  # Monthly on 1st at 4 AM
  template:
    includedNamespaces:
    - cloudbridge
    - monitoring
    - velero
    storageLocation: aws-s3
    volumeSnapshotLocations:
    - aws-snapshot
    ttl: 8760h0m0s  # 1 year retention
    metadata:
      labels:
        backup-type: monthly
        environment: production

---
# Velero Restore for disaster recovery
apiVersion: velero.io/v1
kind: Restore
metadata:
  name: disaster-recovery-restore
  namespace: velero
spec:
  backupName: ""  # Will be set during disaster recovery
  includedNamespaces:
  - cloudbridge
  - monitoring
  - velero
  restorePVs: true
  includeClusterResources: true
  hooks:
    resources:
    - name: post-restore-hook
      includedNamespaces:
      - cloudbridge
      includedResources:
      - pods
      labelSelector:
        matchLabels:
          app: cloudbridge-relay
      postHooks:
      - exec:
          container: cloudbridge-relay
          command:
          - /bin/bash
          - -c
          - |
            echo "Post-restore hook executed"
            # Add any post-restore commands here

