apiVersion: v1
kind: Pod
metadata:
  name: cloudbridge-relay-wg-test
  namespace: cloudbridge
  labels:
    app: cloudbridge-relay-wg-test
spec:
  containers:
  - name: cloudbridge-relay
    image: cloudbridge-relay:wg-test-simple-20250921-183840
    imagePullPolicy: Never
    args: ["./cloudbridge-relay", "--config=configs/config-wg-test.json"]
    ports:
    - containerPort: 8080
      name: http
    - containerPort: 8082
      name: api
    - containerPort: 5553
      name: p2p-quic
      protocol: UDP
    - containerPort: 19302
      name: stun
      protocol: UDP
    securityContext:
      capabilities:
        add:
        - NET_ADMIN
        - SYS_MODULE
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    env:
    - name: RELAY_JWT_SECRET
      value: "test-jwt-secret-for-wg-testing"
    - name: LOG_LEVEL
      value: "info"
  restartPolicy: Never
