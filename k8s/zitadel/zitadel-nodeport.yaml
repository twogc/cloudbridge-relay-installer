apiVersion: v1
kind: Service
metadata:
  name: zitadel-nodeport
  namespace: zitadel
  labels:
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/component: api
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30001
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/component: start
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel-login-nodeport
  namespace: zitadel
  labels:
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/component: login
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30000
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: zitadel
    app.kubernetes.io/component: login
