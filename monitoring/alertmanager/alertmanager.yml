# CloudBridge Relay - Alertmanager Configuration
global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@cloudbridge.com'
  smtp_auth_username: 'alerts@cloudbridge.com'
  smtp_auth_password: 'alert-password'
  smtp_require_tls: true

# The directory from which notification templates are read.
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# The root route on which each condition comes in.
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 5s
      group_interval: 5s
      repeat_interval: 30m
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
    - match:
        service: cloudbridge-relay
      receiver: 'cloudbridge-relay-alerts'
      group_wait: 5s
      group_interval: 5s
      repeat_interval: 30m
    - match:
        service: cassandra
      receiver: 'cassandra-alerts'
      group_wait: 5s
      group_interval: 5s
      repeat_interval: 30m
    - match:
        service: cadence
      receiver: 'cadence-alerts'
      group_wait: 5s
      group_interval: 5s
      repeat_interval: 30m
    - match:
        service: wireguard
      receiver: 'wireguard-alerts'
      group_wait: 5s
      group_interval: 5s
      repeat_interval: 30m
    - match:
        service: quic
      receiver: 'quic-alerts'
      group_wait: 5s
      group_interval: 5s
      repeat_interval: 30m
    - match:
        service: ai
      receiver: 'ai-alerts'
      group_wait: 5s
      group_interval: 5s
      repeat_interval: 30m
    - match:
        service: kubernetes
      receiver: 'kubernetes-alerts'
      group_wait: 5s
      group_interval: 5s
      repeat_interval: 30m

# Inhibition rules allow to mute a set of alerts given that another alert is
# firing.
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

# A list of notification receivers.
receivers:
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://127.0.0.1:5001/'

  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@cloudbridge.com'
        subject: '[CRITICAL] CloudBridge Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Runbook: {{ .Annotations.runbook_url }}
          {{ end }}
        headers:
          X-Priority: '1'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#alerts-critical'
        title: 'Critical Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
        send_resolved: true
    pagerduty_configs:
      - routing_key: 'YOUR_PAGERDUTY_ROUTING_KEY'
        description: '{{ .GroupLabels.alertname }}'
        details:
          summary: '{{ .Annotations.summary }}'
          description: '{{ .Annotations.description }}'
          runbook_url: '{{ .Annotations.runbook_url }}'

  - name: 'warning-alerts'
    email_configs:
      - to: 'team@cloudbridge.com'
        subject: '[WARNING] CloudBridge Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Runbook: {{ .Annotations.runbook_url }}
          {{ end }}
        headers:
          X-Priority: '3'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#alerts-warning'
        title: 'Warning Alert: {{ .GroupLabels.alertname }}'
