apiVersion: 1

providers:
  - name: 'cloudbridge-dashboards'
    orgId: 1
    folder: 'CloudBridge'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/cloudbridge

  - name: 'ai-dashboards'
    orgId: 1
    folder: 'AI System'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/ai