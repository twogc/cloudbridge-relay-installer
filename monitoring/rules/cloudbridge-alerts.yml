  - name: kubernetes-infrastructure
    rules:
      # Kubernetes Node Down
      - alert: KubernetesNodeDown
        expr: up{job="kubernetes-nodes"} == 0
        for: 1m
        labels:
          severity: critical
          service: kubernetes
        annotations:
          summary: "Kubernetes node is down"
          description: "Kubernetes node has been down for more than 1 minute"
          runbook_url: "https://docs.cloudbridge.com/runbooks/kubernetes-node-down"

      # Kubernetes Pod CrashLoopBackOff
      - alert: KubernetesPodCrashLoopBackOff
        expr: kube_pod_status_phase{phase="Running"} == 0 and kube_pod_status_phase{phase="Pending"} == 0
        for: 5m
        labels:
          severity: warning
          service: kubernetes
        annotations:
          summary: "Kubernetes pod in CrashLoopBackOff"
          description: "Kubernetes pod has been in CrashLoopBackOff for more than 5 minutes"
          runbook_url: "https://docs.cloudbridge.com/runbooks/kubernetes-pod-crashloop"

      # Kubernetes High CPU Usage
      - alert: KubernetesHighCPUUsage
        expr: rate(container_cpu_usage_seconds_total[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: kubernetes
        annotations:
          summary: "Kubernetes high CPU usage"
          description: "Kubernetes container CPU usage is above 80% for more than 5 minutes"
          runbook_url: "https://docs.cloudbridge.com/runbooks/kubernetes-high-cpu"

      # Kubernetes High Memory Usage
      - alert: KubernetesHighMemoryUsage
        expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: kubernetes
        annotations:
          summary: "Kubernetes high memory usage"
          description: "Kubernetes container memory usage is above 80% for more than 5 minutes"
          runbook_url: "https://docs.cloudbridge.com/runbooks/kubernetes-high-memory"

      # Kubernetes Disk Space Low
      - alert: KubernetesDiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) * 100 < 10
        for: 5m
        labels:
          severity: critical
          service: kubernetes
        annotations:
          summary: "Kubernetes disk space low"
          description: "Kubernetes node disk space is below 10% for more than 5 minutes"
          runbook_url: "https://docs.cloudbridge.com/runbooks/kubernetes-disk-space-low"

