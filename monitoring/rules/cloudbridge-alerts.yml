# CloudBridge Relay - Alerting Rules
groups:
  - name: cloudbridge-relay
    rules:
      # High CPU Usage
      - alert: CloudBridgeRelayHighCPU
        expr: rate(process_cpu_seconds_total{job="cloudbridge-relay"}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: cloudbridge-relay
        annotations:
          summary: "CloudBridge Relay high CPU usage"
          description: "CloudBridge Relay CPU usage is above 80% for more than 5 minutes"
          runbook_url: "https://docs.cloudbridge.com/runbooks/high-cpu"

      # High Memory Usage
      - alert: CloudBridgeRelayHighMemory
        expr: (process_resident_memory_bytes{job="cloudbridge-relay"} / 1024 / 1024 / 1024) > 1
        for: 5m
        labels:
          severity: warning
          service: cloudbridge-relay
        annotations:
          summary: "CloudBridge Relay high memory usage"
          description: "CloudBridge Relay memory usage is above 1GB for more than 5 minutes"
          runbook_url: "https://docs.cloudbridge.com/runbooks/high-memory"

      # Service Down
      - alert: CloudBridgeRelayDown
        expr: up{job="cloudbridge-relay"} == 0
        for: 1m
        labels:
          severity: critical
          service: cloudbridge-relay
        annotations:
          summary: "CloudBridge Relay is down"
          description: "CloudBridge Relay service has been down for more than 1 minute"
          runbook_url: "https://docs.cloudbridge.com/runbooks/service-down"

      # High Error Rate
      - alert: CloudBridgeRelayHighErrorRate
        expr: rate(http_requests_total{job="cloudbridge-relay",status=~"5.."}[5m]) / rate(http_requests_total{job="cloudbridge-relay"}[5m]) * 100 > 5
        for: 5m
        labels:
          severity: warning
          service: cloudbridge-relay
        annotations:
          summary: "CloudBridge Relay high error rate"
          description: "CloudBridge Relay error rate is above 5% for more than 5 minutes"
          runbook_url: "https://docs.cloudbridge.com/runbooks/high-error-rate"

      # High Response Time
      - alert: CloudBridgeRelayHighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="cloudbridge-relay"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: cloudbridge-relay
        annotations:
          summary: "CloudBridge Relay high response time"
          description: "CloudBridge Relay 95th percentile response time is above 1 second for more than 5 minutes"
          runbook_url: "https://docs.cloudbridge.com/runbooks/high-response-time"

      # Low Request Rate
      - alert: CloudBridgeRelayLowRequestRate
        expr: rate(http_requests_total{job="cloudbridge-relay"}[5m]) < 0.1
        for: 10m
        labels:
          severity: warning
          service: cloudbridge-relay
        annotations:
          summary: "CloudBridge Relay low request rate"
          description: "CloudBridge Relay request rate is below 0.1 requests per second for more than 10 minutes"
          runbook_url: "https://docs.cloudbridge.com/runbooks/low-request-rate"

