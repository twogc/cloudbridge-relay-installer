# CloudBridge Relay P2P API Proxy Configuration
# Обновленная конфигурация для P2P API

# P2P API (порт 8082) - проксирование на правильный LoadBalancer
server {
    listen 8082;
    server_name edge.2gc.ru;
    
    location / {
        proxy_pass http://192.168.49.2:30502;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

# HTTP API (порт 8080) - проксирование на HTTP API LoadBalancer
server {
    listen 8080;
    server_name edge.2gc.ru;
    
    location / {
        proxy_pass http://192.168.49.2:31016;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

# QUIC P2P (порт 9090) - UDP проксирование
server {
    listen 9090 udp;
    server_name edge.2gc.ru;
    
    location / {
        proxy_pass udp://192.168.49.2:31284;
        proxy_timeout 1s;
        proxy_responses 1;
    }
}

