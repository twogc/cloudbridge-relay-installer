# CloudBridge Relay Proxy Configuration
# Проксирование трафика от внешних портов к Minikube сервисам

# HTTP API (порт 8080)
server {
    listen 8080;
    server_name auth.2gc.ru;
    
    location / {
        proxy_pass http://192.168.49.2:30080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

# P2P API (порт 8082)
server {
    listen 8082;
    server_name auth.2gc.ru;
    
    location / {
        proxy_pass http://192.168.49.2:32500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

# MASQUE Proxy (порт 8443)
server {
    listen 8443 ssl;
    server_name auth.2gc.ru;
    
    # SSL certificates (нужно настроить)
    ssl_certificate /etc/ssl/certs/auth.2gc.ru.crt;
    ssl_certificate_key /etc/ssl/private/auth.2gc.ru.key;
    
    location / {
        proxy_pass https://192.168.49.2:30443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # HTTP/3 support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

# UDP проксирование для STUN и QUIC (требует nginx stream модуль)
stream {
    # STUN Server (порт 19302)
    server {
        listen 19302 udp;
        proxy_pass 192.168.49.2:30302;
        proxy_timeout 1s;
        proxy_responses 1;
    }
    
    # QUIC Transport (порт 9090)
    server {
        listen 9090 udp;
        proxy_pass 192.168.49.2:30090;
        proxy_timeout 1s;
        proxy_responses 1;
    }
    
    # Enhanced QUIC (порт 9092)
    server {
        listen 9092 udp;
        proxy_pass 192.168.49.2:30092;
        proxy_timeout 1s;
        proxy_responses 1;
    }
    
    # P2P QUIC Server (порт 5553)
    server {
        listen 5553 udp;
        proxy_pass 192.168.49.2:30553;
        proxy_timeout 1s;
        proxy_responses 1;
    }
}

