# CloudBridge Relay - Cloudflare Origin Proxy Configuration
# Настройка nginx для работы как Origin endpoint для Cloudflare через Magic WAN

# Основной сервер для Cloudflare Origin
server {
    listen 443 ssl http2;
    server_name edge.2gc.ru;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/edge.2gc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edge.2gc.ru/privkey.pem;
    
    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Cloudflare IP ranges (для безопасности)
    # Разрешаем только Cloudflare IPs через Magic WAN
    set_real_ip_from 10.200.0.0/31;  # Magic WAN subnet
    set_real_ip_from 162.159.75.92/32;  # Cloudflare Magic WAN Primary
    set_real_ip_from 172.64.251.46/32;  # Cloudflare Magic WAN Secondary
    real_ip_header X-Forwarded-For;
    
    # Security headers для Cloudflare
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # CloudBridge Relay Health Check (для Cloudflare мониторинга)
    location /health {
        proxy_pass http://192.168.58.2:30080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cloudflare specific headers
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;
        
        # Health check timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        
        # No caching for health checks
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # CloudBridge Relay Main API
    location /api/ {
        proxy_pass http://192.168.58.2:32500/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cloudflare specific headers
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;
        
        # WebSocket support for P2P
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # CloudBridge Relay P2P API
    location /p2p/ {
        proxy_pass http://192.168.58.2:32500/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cloudflare specific headers
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;
        
        # WebSocket support for P2P
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # CloudBridge Relay Metrics (только для Cloudflare)
    location /metrics {
        # Разрешаем только Cloudflare IPs
        allow 10.200.0.0/31;
        allow 162.159.75.92/32;
        allow 172.64.251.46/32;
        deny all;
        
        proxy_pass http://192.168.58.2:30081/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cloudflare specific headers
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;
    }
    
    # CloudBridge Relay QUIC Transport
    location /quic/ {
        proxy_pass http://192.168.58.2:30090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cloudflare specific headers
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;
        
        # QUIC specific settings
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # CloudBridge Relay Enhanced QUIC
    location /enhanced-quic/ {
        proxy_pass http://192.168.58.2:30092/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cloudflare specific headers
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;
        
        # Enhanced QUIC settings
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # CloudBridge Relay MASQUE HTTP/3
    location /masque/ {
        proxy_pass http://192.168.58.2:30443/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cloudflare specific headers
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;
        
        # MASQUE HTTP/3 settings
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    
    # CloudBridge Relay gRPC
    location /grpc/ {
        proxy_pass http://192.168.58.2:30844/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cloudflare specific headers
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;
        
        # gRPC settings
        proxy_http_version 2;
        proxy_set_header Content-Type application/grpc;
    }
    
    # Root endpoint - redirect to health
    location = / {
        return 301 /health;
    }
    
    # Default fallback
    location / {
        proxy_pass http://192.168.58.2:30080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cloudflare specific headers
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;
    }
}

# HTTP redirect to HTTPS
server {
    listen 80;
    server_name edge.2gc.ru;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}
