# NGINX L4 stream passthrough for Relay
# Place this file and include it from main nginx.conf: `include /etc/nginx/stream-relay.conf;`

stream {
	# TCP 9090 to Relay (no TLS termination)
	upstream relay_tcp {
		server relay:9090;
	}
	server {
		listen 9090;
		proxy_pass relay_tcp;
		proxy_timeout 1h;
	}

	# UDP 9090 (QUIC) to Relay
	upstream quic_udp {
		server relay:9090;
	}
	server {
		listen 9090 udp;
		proxy_pass quic_udp;
		proxy_timeout 1h;
	}

	# UDP 51820 (WireGuard)
	upstream wg_udp {
		server relay:51820;
	}
	server {
		listen 51820 udp;
		proxy_pass wg_udp;
		proxy_timeout 1h;
	}
}

