global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts/relay_alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'relay'
    static_configs:
      - targets: ['relay:8081']
    metrics_path: '/metrics'
    scheme: 'http'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'relay-tls'
    static_configs:
      - targets: ['relay:8080']
    metrics_path: '/probe'
    params:
      module: ['tls_connect_internal']
    scrape_interval: 30s
    scrape_timeout: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s 

  - job_name: 'ml-anomaly-api'
    static_configs:
      - targets: ['172.18.0.1:8000']
    metrics_path: '/metrics'
    scheme: 'http'
    scrape_interval: 15s
    scrape_timeout: 5s 