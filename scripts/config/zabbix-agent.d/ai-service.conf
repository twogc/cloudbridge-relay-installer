### UserParameters for CloudBridge AI Service
# Parameterized by base URL and optional timeout
# Example usage in items: ai.service.status[{$CB.AI.API_URL},{$CB.AI.TIMEOUT.S}]

UserParameter=ai.service.status[*],/bin/bash /home/ubuntu/cloudbridge-relay-installer/scripts/zabbix/ai_metric.sh status "$1" "$2"
UserParameter=ai.health.http200[*],/bin/bash /home/ubuntu/cloudbridge-relay-installer/scripts/zabbix/ai_metric.sh http200 "$1" "$2"
UserParameter=ai.health.latency_ms[*],/bin/bash /home/ubuntu/cloudbridge-relay-installer/scripts/zabbix/ai_metric.sh latency_ms "$1" "$2"

UserParameter=ai.metrics.requests_total[*],/bin/bash /home/ubuntu/cloudbridge-relay-installer/scripts/zabbix/ai_metric.sh requests_total "$1" "$2"
UserParameter=ai.metrics.errors_total[*],/bin/bash /home/ubuntu/cloudbridge-relay-installer/scripts/zabbix/ai_metric.sh errors_total "$1" "$2"
UserParameter=ai.metrics.anomalies_total[*],/bin/bash /home/ubuntu/cloudbridge-relay-installer/scripts/zabbix/ai_metric.sh anomalies_total "$1" "$2"
UserParameter=ai.metrics.predictions_total[*],/bin/bash /home/ubuntu/cloudbridge-relay-installer/scripts/zabbix/ai_metric.sh predictions_total "$1" "$2"
UserParameter=ai.health.error_rate[*],/bin/bash /home/ubuntu/cloudbridge-relay-installer/scripts/zabbix/ai_metric.sh error_rate "$1" "$2"


