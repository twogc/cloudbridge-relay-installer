global
    log /dev/log    local0
    log /dev/log    local1 notice
    daemon
    maxconn 4096
    tune.ssl.default-dh-param 2048

defaults
    log     global
    option  tcplog
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# HTTP redirect to HTTPS
frontend fe_http_80
    bind 0.0.0.0:80
    mode http
    
    # Zitadel UI redirect
    acl is_zitadel hdr(host) -i zitadel.2gc.ru
    http-request redirect scheme https code 301 if is_zitadel
    
    # Default redirect for other domains
    http-request redirect scheme https code 301 if !{ ssl_fc }

# HTTPS frontend for Zitadel
frontend fe_https_443_zitadel
    bind 0.0.0.0:443 ssl crt /etc/haproxy/certs/edge.2gc.ru.pem
    mode http
    
    # Route Zitadel traffic
    acl is_zitadel hdr(host) -i zitadel.2gc.ru
    use_backend be_zitadel if is_zitadel
    
    # Default backend for other traffic (TCP passthrough)
    default_backend be_plain_9090

# Zitadel backend
backend be_zitadel
    mode http
    balance roundrobin
    option httpchk GET /ui/login
    http-check expect status 200
    
    # Route to Zitadel service in Kubernetes
    server zitadel_ui 192.168.49.2:30000 check
    server zitadel_api 192.168.49.2:30001 check

# 9090 with HTTPS for browser (keep existing CloudBridge)
frontend fe_https_9090
    bind 0.0.0.0:9090 ssl crt /etc/haproxy/certs/edge.2gc.ru.pem alpn h2,http/1.1
    mode http
    default_backend be_http_9090

backend be_http_9090
    mode http
    server relay_http 192.168.49.2:31257 check

# TCP passthrough backend (keep existing)
backend be_plain_9090
    mode tcp
    server relay_plain 192.168.49.2:31257 check


