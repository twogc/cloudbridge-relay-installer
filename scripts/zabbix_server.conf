# Основные настройки
DBHost=localhost
DBName=zabbix
DBUser=zabbix
DBPassword=zabbix_password_2024
DBPort=5432

# Настройки производительности
StartPollers=10
StartPollersUnreachable=5
StartTrappers=5
StartPingers=1
StartDiscoverers=1
StartHTTPPollers=1
StartTimers=1
StartEscalators=1

# Настройки кэша
CacheSize=128M
CacheUpdateFrequency=60
StartDBSyncers=4
HistoryCacheSize=64M
HistoryIndexCacheSize=32M
TrendCacheSize=32M
ValueCacheSize=256M

# Настройки логирования
LogFile=/var/log/zabbix/zabbix_server.log
LogFileSize=10
DebugLevel=3

# Настройки безопасности
AllowRoot=0
User=zabbix





