# CloudBridge Relay - Network Security Policies
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudbridge-relay-network-policy
  namespace: cloudbridge
  labels:
    app.kubernetes.io/name: cloudbridge-relay
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: cloudbridge-relay
    app.kubernetes.io/managed-by: kubectl
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudbridge-relay
      app.kubernetes.io/component: relay
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from same namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge
    ports:
    - protocol: TCP
      port: 9090
    - protocol: UDP
      port: 9090
    - protocol: UDP
      port: 51820
    - protocol: TCP
      port: 8084
  # Allow ingress from monitoring namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge-monitoring
    ports:
    - protocol: TCP
      port: 8084
  # Allow ingress from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 9090
  egress:
  # Allow egress to Cassandra
  - to:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: cassandra
    ports:
    - protocol: TCP
      port: 9042
  # Allow egress to Cadence
  - to:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: cadence
    ports:
    - protocol: TCP
      port: 7933
  # Allow egress to monitoring
  - to:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge-monitoring
    ports:
    - protocol: TCP
      port: 9090
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow NTP
  - to: []
    ports:
    - protocol: UDP
      port: 123
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cassandra-network-policy
