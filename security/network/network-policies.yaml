    app.kubernetes.io/managed-by: kubectl
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cassandra
      app.kubernetes.io/component: database
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from CloudBridge Relay
  - from:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: cloudbridge-relay
    ports:
    - protocol: TCP
      port: 9042
    - protocol: TCP
      port: 9160
    - protocol: TCP
      port: 7000
    - protocol: TCP
      port: 7001
  # Allow ingress from Cadence
  - from:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: cadence
    ports:
    - protocol: TCP
      port: 9042
  # Allow ingress from monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          name: cloudbridge-monitoring
    ports:
    - protocol: TCP
      port: 9500
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow NTP
  - to: []
    ports:
    - protocol: UDP
      port: 123
