  runAsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 999
        max: 999
  seLinux:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 999
        max: 999
  readOnlyRootFilesystem: false
  allowedHostPaths: []
  allowedFlexVolumes: []
  allowedCSIDrivers: []
  allowedUnsafeSysctls: []
  forbiddenSysctls: []
---
