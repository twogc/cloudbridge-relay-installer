# SIEM Detection Rules Configuration
# Rules for detecting security threats and anomalies

rules:
  brute_force:
    name: "Brute Force Attack Detection"
    description: "Множественные неудачные попытки входа"
    enabled: true
    severity: "high"
    category: "authentication"
    conditions:
      event_type: "authentication_failure"
      time_window: 300  # 5 minutes
      threshold: 5
      group_by: ["source_ip", "username"]
    actions:
      - action: "alert"
        severity: "high"
        message: "Brute force attack detected from {source_ip}"
      - action: "block_ip"
        duration: 3600  # 1 hour
      - action: "notify"
        channels: ["email", "telegram"]
        template: "brute_force_alert"

  suspicious_activity:
    name: "Suspicious Activity Detection"
    description: "Подозрительная активность"
    enabled: true
    severity: "medium"
    category: "behavior"
    conditions:
      event_type: "unusual_access"
      time_window: 600  # 10 minutes
      threshold: 3
      group_by: ["source_ip", "user_id"]
    actions:
      - action: "alert"
        severity: "medium"
        message: "Suspicious activity detected from {source_ip}"
      - action: "log"
        level: "warning"
      - action: "notify"
        channels: ["email"]
        template: "suspicious_activity_alert"

  data_exfiltration:
    name: "Data Exfiltration Detection"
    description: "Обнаружение утечки данных"
    enabled: true
    severity: "critical"
    category: "data_protection"
    conditions:
      event_type: "data_access"
      time_window: 1800  # 30 minutes
      threshold: 10
      group_by: ["user_id", "data_type"]
      filters:
        data_size: "> 100MB"
        destination: "external"
    actions:
      - action: "alert"
        severity: "critical"
        message: "Potential data exfiltration detected"
      - action: "block_user"
        duration: 7200  # 2 hours
      - action: "notify"
        channels: ["email", "telegram", "slack"]
        template: "data_exfiltration_alert"

  privilege_escalation:
    name: "Privilege Escalation Detection"
    description: "Обнаружение повышения привилегий"
    enabled: true
    severity: "high"
    category: "privilege_management"
    conditions:
      event_type: "privilege_change"
      time_window: 3600  # 1 hour
      threshold: 1
      group_by: ["user_id"]
      filters:
        new_privileges: "admin"
        change_type: "escalation"
    actions:
      - action: "alert"
        severity: "high"
        message: "Privilege escalation detected for user {user_id}"
      - action: "review_privileges"
      - action: "notify"
        channels: ["email", "telegram"]
        template: "privilege_escalation_alert"

  malware_detection:
    name: "Malware Detection"
    description: "Обнаружение вредоносного ПО"
    enabled: true
    severity: "critical"
    category: "malware"
    conditions:
      event_type: "malware_detected"
      time_window: 300  # 5 minutes
      threshold: 1
      group_by: ["source_ip", "file_hash"]
    actions:
      - action: "alert"
        severity: "critical"
        message: "Malware detected: {malware_type}"
      - action: "quarantine_file"
      - action: "block_ip"
        duration: 86400  # 24 hours
      - action: "notify"
        channels: ["email", "telegram", "slack"]
        template: "malware_alert"

  ddos_attack:
    name: "DDoS Attack Detection"
    description: "Обнаружение DDoS атак"
    enabled: true
    severity: "high"
    category: "network"
    conditions:
      event_type: "network_traffic"
      time_window: 60  # 1 minute
      threshold: 1000
      group_by: ["source_ip"]
      filters:
        traffic_type: "http"
        response_code: "429|500|503"
    actions:
      - action: "alert"
        severity: "high"
        message: "DDoS attack detected from {source_ip}"
      - action: "rate_limit"
        duration: 300  # 5 minutes
      - action: "notify"
        channels: ["email", "telegram"]
        template: "ddos_alert"

  sql_injection:
    name: "SQL Injection Detection"
    description: "Обнаружение SQL инъекций"
    enabled: true
    severity: "high"
    category: "web_attack"
    conditions:
      event_type: "web_request"
      time_window: 300  # 5 minutes
      threshold: 3
      group_by: ["source_ip", "endpoint"]
      filters:
        payload_pattern: ".*(UNION|SELECT|INSERT|UPDATE|DELETE|DROP|CREATE).*"
    actions:
      - action: "alert"
        severity: "high"
        message: "SQL injection attempt detected"
      - action: "block_ip"
        duration: 1800  # 30 minutes
      - action: "notify"
        channels: ["email", "telegram"]
        template: "sql_injection_alert"

  failed_login_attempts:
    name: "Failed Login Attempts"
    description: "Неудачные попытки входа"
    enabled: true
    severity: "medium"
    category: "authentication"
    conditions:
      event_type: "login_failure"
      time_window: 900  # 15 minutes
      threshold: 10
      group_by: ["username", "source_ip"]
    actions:
      - action: "alert"
        severity: "medium"
        message: "Multiple failed login attempts for user {username}"
      - action: "temporary_lock"
        duration: 1800  # 30 minutes
      - action: "notify"
        channels: ["email"]
        template: "failed_login_alert"

# Correlation Rules
correlations:
  attack_chain:
    name: "Attack Chain Detection"
    description: "Цепочка атаки"
    enabled: true
    severity: "critical"
    events:
      - authentication_failure
      - successful_login
      - data_access
    time_window: 1800  # 30 minutes
    sequence: true
    actions:
      - action: "alert"
        severity: "critical"
        message: "Attack chain detected: {event_sequence}"
      - action: "block_user"
        duration: 86400  # 24 hours
      - action: "notify"
        channels: ["email", "telegram", "slack"]
        template: "attack_chain_alert"

  lateral_movement:
    name: "Lateral Movement Detection"
    description: "Обнаружение горизонтального перемещения"
    enabled: true
    severity: "high"
    events:
      - successful_login
      - privilege_escalation
      - data_access
    time_window: 3600  # 1 hour
    sequence: true
    actions:
      - action: "alert"
        severity: "high"
        message: "Lateral movement detected"
      - action: "investigate"
      - action: "notify"
        channels: ["email", "telegram"]
        template: "lateral_movement_alert"

# Notification Templates
notification_templates:
  brute_force_alert:
    subject: "🚨 КРИТИЧЕСКАЯ УГРОЗА: Brute Force Attack"
    body: |
      Обнаружена атака методом перебора!
      
      Источник: {source_ip}
      Пользователь: {username}
      Время: {timestamp}
      Попыток: {attempts}
      
      Немедленно примите меры!
      
      - SIEM System

  suspicious_activity_alert:
    subject: "⚠️ ПОДОЗРИТЕЛЬНАЯ АКТИВНОСТЬ"
    body: |
      Обнаружена подозрительная активность!
      
      Источник: {source_ip}
      Пользователь: {user_id}
      Время: {timestamp}
      Активность: {activity_type}
      
      Требуется расследование.
      
      - SIEM System

  data_exfiltration_alert:
    subject: "🚨 КРИТИЧЕСКАЯ УГРОЗА: Data Exfiltration"
    body: |
      Обнаружена потенциальная утечка данных!
      
      Пользователь: {user_id}
      Тип данных: {data_type}
      Размер: {data_size}
      Назначение: {destination}
      Время: {timestamp}
      
      НЕМЕДЛЕННО БЛОКИРУЙТЕ ПОЛЬЗОВАТЕЛЯ!
      
      - SIEM System

  privilege_escalation_alert:
    subject: "🚨 ВЫСОКАЯ УГРОЗА: Privilege Escalation"
    body: |
      Обнаружено повышение привилегий!
      
      Пользователь: {user_id}
      Новые привилегии: {new_privileges}
      Время: {timestamp}
      
      Требуется немедленная проверка!
      
      - SIEM System

  malware_alert:
    subject: "🚨 КРИТИЧЕСКАЯ УГРОЗА: Malware Detected"
    body: |
      Обнаружено вредоносное ПО!
      
      Тип: {malware_type}
      Файл: {file_name}
      Хеш: {file_hash}
      Источник: {source_ip}
      Время: {timestamp}
      
      НЕМЕДЛЕННО ИЗОЛИРУЙТЕ СИСТЕМУ!
      
      - SIEM System

  ddos_alert:
    subject: "🚨 ВЫСОКАЯ УГРОЗА: DDoS Attack"
    body: |
      Обнаружена DDoS атака!
      
      Источник: {source_ip}
      Тип трафика: {traffic_type}
      Запросов: {request_count}
      Время: {timestamp}
      
      Активированы защитные меры.
      
      - SIEM System

  sql_injection_alert:
    subject: "🚨 ВЫСОКАЯ УГРОЗА: SQL Injection"
    body: |
      Обнаружена попытка SQL инъекции!
      
      Источник: {source_ip}
      Endpoint: {endpoint}
      Payload: {payload}
      Время: {timestamp}
      
      IP заблокирован на 30 минут.
      
      - SIEM System

  failed_login_alert:
    subject: "⚠️ ПРЕДУПРЕЖДЕНИЕ: Failed Login Attempts"
    body: |
      Множественные неудачные попытки входа!
      
      Пользователь: {username}
      Источник: {source_ip}
      Попыток: {attempts}
      Время: {timestamp}
      
      Аккаунт временно заблокирован.
      
      - SIEM System

  attack_chain_alert:
    subject: "🚨 КРИТИЧЕСКАЯ УГРОЗА: Attack Chain Detected"
    body: |
      Обнаружена цепочка атаки!
      
      Последовательность событий:
      {event_sequence}
      
      Время: {timestamp}
      
      НЕМЕДЛЕННО ИЗОЛИРУЙТЕ СИСТЕМУ!
      
      - SIEM System

  lateral_movement_alert:
    subject: "🚨 ВЫСОКАЯ УГРОЗА: Lateral Movement"
    body: |
      Обнаружено горизонтальное перемещение!
      
      Пользователь: {user_id}
      События: {events}
      Время: {timestamp}
      
      Требуется расследование.
      
      - SIEM System 