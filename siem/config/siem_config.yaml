# SIEM System Configuration
# Основная конфигурация для SIEM системы

# Application Settings
app:
  name: "CloudBridge SIEM"
  version: "2.0.0"
  debug: false
  log_level: "INFO"
  timezone: "Europe/Moscow"

# Server Configuration
server:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  max_connections: 1000
  timeout: 30

# Database Configuration
database:
  postgresql:
    host: "localhost"
    port: 5432
    database: "siem"
    username: "siem"
    password: "password"
    pool_size: 20
    max_overflow: 30
    pool_timeout: 30
    pool_recycle: 3600

# Redis Configuration
redis:
  host: "localhost"
  port: 6379
  password: null
  database: 0
  max_connections: 50
  socket_timeout: 5
  socket_connect_timeout: 5

# Elasticsearch Configuration
elasticsearch:
  hosts:
    - "http://localhost:9200"
  username: "elastic"
  password: "changeme"
  index_prefix: "siem"
  number_of_shards: 3
  number_of_replicas: 1
  refresh_interval: "1s"

# Kafka Configuration
kafka:
  bootstrap_servers:
    - "localhost:9092"
  security_protocol: "PLAINTEXT"
  sasl_mechanism: "PLAIN"
  sasl_username: null
  sasl_password: null
  topics:
    events: "siem.events"
    alerts: "siem.alerts"
    correlations: "siem.correlations"
  consumer_group: "siem-consumer-group"
  producer_acks: "all"
  producer_retries: 3

# External Services Integration
services:
  # Relay Integration
  relay:
    metrics_url: "http://relay:8081/metrics"
    log_file: "/var/log/relay/relay.log"
    api_url: "http://relay:8081/api"
    timeout: 10

  # Keycloak Integration
  keycloak:
    admin_url: "http://keycloak:8080/auth/admin"
    realm: "cloudbridge"
    client_id: "siem-client"
    client_secret: "siem-secret"
    username: "admin"
    password: "admin"
    timeout: 10

  # Django API Integration
  django:
    api_url: "http://django:8000/api"
    api_key: "siem-api-key"
    timeout: 10

  # ML Anomaly Detection
  ml_api:
    url: "http://localhost:8000/detect"
    timeout: 30
    batch_size: 100

# Monitoring Integration
monitoring:
  prometheus:
    url: "http://localhost:9090"
    scrape_interval: 15
    metrics_path: "/metrics"

  grafana:
    url: "http://localhost:3000"
    api_key: "grafana-api-key"

  alertmanager:
    url: "http://localhost:9093"
    api_key: "alertmanager-api-key"

# Notification Configuration
notifications:
  # Email Configuration
  email:
    enabled: true
    smtp_server: "smtp.rusender.ru"
    smtp_port: 465
    username: "siem@2gc.ru"
    password: "${SIEM_EMAIL_PASSWORD}"
    from_address: "siem@2gc.ru"
    to_addresses:
      - "security@2gc.ru"
      - "admin@2gc.ru"
    use_tls: true
    use_ssl: true

  # Telegram Configuration
  telegram:
    enabled: true
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"
    parse_mode: "HTML"
    disable_web_page_preview: true

  # Slack Configuration
  slack:
    enabled: false
    webhook_url: "${SLACK_WEBHOOK_URL}"
    channel: "#security-alerts"
    username: "SIEM Bot"
    icon_emoji: ":warning:"

  # Webhook Configuration
  webhook:
    enabled: false
    url: "${WEBHOOK_URL}"
    method: "POST"
    headers:
      Content-Type: "application/json"
      Authorization: "Bearer ${WEBHOOK_TOKEN}"

# Security Configuration
security:
  # JWT Configuration
  jwt:
    secret_key: "${JWT_SECRET_KEY}"
    algorithm: "HS256"
    access_token_expire_minutes: 30
    refresh_token_expire_days: 7

  # CORS Configuration
  cors:
    allowed_origins:
      - "http://localhost:3000"
      - "http://localhost:8081"
      - "https://siem.2gc.ru"
    allowed_methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed_headers:
      - "*"
    allow_credentials: true

  # Rate Limiting
  rate_limit:
    enabled: true
    requests_per_minute: 100
    burst_size: 20

# Multi-tenant Configuration
multi_tenant:
  enabled: true
  isolation_level: "strict"  # strict, moderate, relaxed
  default_tenant: "default"
  tenant_header: "X-Tenant-ID"
  tenant_claim: "tenant_id"

# Performance Configuration
performance:
  # Event Processing
  max_events_per_second: 10000
  event_processing_timeout: 100
  batch_size: 1000
  worker_threads: 8

  # Memory Management
  max_memory_usage: "8GB"
  gc_threshold: 0.8
  cache_size: 10000

  # Storage
  retention_days: 90
  compression_enabled: true
  index_optimization_interval: "1d"

# Detection Rules
detection:
  rules_file: "config/detection_rules.yaml"
  correlation_file: "config/correlation_rules.yaml"
  custom_rules_dir: "config/custom_rules"
  rule_update_interval: 300  # 5 minutes

# Correlation Engine
correlation:
  enabled: true
  time_window: 1800  # 30 minutes
  max_correlations: 1000
  correlation_threshold: 0.7
  sequence_detection: true

# Data Enrichment
enrichment:
  # IP Intelligence
  ip_intelligence:
    enabled: true
    providers:
      - "maxmind"
      - "abuseipdb"
    cache_ttl: 3600  # 1 hour

  # Threat Intelligence
  threat_intelligence:
    enabled: true
    providers:
      - "virustotal"
      - "abuseipdb"
      - "alienvault"
    cache_ttl: 1800  # 30 minutes

  # User Context
  user_context:
    enabled: true
    sources:
      - "keycloak"
      - "django"
    cache_ttl: 600  # 10 minutes

# Backup Configuration
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention_days: 30
  storage:
    type: "local"  # local, s3, gcs
    path: "/backups/siem"
    compression: true

# Logging Configuration
logging:
  level: "INFO"
  format: "json"
  output: "stdout"  # stdout, file, syslog
  file:
    path: "/var/log/siem/siem.log"
    max_size: "100MB"
    backup_count: 10
  syslog:
    host: "localhost"
    port: 514
    facility: "local0"

# Health Check Configuration
health_check:
  enabled: true
  interval: 30
  timeout: 10
  endpoints:
    - "database"
    - "redis"
    - "elasticsearch"
    - "kafka"
    - "external_services"

# Metrics Configuration
metrics:
  enabled: true
  port: 8001
  path: "/metrics"
  collectors:
    - "events"
    - "alerts"
    - "correlations"
    - "performance"
    - "system"

# Development Configuration
development:
  debug: false
  hot_reload: false
  mock_external_services: false
  test_mode: false
  seed_data: false 