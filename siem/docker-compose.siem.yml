version: '3.8'

services:
  # Kafka для потоковой обработки событий
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: siem-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - siem-network
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: siem-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_DELETE_TOPIC_ENABLE: 'true'
    networks:
      - siem-network
    restart: unless-stopped

  # Elasticsearch для хранения и поиска событий
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: siem-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - siem-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kibana для визуализации
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: siem-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - siem-network
    restart: unless-stopped

  # Redis для кэширования
  redis:
    image: redis:7-alpine
    container_name: siem-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - siem-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # SIEM Collector
  siem-collector:
    build:
      context: .
      dockerfile: collectors/Dockerfile
    container_name: siem-collector
    environment:
      - RELAY_LOG_FILE=/var/log/relay/relay.log
      - RELAY_METRICS_URL=http://relay:8081/metrics
      - KEYCLOAK_ADMIN_URL=http://keycloak:8080/admin
      - KEYCLOAK_AUTH_URL=http://keycloak:8080
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=changeme
    volumes:
      - /var/log/relay:/var/log/relay:ro
    depends_on:
      - kafka
      - elasticsearch
    networks:
      - siem-network
    restart: unless-stopped

  # SIEM Event Processor
  siem-processor:
    build:
      context: .
      dockerfile: processors/Dockerfile
    container_name: siem-processor
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=changeme
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
    depends_on:
      - kafka
      - elasticsearch
      - redis
    networks:
      - siem-network
    restart: unless-stopped

  # SIEM Alert Manager
  siem-alert-manager:
    build:
      context: .
      dockerfile: alerting/Dockerfile
    container_name: siem-alert-manager
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=changeme
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - MIN_SEVERITY=medium
      - QUIET_HOURS_START=22
      - QUIET_HOURS_END=8
      # Email настройки (опционально)
      - EMAIL_SMTP_SERVER=smtp.gmail.com
      - EMAIL_SMTP_PORT=587
      - EMAIL_USERNAME=your-email@gmail.com
      - EMAIL_PASSWORD=your-app-password
      - EMAIL_FROM=siem@yourcompany.com
      - EMAIL_TO=admin@yourcompany.com,security@yourcompany.com
      # Telegram настройки (опционально)
      - TELEGRAM_BOT_TOKEN=your-bot-token
      - TELEGRAM_CHAT_ID=your-chat-id
      # Slack настройки (опционально)
      - SLACK_WEBHOOK_URL=https://hooks.slack.com/services/your/webhook/url
    depends_on:
      - elasticsearch
      - redis
    networks:
      - siem-network
    restart: unless-stopped

  # SIEM Web UI
  siem-webui:
    build:
      context: .
      dockerfile: webui/Dockerfile
    container_name: siem-webui
    ports:
      - "8081:80"
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - KIBANA_URL=http://kibana:5601
    depends_on:
      - elasticsearch
      - kibana
    networks:
      - siem-network
    restart: unless-stopped

  # Prometheus для метрик SIEM
  siem-prometheus:
    image: prom/prometheus:latest
    container_name: siem-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - siem_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - siem-network
    restart: unless-stopped

  # Grafana для дашбордов SIEM
  siem-grafana:
    image: grafana/grafana:latest
    container_name: siem-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - siem_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - siem-prometheus
    networks:
      - siem-network
    restart: unless-stopped

  # Logstash для обработки логов (опционально)
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: siem-logstash
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
      - "5000:5000/udp"
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    networks:
      - siem-network
    restart: unless-stopped

  # Filebeat для сбора логов (опционально)
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: siem-filebeat
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/log/relay:/var/log/relay:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    networks:
      - siem-network
    restart: unless-stopped

volumes:
  elasticsearch_data:
    driver: local
  redis_data:
    driver: local
  siem_prometheus_data:
    driver: local
  siem_grafana_data:
    driver: local

networks:
  siem-network:
    driver: bridge 