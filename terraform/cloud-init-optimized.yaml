#cloud-config

# CloudBridge Relay - VK Cloud Optimized Cloud-Init Configuration
# Оптимизированная конфигурация для VK Cloud с Load Balancer и DDoS защитой

# Основные настройки
hostname: ${project_name}-${instance_id}
fqdn: ${project_name}-${instance_id}.vkcs.ru
manage_etc_hosts: true

# Пользователи
users:
  - name: ubuntu
    groups: [adm, audio, cdrom, dialout, dip, floppy, lxd, netdev, plugdev, sudo, video]
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      - ${ssh_public_key}

# Пакеты для установки
packages:
  - docker.io
  - docker-compose
  - nginx
  - fail2ban
  - ufw
  - htop
  - iotop
  - nethogs
  - curl
  - wget
  - git
  - unzip
  - jq
  - htop
  - tree
  - vim
  - nano
  - rsync
  - screen
  - tmux
  - net-tools
  - dnsutils
  - tcpdump
  - wireshark-common
  - tshark
  - iperf3
  - speedtest-cli
  - prometheus-node-exporter
  - grafana-agent

# Обновление системы
package_update: true
package_upgrade: true
package_reboot_if_required: true

# Настройка Docker
runcmd:
  # Настройка Docker
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ubuntu
  
  # Оптимизация Docker
  - echo '{"log-driver": "json-file", "log-opts": {"max-size": "100m", "max-file": "3"}}' > /etc/docker/daemon.json
  - systemctl restart docker
  
  # Настройка Nginx с оптимизацией
  - |
    cat > /etc/nginx/nginx.conf << 'EOF'
    user www-data;
    worker_processes auto;
    pid /run/nginx.pid;
    include /etc/nginx/modules-enabled/*.conf;
    
    events {
        worker_connections 4096;
        use epoll;
        multi_accept on;
    }
    
    http {
        # Основные настройки
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        server_tokens off;
        
        # Оптимизация буферов
        client_body_buffer_size 128k;
        client_max_body_size 10m;
        client_header_buffer_size 1k;
        large_client_header_buffers 4 4k;
        output_buffers 1 32k;
        postpone_output 1460;
        
        # Сжатие
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            application/atom+xml
            image/svg+xml;
        
        # Кэширование
        open_file_cache max=1000 inactive=20s;
        open_file_cache_valid 30s;
        open_file_cache_min_uses 2;
        open_file_cache_errors on;
        
        # Логирование
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
        
        access_log /var/log/nginx/access.log main;
        error_log /var/log/nginx/error.log;
        
        # Upstream для CloudBridge Relay
        upstream cloudbridge_relay {
            least_conn;
            server 127.0.0.1:9090 max_fails=3 fail_timeout=30s;
            keepalive 32;
        }
        
        # Основной сервер
        server {
            listen 80;
            server_name _;
            
            # Health check
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
            
            # CloudBridge Relay
            location / {
                proxy_pass http://cloudbridge_relay;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_cache_bypass $http_upgrade;
                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }
            
            # Metrics
            location /metrics {
                proxy_pass http://127.0.0.1:8084/metrics;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
    }
    EOF
  
  # Настройка Fail2ban с оптимизацией
  - |
    cat > /etc/fail2ban/jail.local << 'EOF'
    [DEFAULT]
    bantime = 3600
    findtime = 600
    maxretry = 3
    backend = systemd
    
    [sshd]
    enabled = true
    port = ssh
    filter = sshd
    logpath = /var/log/auth.log
    maxretry = 3
    
    [nginx-http-auth]
    enabled = true
    filter = nginx-http-auth
    port = http,https
    logpath = /var/log/nginx/error.log
    
    [nginx-limit-req]
    enabled = true
    filter = nginx-limit-req
    port = http,https
    logpath = /var/log/nginx/error.log
    maxretry = 10
    EOF
  
  # Настройка UFW
  - ufw --force enable
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow ssh
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 8080/tcp
  - ufw allow 8081/tcp
  - ufw allow 3456/tcp
  - ufw allow 9090/udp
  - ufw allow 51820/udp
  
  # Оптимизация системы
  - |
    cat > /etc/sysctl.d/99-cloudbridge-optimization.conf << 'EOF'
    # Сетевые оптимизации
    net.core.rmem_max = 16777216
    net.core.wmem_max = 16777216
    net.ipv4.tcp_rmem = 4096 65536 16777216
    net.ipv4.tcp_wmem = 4096 65536 16777216
    net.core.netdev_max_backlog = 5000
    net.ipv4.tcp_congestion_control = bbr
    net.ipv4.tcp_slow_start_after_idle = 0
    net.ipv4.tcp_tw_reuse = 1
    net.ipv4.tcp_fin_timeout = 15
    net.ipv4.tcp_keepalive_time = 600
    net.ipv4.tcp_keepalive_intvl = 60
    net.ipv4.tcp_keepalive_probes = 10
    
    # Оптимизация файловой системы
    fs.file-max = 2097152
    vm.swappiness = 10
    vm.dirty_ratio = 15
    vm.dirty_background_ratio = 5
    
    # Оптимизация памяти
    kernel.shmmax = 68719476736
    kernel.shmall = 4294967296
    EOF
  
  # Применение оптимизаций
  - sysctl -p /etc/sysctl.d/99-cloudbridge-optimization.conf
  
  # Настройка мониторинга
  - systemctl enable prometheus-node-exporter
  - systemctl start prometheus-node-exporter
  
  # Создание скриптов управления
  - |
    cat > /usr/local/bin/relay-status << 'EOF'
    #!/bin/bash
    echo "=== CloudBridge Relay Status ==="
    echo "Instance: ${project_name}-${instance_id}"
    echo "Load Balancer: ${load_balancer_enabled}"
    echo "Monitoring: ${monitoring_enabled}"
    echo "Auto Scaling: ${auto_scaling_enabled}"
    echo ""
    echo "=== Docker Containers ==="
    docker ps -a
    echo ""
    echo "=== System Resources ==="
    free -h
    df -h
    echo ""
    echo "=== Network Status ==="
    ss -tuln
    echo ""
    echo "=== Nginx Status ==="
    systemctl status nginx --no-pager
    echo ""
    echo "=== Fail2ban Status ==="
    fail2ban-client status
    EOF
  
  - |
    cat > /usr/local/bin/relay-start << 'EOF'
    #!/bin/bash
    echo "Starting CloudBridge Relay..."
    
    # Запуск Docker контейнеров
    docker-compose -f /opt/cloudbridge/docker-compose.yml up -d
    
    # Проверка статуса
    sleep 5
    relay-status
    EOF
  
  - |
    cat > /usr/local/bin/relay-stop << 'EOF'
    #!/bin/bash
    echo "Stopping CloudBridge Relay..."
    
    # Остановка Docker контейнеров
    docker-compose -f /opt/cloudbridge/docker-compose.yml down
    
    echo "CloudBridge Relay stopped"
    EOF
  
  - |
    cat > /usr/local/bin/ddos-status << 'EOF'
    #!/bin/bash
    echo "=== DDoS Protection Status ==="
    echo "Level: ${ddos_protection_level}"
    echo ""
    echo "=== UFW Status ==="
    ufw status verbose
    echo ""
    echo "=== Fail2ban Status ==="
    fail2ban-client status
    echo ""
    echo "=== Nginx Status ==="
    systemctl status nginx --no-pager
    echo ""
    echo "=== Network Connections ==="
    ss -tuln | grep -E ':(80|443|8080|8081|3456|9090|51820)'
    EOF
  
  # Установка прав на скрипты
  - chmod +x /usr/local/bin/relay-status
  - chmod +x /usr/local/bin/relay-start
  - chmod +x /usr/local/bin/relay-stop
  - chmod +x /usr/local/bin/ddos-status
  
  # Создание директории для CloudBridge
  - mkdir -p /opt/cloudbridge
  - chown ubuntu:ubuntu /opt/cloudbridge
  
  # Запуск сервисов
  - systemctl enable nginx
  - systemctl start nginx
  - systemctl enable fail2ban
  - systemctl start fail2ban
  
  # Создание docker-compose.yml
  - |
    cat > /opt/cloudbridge/docker-compose.yml << 'EOF'
    version: '3.8'
    
    services:
      cloudbridge-relay:
        image: registry.vkcs.ru/cloudbridge/cloudbridge-relay:latest
        container_name: cloudbridge-relay
        restart: unless-stopped
        ports:
          - "9090:9090"
          - "8084:8084"
          - "3456:3456"
        environment:
          - CONFIG_PATH=/app/configs/config.json
          - LOG_LEVEL=info
          - GIN_MODE=release
        volumes:
          - ./configs:/app/configs:ro
          - ./logs:/app/logs
        networks:
          - cloudbridge
        healthcheck:
          test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
          interval: 30s
          timeout: 10s
          retries: 3
          start_period: 40s
    
      prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        restart: unless-stopped
        ports:
          - "9091:9090"
        volumes:
          - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
        networks:
          - cloudbridge
    
      grafana:
        image: grafana/grafana:latest
        container_name: grafana
        restart: unless-stopped
        ports:
          - "3000:3000"
        environment:
          - GF_SECURITY_ADMIN_PASSWORD=admin123
        volumes:
          - grafana-data:/var/lib/grafana
        networks:
          - cloudbridge
    
    volumes:
      grafana-data:
    
    networks:
      cloudbridge:
        driver: bridge
    EOF
  
  # Создание конфигурации Prometheus
  - |
    cat > /opt/cloudbridge/prometheus.yml << 'EOF'
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    
    rule_files:
    
    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
    
      - job_name: 'cloudbridge-relay'
        static_configs:
          - targets: ['cloudbridge-relay:8084']
    
      - job_name: 'node-exporter'
        static_configs:
          - targets: ['localhost:9100']
    EOF
  
  # Создание конфигурации CloudBridge
  - |
    cat > /opt/cloudbridge/configs/config.json << 'EOF'
    {
      "server": {
        "host": "0.0.0.0",
        "port": 9090,
        "read_timeout": "30s",
        "write_timeout": "30s",
        "idle_timeout": "120s"
      },
      "cadence": {
        "host": "cadence-service",
        "port": 7933,
        "domain": "cloudbridge",
        "task_list": "cloudbridge-tasks"
      },
      "cassandra": {
        "hosts": ["cassandra-service"],
        "port": 9042,
        "keyspace": "cloudbridge",
        "consistency": "quorum",
        "timeout": "10s"
      },
      "wireguard": {
        "enabled": true,
        "interface": "wg0",
        "port": 51820,
        "private_key_path": "/etc/wireguard/private.key",
        "public_key_path": "/etc/wireguard/public.key"
      },
      "quic": {
        "enabled": true,
        "port": 9090,
        "max_idle_timeout": "30s",
        "keep_alive_period": "10s"
      },
      "ai": {
        "enabled": true,
        "model_path": "/app/models",
        "max_concurrent_requests": 10,
        "timeout": "30s"
      },
      "logging": {
        "level": "info",
        "format": "json",
        "output": "stdout"
      },
      "metrics": {
        "enabled": true,
        "port": 8084,
        "path": "/metrics"
      },
      "health": {
        "enabled": true,
        "port": 9090,
        "path": "/health"
      }
    }
    EOF
  
  # Установка прав на конфигурацию
  - chown -R ubuntu:ubuntu /opt/cloudbridge
  
  # Создание systemd сервиса
  - |
    cat > /etc/systemd/system/cloudbridge-relay.service << 'EOF'
    [Unit]
    Description=CloudBridge Relay Service
    After=docker.service
    Requires=docker.service
    
    [Service]
    Type=oneshot
    RemainAfterExit=yes
    WorkingDirectory=/opt/cloudbridge
    ExecStart=/usr/local/bin/relay-start
    ExecStop=/usr/local/bin/relay-stop
    User=ubuntu
    Group=ubuntu
    
    [Install]
    WantedBy=multi-user.target
    EOF
  
  # Включение сервиса
  - systemctl daemon-reload
  - systemctl enable cloudbridge-relay
  
  # Финальная проверка
  - echo "CloudBridge Relay optimization completed successfully!"
  - echo "Instance: ${project_name}-${instance_id}"
  - echo "Load Balancer: ${load_balancer_enabled}"
  - echo "Monitoring: ${monitoring_enabled}"
  - echo "Auto Scaling: ${auto_scaling_enabled}"
  - echo "DDoS Protection: ${ddos_protection_level}"

# Финальные команды
final_message: |
  CloudBridge Relay с оптимизацией VK Cloud успешно настроен!
  
  Instance: ${project_name}-${instance_id}
  Load Balancer: ${load_balancer_enabled}
  Monitoring: ${monitoring_enabled}
  Auto Scaling: ${auto_scaling_enabled}
  DDoS Protection: ${ddos_protection_level}
  
  Полезные команды:
  - sudo relay-status    # Статус сервиса
  - sudo relay-start     # Запуск сервиса
  - sudo relay-stop      # Остановка сервиса
  - sudo ddos-status     # Статус DDoS защиты
  
  Доступные порты:
  - 80: HTTP (Nginx)
  - 443: HTTPS (Nginx)
  - 8080: Relay Server API
  - 8081: Relay Server Metrics
  - 3456: Relay Server Custom
  - 9090: QUIC Protocol (UDP)
  - 51820: WireGuard P2P Mesh (UDP)
  
  Мониторинг:
  - Grafana: http://localhost:3000
  - Prometheus: http://localhost:9091
  - Health Check: http://localhost/health
  - Metrics: http://localhost:8081/metrics
