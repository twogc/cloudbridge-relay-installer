apiVersion: v1
kind: Pod
metadata:
  name: test-cadence-workflow
  namespace: cloudbridge
  labels:
    app: test-cadence
spec:
  containers:
  - name: test-container
    image: alpine:latest
    command: ["sleep", "3600"]
    env:
    - name: CADENCE_HOST
      value: "cadence:7933"
    - name: CADENCE_DOMAIN
      value: "cloudbridge-p2p"
