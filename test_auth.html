<!DOCTYPE html>
<html>
<head>
    <title>Test Keycloak Auth</title>
    <script src="https://unpkg.com/oidc-client-ts@3.3.0/dist/oidc-client.min.js"></script>
</head>
<body>
    <h1>Test Keycloak Authentication</h1>
    <button onclick="login()">Login</button>
    <button onclick="logout()">Logout</button>
    <div id="status"></div>

    <script>
        const config = {
            authority: 'https://edge.2gc.ru/realms/cloudbridge',
            client_id: 'relay-client',
            redirect_uri: 'https://edge.2gc.ru:5173/callback',
            response_type: 'code',
            scope: 'openid profile email roles',
            post_logout_redirect_uri: 'https://edge.2gc.ru:5173',
            automaticSilentRenew: true,
            monitorSession: true,
            loadUserInfo: true,
        };

        const userManager = new Oidc.UserManager(config);

        userManager.events.addUserLoaded(function(user) {
            console.log('User loaded:', user);
            document.getElementById('status').innerHTML = 'User loaded: ' + user.profile.name;
        });

        userManager.events.addUserUnloaded(function() {
            console.log('User unloaded');
            document.getElementById('status').innerHTML = 'User unloaded';
        });

        userManager.events.addSilentRenewError(function(error) {
            console.error('Silent renew error:', error);
            document.getElementById('status').innerHTML = 'Silent renew error: ' + error;
        });

        userManager.events.addAccessTokenExpired(function() {
            console.log('Access token expired');
            document.getElementById('status').innerHTML = 'Access token expired';
        });

        userManager.events.addUserSignedOut(function() {
            console.log('User signed out');
            document.getElementById('status').innerHTML = 'User signed out';
        });

        function login() {
            console.log('Starting login...');
            document.getElementById('status').innerHTML = 'Starting login...';
            userManager.signinRedirect().catch(function(error) {
                console.error('Login error:', error);
                document.getElementById('status').innerHTML = 'Login error: ' + error;
            });
        }

        function logout() {
            console.log('Starting logout...');
            document.getElementById('status').innerHTML = 'Starting logout...';
            userManager.signoutRedirect().catch(function(error) {
                console.error('Logout error:', error);
                document.getElementById('status').innerHTML = 'Logout error: ' + error;
            });
        }

        // Check if we're returning from auth
        userManager.getUser().then(function(user) {
            if (user && !user.expired) {
                console.log('User already logged in:', user);
                document.getElementById('status').innerHTML = 'Already logged in: ' + user.profile.name;
            } else {
                console.log('No user or user expired');
                document.getElementById('status').innerHTML = 'No user or user expired';
            }
        }).catch(function(error) {
            console.error('Error getting user:', error);
            document.getElementById('status').innerHTML = 'Error getting user: ' + error;
        });
    </script>
</body>
</html>
