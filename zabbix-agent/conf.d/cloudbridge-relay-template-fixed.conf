# CloudBridge Relay Template UserParameters (FIXED FOR gRPC)
# Updated: 2025-09-27 17:20 - Исправлены метрики для реальных gRPC подключений
# Источник метрик: http://192.168.49.2:30081/metrics

# ===== Relay Server Items (ИСПРАВЛЕНО для gRPC) =====
# Общие подключения: суммируем все gRPC запросы
UserParameter=cloudbridge.relay.json.active_connections,curl -s http://192.168.49.2:30081/metrics | grep 'grpc_server_started_total' | awk '{s+=$2} END {print s+0}' || echo "0"
UserParameter=cloudbridge.relay.json.connections_total,curl -s http://192.168.49.2:30081/metrics | grep 'grpc_server_started_total' | awk '{s+=$2} END {print s+0}' || echo "0"

# gRPC специфичные метрики
UserParameter=cloudbridge.grpc.hello_requests,curl -s http://192.168.49.2:30081/metrics | grep 'grpc_server_started_total.*Hello' | awk '{print $2}' || echo "0"
UserParameter=cloudbridge.grpc.auth_requests,curl -s http://192.168.49.2:30081/metrics | grep 'grpc_server_started_total.*Authenticate' | awk '{print $2}' || echo "0"
UserParameter=cloudbridge.grpc.tunnel_requests,curl -s http://192.168.49.2:30081/metrics | grep 'grpc_server_started_total.*CreateTunnel' | awk '{print $2}' || echo "0"
UserParameter=cloudbridge.grpc.heartbeat_requests,curl -s http://192.168.49.2:30081/metrics | grep 'grpc_server_started_total.*SendHeartbeat' | awk '{print $2}' || echo "0"

# gRPC успешные операции (код OK)
UserParameter=cloudbridge.grpc.successful_operations,curl -s http://192.168.49.2:30081/metrics | grep 'grpc_server_handled_total.*grpc_code="OK"' | awk '{s+=$2} END {print s+0}' || echo "0"
UserParameter=cloudbridge.grpc.failed_operations,curl -s http://192.168.49.2:30081/metrics | grep 'grpc_server_handled_total' | grep -v 'grpc_code="OK"' | awk '{s+=$2} END {print s+0}' || echo "0"

# Системные метрики
UserParameter=cloudbridge.relay.json.uptime_seconds,curl -s http://192.168.49.2:30081/metrics | grep '^process_start_time_seconds ' | awk '{print systime() - $2}' || echo "0"
UserParameter=cloudbridge.relay.json.memory_alloc_mb,curl -s http://192.168.49.2:30081/metrics | grep '^go_memstats_alloc_bytes ' | awk '{printf "%.2f", $2/1024/1024}' || echo "0"
UserParameter=cloudbridge.relay.json.goroutines,curl -s http://192.168.49.2:30081/metrics | grep '^go_goroutines ' | awk '{print $2}' || echo "0"

# ===== System Items =====
UserParameter=cloudbridge.system.cpu.usage,top -bn1 | grep "Cpu(s)" | sed "s/.*, *\([0-9.]*\)%* id.*/\1/" | awk '{print 100 - $1}'
UserParameter=cloudbridge.system.memory.usage,free | awk 'FNR==2{printf "%.1f", ($3/($3+$4))*100}'
UserParameter=cloudbridge.system.disk.usage,df -h / | awk 'NR==2{print $5}' | sed 's/%//'
UserParameter=cloudbridge.system.network.connections,netstat -an | grep -c ESTABLISHED

# ===== Docker Items =====
UserParameter=cloudbridge.docker.containers.running,docker ps -q | wc -l 2>/dev/null || echo "0"
UserParameter=cloudbridge.docker.containers.total,docker ps -aq | wc -l 2>/dev/null || echo "0"
UserParameter=cloudbridge.docker.images.total,docker images -q | wc -l 2>/dev/null || echo "0"

# ===== Kubernetes Items =====
UserParameter=cloudbridge.k8s.pods.running,kubectl -n cloudbridge get pods --no-headers | grep "Running" | wc -l 2>/dev/null || echo "0"
UserParameter=cloudbridge.k8s.pods.total,kubectl -n cloudbridge get pods --no-headers | wc -l 2>/dev/null || echo "0"
UserParameter=cloudbridge.k8s.nodes.ready,kubectl get nodes --no-headers | grep "Ready" | wc -l 2>/dev/null || echo "0"

